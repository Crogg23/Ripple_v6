<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Library — Atlas</title>
<style>
:root{
  --surface:#0d1117; --panel:#121a24; --panel-2:#0f1620;
  --ink:#e8eaed; --ink-2:#9aa4b2; --ink-3:#6b7684;
  --rule:rgba(255,255,255,.10); --rule-2:rgba(255,255,255,.05);
  /* How sure we are a link is real. One colour, brightest = surest, fading
     down to a hunch. Checked for contrast against this background. */
  --t0:#fbc06a; --t1:#eda748; --t2:#d98d33; --t3:#bd7327; --t4:#9d5c1e; --t5:#7d4818;
  /* The five steps data goes through, getting brighter as it gets more useful. */
  --s0:#256abf; --s1:#3987e5; --s2:#6da7ec; --s3:#9ec5f4; --s4:#cde2fb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);overflow:hidden;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

/* Pinned to the window. Nothing here may ever push the page sideways: if the
   document can scroll horizontally, dragging the map scrolls the page instead
   and everything you click lands somewhere else. */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;align-items:center;gap:13px;padding:9px 16px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);background:var(--panel);z-index:5;
  max-width:100%;overflow:hidden;flex:none}
.brand{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);
  font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;flex:0 0 auto}
.brand b{color:var(--ink);font-weight:640}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:12px;letter-spacing:.05em;background:transparent;
  color:var(--ink-2);border:0;border-right:1px solid var(--rule);padding:6px 14px;cursor:pointer;
  font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.seg button[aria-pressed=true]{background:var(--ink);color:#0d1117;font-weight:600}
.seg button .n{opacity:.5;margin-right:7px}
#search{font:inherit;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;color:var(--ink);
  padding:6px 11px;min-width:0;flex:0 1 250px;outline:none}
#search:focus{border-color:#3d5875}
#search::placeholder{color:var(--ink-3)}
.tiers{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0;flex:1 1 auto}
.tiers .lbl{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.tiers button{font:inherit;font-size:11px;background:transparent;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:2px;padding:3px 8px;cursor:pointer;
  font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;gap:6px;
  white-space:nowrap}
.tiers button[aria-pressed=true]{color:var(--ink)}
.tiers button .sw{width:8px;height:8px;border-radius:1px;display:block;flex:none}
.tiers button[aria-pressed=false] .sw{opacity:.22}
.tiers button .ct{opacity:.6;font-variant-numeric:tabular-nums}
.spacer{margin-left:auto}
.hint{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:nowrap}
.hint kbd{border:1px solid var(--rule);border-radius:2px;padding:1px 5px;color:var(--ink-2)}

#main{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
/* Says what you're looking at, then gets out of the way of it. */
#lensnote{position:absolute;left:0;top:0;padding:16px 30px 30px 18px;max-width:460px;
  pointer-events:none;transition:opacity .6s ease;
  background:radial-gradient(120% 100% at 0% 0%, rgba(13,17,23,.95) 42%, rgba(13,17,23,0) 100%)}
#lensnote.faded{opacity:0}
#lensnote h2{margin:0;font-size:20px;font-weight:640;letter-spacing:-.01em}
#lensnote p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
#legend{position:absolute;left:0;bottom:0;padding:14px 34px 14px 18px;font-size:11.5px;
  color:var(--ink-3);font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none;
  line-height:1.8;
  background:radial-gradient(130% 130% at 0% 100%, rgba(13,17,23,.94) 45%, rgba(13,17,23,0) 100%)}
#legend .row{display:flex;align-items:center;gap:8px}
#legend .sw{width:9px;height:9px;border-radius:50%;display:block;flex:none}
#legend .sq{width:9px;height:9px;border-radius:1px;display:block;flex:none}
#status{position:absolute;right:0;bottom:0;padding:14px 18px 14px 34px;font-size:11.5px;
  color:var(--ink-3);font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none;
  text-align:right;
  background:radial-gradient(130% 130% at 100% 100%, rgba(13,17,23,.94) 45%, rgba(13,17,23,0) 100%)}

#tip{position:absolute;left:0;top:0;will-change:transform;
  pointer-events:none;z-index:6;background:rgba(13,17,23,.97);
  border:1px solid var(--rule);border-radius:3px;padding:8px 11px;max-width:340px;
  font-size:12px;line-height:1.55;color:var(--ink-2);display:none;
  box-shadow:0 6px 22px rgba(0,0,0,.55)}
#tip b{color:var(--ink);font-weight:600;word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
#tip .k{color:var(--t0)}

#panel{position:absolute;right:0;top:0;bottom:0;width:398px;background:var(--panel-2);
  border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .26s ease;
  display:flex;flex-direction:column;z-index:7}
#panel.open{transform:none}
#panel header{padding:15px 18px 13px;border-bottom:1px solid var(--rule);background:var(--panel)}
#panel header .dom{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--t0);
  font-family:ui-monospace,Menlo,Consolas,monospace}
#panel header h3{margin:6px 0 0;font-size:14px;font-weight:640;word-break:break-all;line-height:1.35;
  font-family:ui-monospace,Menlo,Consolas,monospace}
#panel .body{overflow-y:auto;padding:0 18px 34px;flex:1}
#close{position:absolute;right:12px;top:12px;background:transparent;border:1px solid var(--rule);
  color:var(--ink-3);border-radius:2px;width:24px;height:24px;cursor:pointer;font:inherit;line-height:1}
#close:hover{color:var(--ink)}
#panel h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  margin:24px 0 9px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
#panel p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
#panel p.small{font-size:12px;color:var(--ink-3);margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.chipset{display:flex;flex-wrap:wrap;gap:5px}
.chipset span{font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;color:var(--ink-2)}
.chipset span.rare{color:var(--t0);border-color:rgba(251,192,106,.42)}
.tierrow{display:flex;align-items:center;gap:9px;font-size:12.5px;margin:5px 0}
.tierrow .sw{width:9px;height:9px;border-radius:1px;flex:none}
.tierrow .nm{color:var(--ink-2);width:130px;flex:none}
.tierrow .ct{color:var(--ink);font-variant-numeric:tabular-nums;width:34px;text-align:right;flex:none;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.tierrow .bar{height:5px;border-radius:2px;flex:1;min-width:2px}
.lineage{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.75}
.lineage .step{display:flex;gap:9px;align-items:flex-start}
.lineage .dot{width:7px;height:7px;border-radius:1px;margin-top:6px;flex:none}
.lineage .nm{color:var(--ink-2);word-break:break-all}
.neigh button{display:flex;width:100%;gap:9px;align-items:center;background:transparent;
  border:0;border-bottom:1px solid var(--rule-2);color:var(--ink-2);padding:7px 0;cursor:pointer;
  font:inherit;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:left}
.neigh button:hover{color:var(--ink)}
.neigh .sw{width:7px;height:7px;border-radius:1px;flex:none}
.neigh .nm{flex:1;word-break:break-all}
.neigh .ct{color:var(--ink-3);flex:none}

#results{position:absolute;left:16px;top:52px;width:340px;max-height:52vh;overflow-y:auto;
  background:rgba(13,17,23,.98);border:1px solid var(--rule);border-radius:3px;display:none;z-index:8;
  box-shadow:0 10px 30px rgba(0,0,0,.6)}
#results button{display:flex;width:100%;gap:9px;align-items:baseline;background:transparent;border:0;
  border-bottom:1px solid var(--rule-2);color:var(--ink-2);padding:7px 11px;cursor:pointer;
  font:inherit;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;text-align:left}
#results button:hover,#results button.sel{background:rgba(255,255,255,.07);color:var(--ink)}
#results .nm{flex:1;word-break:break-all}
#results .meta{color:var(--ink-3);flex:none}
@media(max-width:1620px){ .hint{display:none} }
@media(max-width:860px){ #panel{width:100%} #lensnote{max-width:64%} }
</style>
</head>
<body>
<div id="app">

 <div id="bar">
  <div class="brand">Ripple · <b>The Library</b></div>

  <div class="seg" id="lenses" role="group" aria-label="How to arrange the map">
   <button data-lens="stacks"        aria-pressed="true"><span class="n">1</span>BY SUBJECT</button>
   <button data-lens="constellation" aria-pressed="false"><span class="n">2</span>BY CONNECTION</button>
   <button data-lens="refinery"      aria-pressed="false"><span class="n">3</span>BY JOURNEY</button>
  </div>

  <input id="search" type="search" placeholder="find a dataset, a subject, an ID…" autocomplete="off" spellcheck="false">

  <div class="tiers" id="tiers"><span class="lbl">show links</span></div>

  <div class="spacer"></div>
  <div class="hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> arrange · <kbd>/</kbd> find · <kbd>F</kbd> zoom out · <kbd>Esc</kbd> clear</div>
 </div>

 <div id="main">
  <canvas id="cv"></canvas>
  <div id="lensnote"><h2></h2><p></p></div>
  <div id="legend"></div>
  <div id="status"></div>
  <div id="tip"></div>
  <div id="results"></div>

  <aside id="panel">
   <button id="close" title="Close">×</button>
   <header><div class="dom"></div><h3></h3></header>
   <div class="body"></div>
  </aside>
 </div>
</div>

<script>
(function(){
"use strict";
const A = ANATOMY;
if(!A){document.body.innerHTML='<pre style="padding:24px;color:#fbc06a;font:13px monospace">'+
  'data not built in — run:  python -m viz.compile_anatomy --inline</pre>'; return;}

/* ====================================================================== data
   Everything below draws; nothing below thinks. All the layout was worked out
   ahead of time by viz/compile_anatomy.py and baked into the file. */
const T = A.tables, E = A.edges, XR = A.xref, LAB = A.ladder_labels;
const LAY = A.layouts, BOX = LAY.stacks.box, BW = BOX[0], BH = BOX[1];
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const TIER  = [0,1,2,3,4,5].map(i=>css("--t"+i));
const STAGE = [0,1,2,3,4].map(i=>css("--s"+i));
const STAGE_OF = {intake:0,staging:1,bridge:2,shelf:3,desk:4};
const INK=css("--ink"), INK2=css("--ink-2"), INK3=css("--ink-3");
const fmt = n => n.toLocaleString("en-US");
const N = T.length, R = LAY.refinery, C = LAY.constellation, S = LAY.stacks;

/* Sharpness costs frames, and how much it costs depends on the machine.
   A retina laptop wants 2 real pixels per point; on a small window that's free,
   but full-screen on a 4K monitor the same rule asks for 32 million pixels
   every frame and a smooth map turns into a stuttering one. We can't know in
   advance which machine this is, so we don't guess: we start sharp, watch how
   long frames actually take while the map is moving, and quietly trade a bit
   of sharpness for smoothness if it's needed. Smooth always wins — a map you
   drag is a map you're reading. */
const PIXEL_BUDGET = 16e6;                 // first guess, before any evidence
const WANT_DPR = Math.min(devicePixelRatio||1, 2);
let DPR = 1, dprCap = WANT_DPR, downgrades = 0;
function dprFor(w,h){
  if(w*h <= 0) return dprCap;
  const need = w*h*dprCap*dprCap;
  return Math.min(dprCap, need<=PIXEL_BUDGET ? dprCap
                        : Math.max(1, Math.sqrt(PIXEL_BUDGET/(w*h))));
}
/* Frame times are only meaningful while something is actually moving, so we
   only sample then. We step down, never up: chasing the line in both
   directions makes the picture flicker between sharpness levels. */
const _ft = []; let _lastFrame = 0;
function sampleFrame(now, busy){
  if(!busy){ _lastFrame = 0; _ft.length = 0; return; }
  if(_lastFrame){ _ft.push(now-_lastFrame); if(_ft.length>40) _ft.shift(); }
  _lastFrame = now;
  if(_ft.length<30 || downgrades>=2 || DPR<=1) return;
  const med = _ft.slice().sort((a,b)=>a-b)[15];
  if(med > 24){                            // under ~42fps: buy the frames back
    downgrades++; dprCap = Math.max(1, dprCap*0.72); _ft.length = 0;
    resize();
  }
}

const cellOf = new Array(N); for(const c of S.cells) cellOf[c.i]=c;
const bandOf = {}; for(const b of R.bands) bandOf[b.id]=b;      // no .find() in a loop
const stageLabel = {}; for(const s of A.stages) stageLabel[s.id]=s;

/* Where every dataset sits under each arrangement. Same list, same order, three
   sets of coordinates — which is what lets a dataset keep its identity and
   simply move when you change how the map is arranged. */
const POS = {
  stacks:        T.map((_,i)=>{const c=cellOf[i]; return [c.x+c.w/2, c.y+c.h/2];}),
  constellation: T.map((_,i)=>[C.nodes[i].x, C.nodes[i].y]),
  refinery:      T.map((_,i)=>{const s=XR[i]; return s>=0?[R.nodes[s].x,R.nodes[s].y]:null;}),
};
const intakeBand = bandOf.intake;
// Two datasets were measured but were never declared in the build, so they have
// no seat on the production line. We park them at the foot of it and draw them
// hollow rather than invent a place for them.
for(let i=0;i<N;i++) if(!POS.refinery[i])
  POS.refinery[i] = [intakeBand.x + intakeBand.w*(0.3+0.4*(i%2)), BH-14];
const SEATED = T.map((_,i)=>XR[i]>=0);

const CORE_SEAT = new Set(XR.filter(i=>i>=0));
const CTX = []; for(let i=0;i<R.nodes.length;i++) if(!CORE_SEAT.has(i)) CTX.push(i);

const adj = T.map(()=>[]);
E.forEach((e,i)=>{ adj[e[0]].push(i); adj[e[1]].push(i); });
const kids = R.nodes.map(()=>[]), pars = R.nodes.map(()=>[]);
for(const [a,b] of R.links){ kids[a].push(b); pars[b].push(a); }
const maxDeg = Math.max(1, ...T.map(t=>t.deg));
const logMax = Math.log10(Math.max(...T.map(t=>t.rows||1), 10));
const FAM = {}; for(const t of T) for(const k of t.keys) FAM[k]=(FAM[k]||0)+1;
// An ID only tells you something if it's rare. Nearly every dataset has a name
// and a ZIP code, so those can't pick anyone out on their own.
const RARE = k => (FAM[k]||0) <= 45;

const LENSES = {
  stacks:{title:"Arranged by subject",
    note:"Every dataset, in a room with the others about the same thing. Bigger room, more datasets. Bigger tile, more records inside it. Nothing ever moves between builds, so you can learn where things live — like a real building."},
  constellation:{title:"Arranged by what connects to what",
    note:"Two datasets can only be linked if they share an ID — a doctor's licence number, a company's tax number, a ZIP code. Each one sits beside the ID it's identified by. The bright ones in the middle carry two rare IDs each, and those are the ones that let a question travel from doctors to companies to places."},
  refinery:{title:"Arranged by the journey data takes",
    note:"Left to right is the order things actually happen. Raw files land, get tidied up, a few get combined, most become ready-to-use tables, and a handful end up in a queue for a person to check."},
};

/* ==================================================================== camera
   Geometry is drawn in map coordinates under a single canvas transform, so
   panning and zooming never rebuild a shape. Text is drawn afterwards with the
   transform reset, so it stays the same size no matter how far you zoom. */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const cam = {k:1,tx:0,ty:0,kfit:1,set:false};
let W=0,H=0;
function resize(){
  const r = cv.getBoundingClientRect(); W=r.width; H=r.height;
  DPR = dprFor(W,H);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cam.kfit = Math.min(W/BW, H/BH)*0.93;
  if(!cam.set){ cam.set=true; fit(); } else draw();
}
function fit(){ cam.k=cam.kfit; cam.tx=(W-BW*cam.k)/2; cam.ty=(H-BH*cam.k)/2; draw(); }
const sx = x => x*cam.k+cam.tx, sy = y => y*cam.k+cam.ty;
const wx = x => (x-cam.tx)/cam.k, wy = y => (y-cam.ty)/cam.k;
const zoom = () => cam.k/cam.kfit;

/* ===================================================================== state */
let lens = "stacks", prevLens = "stacks", motion = 0, tweenT0 = 0;
let hov = -1, sel = -1, focus = null, threadsAll = false, drag = null;
const tiersOn = new Set([0,1,2,3,4,5]);
let raf = 0;
function draw(){ if(!raf) raf = requestAnimationFrame(frame); }

const ease = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
// Writes into a reused pair so hovering 2,700 edges doesn't litter the heap.
const _p = [0,0];
function posInto(i, out){
  const b = POS[lens][i];
  if(motion<=0){ out[0]=b[0]; out[1]=b[1]; return out; }
  const a = POS[prevLens][i], e = ease(1-motion);
  out[0]=a[0]+(b[0]-a[0])*e; out[1]=a[1]+(b[1]-a[1])*e; return out;
}

/* ============================================================ baked geometry
   The expensive shapes get built once per arrangement and then just drawn.
   This is the whole performance story: 2,694 curves become one stroke call. */
const baked = {};                       // lens -> {joins:[Path2D], lineage, ctx:[Path2D]}
function bakeFor(name){
  if(baked[name]) return baked[name];
  const P = POS[name], arc = name!=="refinery";
  const joins = TIER.map(()=>new Path2D());
  for(const e of E){
    const p=P[e[0]], q=P[e[1]], path=joins[e[2]];
    path.moveTo(p[0],p[1]);
    if(arc){
      const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2;
      path.quadraticCurveTo(mx+(BW/2-mx)*0.16, my+(BH/2-my)*0.16, q[0],q[1]);
    } else {
      // On the production line every link sits inside one bank, so bowing them
      // toward the middle would drag them across unrelated stages.
      path.quadraticCurveTo((p[0]+q[0])/2, (p[1]+q[1])/2-Math.abs(q[1]-p[1])*0.22, q[0],q[1]);
    }
  }
  let lineage=null, ctxCells=null, coreCells=null, coreCaps=null;
  if(name==="refinery"){
    lineage = new Path2D();
    for(const [a,b] of R.links){
      const u=R.nodes[a], v=R.nodes[b], mx=(u.x+v.x)/2;
      lineage.moveTo(u.x,u.y); lineage.bezierCurveTo(mx,u.y,mx,v.y,v.x,v.y);
    }
    ctxCells = STAGE.map(()=>new Path2D());
    for(const i of CTX){
      const n=R.nodes[i], c=bandOf[n.s].cell;
      ctxCells[STAGE_OF[n.s]].rect(n.x-c/2, n.y-c/2, c, c);
    }
    coreCells = new Path2D(); coreCaps = new Path2D();
    const c = intakeBand.cell;
    for(let i=0;i<N;i++){
      if(!SEATED[i]) continue;
      const n=R.nodes[XR[i]];
      coreCells.rect(n.x-c/2, n.y-c/2, c, c);
      if(T[i].deg>0) coreCaps.rect(n.x-c/2, n.y-c/2, c, Math.max(c*0.34,1.2));
    }
  }
  let shelves=null;
  if(name==="stacks"){
    // Tiles bucketed by brightness: 12 fills instead of 368.
    shelves = Array.from({length:12},()=>new Path2D());
    for(let i=0;i<N;i++){
      const c=cellOf[i];
      const m = Math.log10(Math.max(T[i].rows,1))/logMax;
      shelves[Math.min(11,Math.max(0,Math.round(m*11)))]
        .rect(c.x+.6,c.y+.6,Math.max(c.w-1.2,.4),Math.max(c.h-1.2,.4));
    }
  }
  return baked[name] = {joins, lineage, ctxCells, coreCells, coreCaps, shelves};
}
// Well glows are position-bound, so in map coordinates they can be made once.
const wellFills = C.wells.map(w=>{
  const r = 34+Math.sqrt(w.n)*7;
  const g = ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,r);
  g.addColorStop(0,"rgba(157,180,215,.14)"); g.addColorStop(1,"rgba(157,180,215,0)");
  return {g, r};
});

function setLens(next){
  if(next===lens) return;
  prevLens = lens; lens = next; motion = 1; tweenT0 = performance.now();
  bakeFor(next);
  for(const b of document.querySelectorAll("#lenses button"))
    b.setAttribute("aria-pressed", b.dataset.lens===next);
  showNote(LENSES[next]); legend(); draw();
}
let noteTimer = 0;
function showNote(L){
  const el = document.getElementById("lensnote");
  el.querySelector("h2").textContent = L.title;
  el.querySelector("p").textContent  = L.note;
  el.classList.remove("faded");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>el.classList.add("faded"), 9000);
}

/* ============================================================= static layer
   Dragging the map only slides it — every line keeps its shape and its size.
   So we draw the rooms, wells, banks and links once onto a hidden canvas a
   little larger than the window, and while you drag we just slide that picture
   across. It's not an approximation: a slide of a picture is exactly what a
   slide of the map looks like. It's redrawn properly the moment anything that
   isn't a slide happens — zoom, a different arrangement, a link switched off. */
const PAD = 320;
const sCv = document.createElement("canvas"), sCtx = sCv.getContext("2d");
const cache = {valid:false, k:0, tx:0, ty:0, lens:"", focus:false, sig:"", w:0, h:0};
/* Everything the cached picture depends on. `sel` is in here because on the
   journey view the selected dataset's chain is lit inside that picture. */
function cacheSig(){
  return lens+"|"+sel+"|"+(focus?1:0)+"|"+(threadsAll?1:0)+"|"
       + [...tiersOn].sort().join("")+"|"+DPR+"|"+W+"x"+H;
}
function renderStatic(){
  const w = W+PAD*2, h = H+PAD*2;
  if(cache.w!==w||cache.h!==h){
    sCv.width=Math.round(w*DPR); sCv.height=Math.round(h*DPR); cache.w=w; cache.h=h;
  }
  const keep = ctx;                       // the draw helpers write to `ctx`
  cur = sCtx;
  sCtx.setTransform(DPR,0,0,DPR,0,0);
  sCtx.clearRect(0,0,w,h);
  sCtx.setTransform(DPR*cam.k,0,0,DPR*cam.k,
                    DPR*(cam.tx+PAD), DPR*(cam.ty+PAD));
  const px = 1/cam.k;
  if(lens==="stacks"){ drawRooms(1); drawShelves(px); }
  if(lens==="constellation") drawWells(1);
  if(lens==="refinery"){ drawBands(1); drawLineage(1,px); drawStations(1,px); }
  drawJoinsBase(px);
  cur = keep;
  cache.valid=true; cache.k=cam.k; cache.tx=cam.tx; cache.ty=cam.ty;
  cache.sig=cacheSig();
}
function cacheUsable(){
  return cache.valid && cache.k===cam.k && cache.sig===cacheSig()
      && Math.abs(cam.tx-cache.tx)<=PAD && Math.abs(cam.ty-cache.ty)<=PAD;
}
const invalidate = ()=>{ cache.valid=false; };

/* ====================================================================== draw */
function frame(now){
  raf = 0;
  const moving = motion>0;
  sampleFrame(now, moving || !!drag);
  if(moving){ motion = Math.max(0, 1-(now-tweenT0)/780); draw(); }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  const z = zoom(), settled = motion<=0;
  const wOf = n => (lens===n?1:0)*(1-motion) + (prevLens===n?1:0)*motion;
  const wR = wOf("refinery"), wC = wOf("constellation"), wS = wOf("stacks");
  const px = 1/cam.k;                              // one screen pixel, in map units

  // ---- everything with a shape, in map coordinates
  if(settled){
    // Settled: use (or refresh) the cached picture, then slide it into place.
    if(!cacheUsable()) renderStatic();
    // World point x sits at (cache.tx + PAD + k*x) inside the cached picture and
    // must land at (cam.tx + k*x) on screen, so the picture is offset by how far
    // we've panned SINCE it was made, minus the padding. Get this sign wrong and
    // the map and everything drawn on top of it drift apart as you drag — which
    // is exactly what it did.
    ctx.drawImage(sCv, 0,0, sCv.width, sCv.height,
      (cache.tx-cam.tx)-PAD, (cache.ty-cam.ty)-PAD, cache.w, cache.h);
    ctx.save();
    ctx.setTransform(DPR*cam.k,0,0,DPR*cam.k, DPR*cam.tx, DPR*cam.ty);
    drawJoinsFocus(px);
    ctx.restore();
  } else {
    // Mid-move nothing is stable enough to cache, and the two arrangements
    // are crossfading, so this is drawn straight.
    ctx.save();
    ctx.setTransform(DPR*cam.k,0,0,DPR*cam.k, DPR*cam.tx, DPR*cam.ty);
    if(wS>0.01) drawRooms(wS);
    if(wC>0.01) drawWells(wC);
    if(wR>0.01){ drawBands(wR); drawLineage(wR,px); drawStations(wR,px); }
    ctx.restore();
  }

  // ---- everything made of dots and words, in screen pixels
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawDots(z, wS, settled);
  if(settled) drawLabels(z);
  if(wS>0.01) roomNames(wS);
  if(wC>0.01) wellNames(wC);
  if(wR>0.01) bandNames(wR);
  status();
}

/* These draw shapes, and they draw them into `cur` — which is the screen most
   of the time and the cached picture when we're rebuilding it. */
let cur = ctx;
function drawRooms(a){
  cur.globalAlpha=a;
  cur.fillStyle="rgba(255,255,255,.035)"; cur.strokeStyle="rgba(255,255,255,.15)";
  cur.lineWidth=1/cam.k;
  for(const r of S.rooms){ cur.fillRect(r.x,r.y,r.w,r.h); cur.strokeRect(r.x,r.y,r.w,r.h); }
  cur.globalAlpha=1;
}
function drawShelves(px){
  const sh = bakeFor("stacks").shelves;
  for(let b=0;b<12;b++){
    cur.fillStyle = `rgba(226,233,243,${(0.17+0.62*(b/11)).toFixed(3)})`;
    cur.fill(sh[b]);
  }
}
function drawWells(a){
  cur.globalAlpha=a;
  C.wells.forEach((w,i)=>{
    const f = wellFills[i];
    cur.fillStyle=f.g; cur.beginPath(); cur.arc(w.x,w.y,f.r,0,7); cur.fill();
  });
  cur.globalAlpha=1;
}
function drawBands(a){
  cur.globalAlpha=a; cur.fillStyle="rgba(255,255,255,.022)";
  for(const b of R.bands) cur.fillRect(b.x-8, 18, b.w+16, BH-40);
  cur.globalAlpha=1;
}
function drawLineage(a, px){
  cur.globalAlpha=a*(focus?0.07:0.20);
  cur.strokeStyle="rgb(120,150,190)"; cur.lineWidth=0.9*px;
  cur.stroke(bakeFor("refinery").lineage);
  cur.globalAlpha=1;
}
/* Where the links belong depends on how the map is arranged. When it's arranged
   by connection they ARE the point, so all of them are drawn. Over a floor plan
   or a production line they'd bury it, so there they're drawn for whatever
   you've picked — unless you deliberately ask for all of them. */
function drawJoinsBase(px){
  if(!(lens==="constellation" || threadsAll)) return;
  const paths = bakeFor(lens).joins;
  for(let t=TIER.length-1;t>=0;t--){
    if(!tiersOn.has(t)) continue;
    cur.strokeStyle=TIER[t];
    cur.globalAlpha = focus?0.05:(t===0?0.46:0.20);
    cur.lineWidth = (t===0?1.1:0.8)*px;
    cur.stroke(paths[t]);
  }
  cur.globalAlpha=1;
}
function drawJoinsFocus(px){
  if(focus){
    // Only the picked dataset's own links, drawn one by one — at most a few
    // hundred, and only while something is actually selected.
    const P = POS[lens], arc = lens!=="refinery", src = sel>=0?adj[sel]:[];
    ctx.lineWidth=1.6*px; ctx.globalAlpha=0.95;
    for(const ei of src){
      const e=E[ei]; if(!tiersOn.has(e[2])) continue;
      const p=P[e[0]], q=P[e[1]];
      ctx.strokeStyle=TIER[e[2]]; ctx.beginPath(); ctx.moveTo(p[0],p[1]);
      if(arc){ const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
        ctx.quadraticCurveTo(mx+(BW/2-mx)*0.16,my+(BH/2-my)*0.16,q[0],q[1]); }
      else ctx.quadraticCurveTo((p[0]+q[0])/2,(p[1]+q[1])/2-Math.abs(q[1]-p[1])*0.22,q[0],q[1]);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}
function drawStations(a, px){
  const B = bakeFor("refinery");
  const lit = focus && sel>=0 && SEATED[sel] ? chainOf(XR[sel]) : null;
  if(lit){
    // Something is selected, so each cell needs its own brightness.
    cur.globalAlpha=a*0.10;
    for(let s=0;s<5;s++){ cur.fillStyle=STAGE[s]; cur.fill(B.ctxCells[s]); }
    cur.globalAlpha=a;
    for(const i of lit){
      const n=R.nodes[i], c=bandOf[n.s].cell;
      cur.fillStyle=STAGE[STAGE_OF[n.s]];
      cur.fillRect(n.x-c/2,n.y-c/2,c,c);
    }
  } else {
    cur.globalAlpha=a*0.72;
    for(let s=0;s<5;s++){ cur.fillStyle=STAGE[s]; cur.fill(B.ctxCells[s]); }
    cur.globalAlpha=a;
    cur.fillStyle=STAGE[0]; cur.fill(B.coreCells);
    cur.fillStyle=TIER[0];  cur.fill(B.coreCaps);
  }
  cur.globalAlpha=1;
}
/* The 368 datasets themselves. Drawn in screen pixels so they stay a sensible
   size at any zoom, and there are few enough that a plain loop is fine. */
function drawDots(z, wS, settled){
  // Each arrangement says its piece with its own mark. Settled on the subject
  // view a dataset is a shelf; on the journey view it's a station in its bank.
  // Both of those are already in the cached picture, so a dot on top would be
  // the same thing drawn twice. Mid-move everything falls back to a dot.
  const dots = !settled || lens==="constellation";
  if(dots){
    const lit = focus;
    for(let i=0;i<N;i++){
      posInto(i,_p);
      const X=sx(_p[0]), Y=sy(_p[1]);
      if(X<-30||X>W+30||Y<-30||Y>H+30) continue;
      ctx.globalAlpha = (!lit||lit.has(i))?1:0.13;
      const n=C.nodes[i];
      ctx.fillStyle = !n.keyed ? "#41505f" : n.w>=2 ? "#eef1f5" : n.w===1 ? "#9fb0c6" : "#5d6d80";
      ctx.beginPath(); ctx.arc(X,Y, 2.2+5.6*Math.sqrt(T[i].deg/maxDeg), 0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // Whatever you've picked or are pointing at gets a ring, in every arrangement.
  for(const i of [sel,hov]){
    if(i<0) continue;
    posInto(i,_p);
    ctx.strokeStyle = i===sel?"#fff":"rgba(255,255,255,.62)";
    ctx.lineWidth = i===sel?2:1.4;
    ctx.beginPath(); ctx.arc(sx(_p[0]), sy(_p[1]), 11, 0,7); ctx.stroke();
  }
}
const _tw = new Map();                             // measured widths, kept
function drawLabels(z){
  if(z<1.5) return;
  const cut = z<2.4 ? maxDeg*0.35 : z<4 ? maxDeg*0.10 : -1;
  ctx.font="11px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
  const placed=[];
  for(let i=0;i<N;i++){
    if(T[i].deg<cut) continue;
    if(focus && !focus.has(i)) continue;
    posInto(i,_p);
    const X=sx(_p[0]), Y=sy(_p[1])-11;
    if(X<0||X>W||Y<12||Y>H) continue;
    const nm = T[i].n.length>34 ? T[i].n.slice(0,32)+"…" : T[i].n;
    let wdt=_tw.get(nm); if(wdt===undefined){ wdt=ctx.measureText(nm).width; _tw.set(nm,wdt); }
    if(placed.some(q=>Math.abs(q[0]-X)<(q[2]+wdt)/2+7 && Math.abs(q[1]-Y)<12)) continue;
    placed.push([X,Y,wdt]);
    ctx.fillStyle="rgba(13,17,23,.82)"; ctx.fillRect(X-wdt/2-3,Y-9,wdt+6,12);
    ctx.fillStyle=INK2; ctx.fillText(nm,X,Y);
  }
}
function roomNames(a){
  ctx.globalAlpha=a; ctx.font="600 11px ui-monospace,Menlo,monospace"; ctx.textAlign="left";
  for(const r of S.rooms){
    const t = r.d.replace(/_/g," ")+"  "+r.n;
    if(ctx.measureText(t).width > r.w*cam.k-10 || r.h*cam.k<18) continue;
    ctx.fillStyle="rgba(232,234,237,.8)"; ctx.fillText(t, sx(r.x)+6, sy(r.y)+13);
  }
  ctx.globalAlpha=1;
}
function wellNames(a){
  ctx.globalAlpha=a;
  for(const w of C.wells){
    const dx=w.x-BW/2, dy=w.y-BH/2, d=Math.hypot(dx,dy)||1, m=1+92/d;
    const lx=sx(BW/2+dx*m), ly=sy(BH/2+dy*m);
    ctx.textAlign = Math.abs(dx)<70 ? "center" : (dx>0?"left":"right");
    ctx.fillStyle=INK; ctx.font="600 13px ui-monospace,Menlo,monospace";
    ctx.fillText(w.k, lx, ly);
    ctx.fillStyle=INK3; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText(w.h+" here · "+w.n+" use it", lx, ly+13);
  }
  ctx.globalAlpha=1;
}
function bandNames(a){
  ctx.globalAlpha=a; ctx.textAlign="center";
  for(const b of R.bands){
    const st=stageLabel[b.id];
    ctx.fillStyle=INK3; ctx.font="600 12px ui-monospace,Menlo,monospace";
    ctx.fillText(st.label, sx(b.x+b.w/2), sy(12));
    ctx.fillStyle="rgba(255,255,255,.34)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText(fmt(st.count), sx(b.x+b.w/2), sy(BH-4));
  }
  ctx.globalAlpha=1;
}
function chainOf(seat){
  const seen=new Set([seat]), st=[seat];
  while(st.length){const c=st.pop(); for(const n of kids[c]) if(!seen.has(n)){seen.add(n);st.push(n);}}
  const s2=[seat]; while(s2.length){const c=s2.pop(); for(const n of pars[c]) if(!seen.has(n)){seen.add(n);s2.push(n);}}
  return seen;
}

/* ================================================================== picking */
function pick(mx,my){
  const px=wx(mx), py=wy(my);
  if(lens==="stacks" && motion<=0){
    for(const c of S.cells)
      if(px>=c.x&&px<=c.x+c.w&&py>=c.y&&py<=c.y+c.h) return c.i;
    return -1;
  }
  const rad=16/cam.k; let best=rad*rad, f=-1;
  for(let i=0;i<N;i++){
    posInto(i,_p);
    const dx=_p[0]-px, dy=_p[1]-py, d=dx*dx+dy*dy;
    if(d<best){best=d;f=i;}
  }
  return f;
}

/* =================================================================== chrome */
const tip = document.getElementById("tip");
let tipW=0, tipH=0, tipFor=-1, tipOn=false;
function showTip(i, mx, my){
  if(i!==tipFor){
    const t=T[i];
    tip.innerHTML = `<b>${t.n}</b><br><span class="k">${t.dom.replace(/_/g," ").toLowerCase()}</span> · `+
      `${fmt(t.rows)} records · ${t.deg} link${t.deg===1?"":"s"}<br>`+
      (t.keys.length?`IDs: ${t.keys.join(", ")}`:"no ID to match on");
    tip.style.display="block"; tipOn=true;
    // The one place we do measure — only when the words changed, never on a move.
    const r=tip.getBoundingClientRect(); tipW=r.width; tipH=r.height; tipFor=i;
  }
  // Transform, not left/top: it moves the tooltip without asking the browser
  // to lay the page out again.
  tip.style.transform = `translate(${Math.min(mx+14, W-tipW-10)}px,${Math.min(my+14, H-tipH-10)}px)`;
}
function hideTip(){ if(!tipOn) return; tip.style.display="none"; tipOn=false; tipFor=-1; }

let liveLinks = E.length;                          // recounted only when tiers change
function countLinks(){ liveLinks = E.reduce((n,e)=>n+(tiersOn.has(e[2])?1:0),0); }
function status(){
  const drawn = (lens==="constellation"||threadsAll) ? `${fmt(liveLinks)} of ${fmt(E.length)} links drawn`
              : focus ? "links drawn for what you picked"
              : "pick a dataset to see its links";
  document.getElementById("status").textContent =
    `${fmt(N)} datasets · ${drawn} · zoom ${zoom().toFixed(1)}×`;
}
function legend(){
  const el = document.getElementById("legend");
  if(lens==="refinery"){
    el.innerHTML = A.stages.map((s,i)=>
      `<div class="row"><i class="sq" style="background:${STAGE[i]}"></i>${s.label.toLowerCase()} — ${fmt(s.count)}</div>`).join("")
      + `<div class="row"><i class="sq" style="background:${TIER[0]}"></i>gold cap — we've found links for this one</div>`;
  } else if(lens==="constellation"){
    el.innerHTML =
      `<div class="row"><i class="sw" style="background:#eef1f5"></i>two rare IDs — can bridge two worlds</div>`+
      `<div class="row"><i class="sw" style="background:#9fb0c6"></i>one rare ID</div>`+
      `<div class="row"><i class="sw" style="background:#5d6d80"></i>only common IDs, like a name or a ZIP</div>`+
      `<div class="row"><i class="sw" style="background:#41505f"></i>nothing to match on yet</div>`+
      `<div class="row">dot size — how many links it has</div>`;
  } else {
    el.innerHTML =
      `<div class="row">tile size &amp; brightness — how many records</div>`+
      `<div class="row">room size — how many datasets on that subject</div>`+
      `<div class="row">pick any tile to see what it links to</div>`;
  }
}

/* The links, weakest to strongest, and you can switch any of them off. This
   stays on screen permanently and never hides in a menu: it is the control
   that stops a hunch being shown to you as a fact. */
const tiersEl = document.getElementById("tiers");
const tierCount = {}; for(const e of E) tierCount[e[2]]=(tierCount[e[2]]||0)+1;
LAB.forEach((L,i)=>{
  if(!tierCount[i]) return;
  const b=document.createElement("button");
  b.setAttribute("aria-pressed","true"); b.title = L[1];
  b.innerHTML = `<i class="sw" style="background:${TIER[i]}"></i>${L[0]}<span class="ct">${fmt(tierCount[i])}</span>`;
  b.onclick = ()=>{
    const on = b.getAttribute("aria-pressed")!=="true";
    b.setAttribute("aria-pressed", on);
    on ? tiersOn.add(i) : tiersOn.delete(i);
    countLinks(); draw();
  };
  tiersEl.appendChild(b);
});
const allBtn = document.createElement("button");
allBtn.setAttribute("aria-pressed","false");
allBtn.title = "Draw every link at once, however the map is arranged. Over the "+
               "subject and journey views that's a deliberate mess — worth a look, "+
               "not somewhere to work.";
allBtn.textContent = "show all at once";
allBtn.onclick = ()=>{ threadsAll=!threadsAll; allBtn.setAttribute("aria-pressed",threadsAll); draw(); };
tiersEl.appendChild(allBtn);

/* ==================================================================== panel */
const panel = document.getElementById("panel");
function openPanel(i){
  sel=i; focus=new Set([i]);
  for(const ei of adj[i]){ focus.add(E[ei][0]); focus.add(E[ei][1]); }
  const t=T[i];
  panel.querySelector(".dom").textContent = t.dom.replace(/_/g," ").toLowerCase();
  panel.querySelector("h3").textContent = t.n;

  const byTier={};
  for(const ei of adj[i]) byTier[E[ei][2]]=(byTier[E[ei][2]]||0)+1;
  const maxT = Math.max(1,...Object.values(byTier));
  const neigh = adj[i].map(ei=>{const e=E[ei];
      return {j:e[0]===i?e[1]:e[0], tier:e[2], key:e[3], matched:e[4]};})
    .sort((a,b)=>a.tier-b.tier||b.matched-a.matched).slice(0,40);

  let chain;
  if(SEATED[i]){
    const seat=XR[i], order=[];
    const walk=(u,dir,depth)=>{ for(const v of (dir>0?kids[u]:pars[u])){
      if(order.some(o=>o.n===v)) continue; order.push({n:v,d:depth*dir}); walk(v,dir,depth+1); } };
    walk(seat,1,1); walk(seat,-1,1);
    const all=[{n:seat,d:0}].concat(order).sort((a,b)=>a.d-b.d);
    chain = all.slice(0,26).map(o=>{ const n=R.nodes[o.n];
      return `<div class="step"><i class="dot" style="background:${STAGE[STAGE_OF[n.s]]}"></i>`+
        `<span class="nm" style="${o.n===seat?'color:#e8eaed':''}">${n.id}</span></div>`;}).join("")
      + (all.length>26?`<div class="step"><span class="nm">and ${all.length-26} more</span></div>`:"");
  } else {
    chain = `<p>We measured this one, but it was never wired into the build — so there's no journey to show. That's a gap in our plumbing, not something about the data.</p>`;
  }

  panel.querySelector(".body").innerHTML =
    (t.desc?`<h4>What this is</h4><p>${t.desc}</p>`:"")+
    `<h4>The numbers</h4><dl class="kv">
      <dt>records</dt><dd>${fmt(t.rows)}</dd>
      <dt>links</dt><dd>${t.deg}</dd>
      <dt>subject</dt><dd>${t.dom.replace(/_/g," ").toLowerCase()}</dd></dl>`+
    `<h4>What it can be matched on</h4><div class="chipset">`+
      (t.keys.length? t.keys.map(k=>`<span class="${RARE(k)?"rare":""}">${k}</span>`).join("")
                    : `<span>nothing yet</span>`)+`</div>`+
      (t.keys.length?`<p class="small">Gold means an ID rare enough to pick out one specific thing. Almost every dataset has a name and a ZIP code, so those two can't identify anyone on their own.</p>`:"")+
    (t.deg?`<h4>How sure we are of its links</h4>`+
      LAB.map((L,ti)=> byTier[ti]?
        `<div class="tierrow" title="${L[1]}"><i class="sw" style="background:${TIER[ti]}"></i>`+
        `<span class="nm">${L[0]}</span><span class="ct">${byTier[ti]}</span>`+
        `<i class="bar" style="background:${TIER[ti]};width:${100*byTier[ti]/maxT}%"></i></div>`:"").join("")
      :"")+
    (neigh.length?`<h4>Links to</h4><div class="neigh">`+
      neigh.map(x=>`<button data-go="${x.j}"><i class="sw" style="background:${TIER[x.tier]}"></i>`+
        `<span class="nm">${T[x.j].n}</span><span class="ct">${x.key}</span></button>`).join("")+
      `</div>`:"")+
    `<h4>Where it comes from, and where it goes</h4><div class="lineage">${chain}</div>`;

  panel.querySelectorAll("[data-go]").forEach(b=>
    b.onclick=()=>{ openPanel(+b.dataset.go); centerOn(+b.dataset.go); });
  panel.classList.add("open");
  draw();
}
function closePanel(){ panel.classList.remove("open"); sel=-1; focus=null; draw(); }
document.getElementById("close").onclick = closePanel;
function centerOn(i){
  const p=POS[lens][i];
  cam.k = Math.max(cam.k, cam.kfit*2.4);
  const vis = panel.classList.contains("open") ? W-panel.offsetWidth : W;
  cam.tx = vis/2 - p[0]*cam.k; cam.ty = H/2 - p[1]*cam.k;
  draw();
}

/* =================================================================== search */
const searchEl = document.getElementById("search"), resEl = document.getElementById("results");
let hits=[], hi=0;
function runSearch(){
  const q = searchEl.value.trim().toUpperCase();
  if(q.length<2){ resEl.style.display="none"; hits=[]; if(focus&&sel<0){focus=null;draw();} return; }
  hits=[];
  for(let i=0;i<N;i++){
    const t=T[i];
    const s = t.n.includes(q)?0 : t.dom.includes(q)?1 : t.keys.some(k=>k===q)?1
            : (t.desc||"").toUpperCase().includes(q)?2 : -1;
    if(s>=0) hits.push({i,s});
  }
  hits.sort((a,b)=>a.s-b.s||T[b.i].deg-T[a.i].deg);
  hits=hits.slice(0,60); hi=0;
  resEl.innerHTML = hits.length ? hits.map((h,n)=>
      `<button data-i="${h.i}" class="${n===0?"sel":""}"><span class="nm">${T[h.i].n}</span>`+
      `<span class="meta">${T[h.i].deg} links</span></button>`).join("")
    : `<button disabled style="color:#6b7684">nothing found</button>`;
  resEl.style.display="block";
  resEl.querySelectorAll("[data-i]").forEach(b=>
    b.onclick=()=>{ const i=+b.dataset.i; openPanel(i); centerOn(i);
                    resEl.style.display="none"; searchEl.blur(); });
  focus=new Set(hits.map(h=>h.i)); sel=-1; draw();
}
searchEl.addEventListener("input", runSearch);
searchEl.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ searchEl.value=""; runSearch(); searchEl.blur(); }
  if(!hits.length) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault(); hi=(hi+(e.key==="ArrowDown"?1:hits.length-1))%hits.length;
    resEl.querySelectorAll("button").forEach((b,n)=>b.classList.toggle("sel",n===hi));
    resEl.children[hi]?.scrollIntoView({block:"nearest"});
  }
  if(e.key==="Enter"){ const i=hits[hi].i; openPanel(i); centerOn(i);
    resEl.style.display="none"; searchEl.blur(); }
});

/* ==================================================================== input */
/* offsetX/offsetY are already relative to the canvas, cost nothing to read, and
   stay correct if the page scrolls or the toolbar wraps to a second line. Working
   them out by hand from a remembered element position is how a click ends up
   selecting the wrong thing. */
cv.addEventListener("mousedown", e=>{
  drag={x:e.clientX, y:e.clientY, ox:e.offsetX, oy:e.offsetY,
        tx:cam.tx, ty:cam.ty, moved:0};
  cv.classList.add("drag");
});
addEventListener("mouseup", ()=>{
  if(drag && drag.moved<4){
    const i=pick(drag.ox, drag.oy);     // where the press landed, exactly
    if(i>=0) openPanel(i); else closePanel();
  }
  drag=null; cv.classList.remove("drag");
});
cv.addEventListener("mousemove", e=>{
  if(drag){ drag.moved+=Math.abs(e.movementX)+Math.abs(e.movementY);
    cam.tx=drag.tx+(e.clientX-drag.x); cam.ty=drag.ty+(e.clientY-drag.y);
    hideTip(); draw(); return; }
  const i=pick(e.offsetX, e.offsetY);
  if(i!==hov){ hov=i; draw(); }        // cheap now: the map itself is cached
  if(i>=0) showTip(i, e.offsetX, e.offsetY); else hideTip();
});
cv.addEventListener("mouseleave", ()=>{ if(hov>=0){hov=-1; draw();} hideTip(); });
cv.addEventListener("wheel", e=>{
  e.preventDefault();
  const mx=e.offsetX, my=e.offsetY;
  const bx=wx(mx), by=wy(my);
  cam.k = Math.max(cam.kfit*0.55, Math.min(cam.kfit*22, cam.k*Math.pow(1.0016,-e.deltaY)));
  cam.tx = mx-bx*cam.k; cam.ty = my-by*cam.k;
  draw();
}, {passive:false});
document.getElementById("lenses").addEventListener("click", e=>{
  const b=e.target.closest("button[data-lens]"); if(b) setLens(b.dataset.lens); });
addEventListener("keydown", e=>{
  if(e.target===searchEl) return;
  if(e.key==="/"){ e.preventDefault(); searchEl.focus(); return; }
  if(e.key==="1") setLens("stacks");
  if(e.key==="2") setLens("constellation");
  if(e.key==="3") setLens("refinery");
  if(e.key==="f"||e.key==="F") fit();
  if(e.key==="Escape"){ searchEl.value=""; runSearch(); closePanel(); }
});
addEventListener("resize", resize);
// The toolbar wraps to a second line on a narrow window, which changes the
// canvas height without the window itself resizing. Watch the element, not
// the window, so the drawing surface and the thing you click never disagree.
if(window.ResizeObserver){
  let first = true;
  new ResizeObserver(()=>{ if(first){first=false;return;} resize(); }).observe(cv);
}

/* ===================================================================== boot */
bakeFor("stacks");
showNote(LENSES[lens]); legend(); countLinks(); resize();

/* A read-only window onto the page's own coordinate maths, so the regression
   tests in viz/test_atlas.py can ask "where should this be?" and compare it
   against where a click actually lands. Reading only -- nothing here can drive
   the map, so it can't paper over a bug by taking a different code path. */
window.__atlas = {
  tables: T,
  pos: name => POS[name],
  sx, sy,
  world: (x,y) => [wx(x), wy(y)],
  lens: () => lens,
  // How far the cached picture is currently being offset when it's blitted.
  cacheOffset: () => [cam.tx-cache.tx, cam.ty-cache.ty],
};
})();
</script>
</body>
</html>
