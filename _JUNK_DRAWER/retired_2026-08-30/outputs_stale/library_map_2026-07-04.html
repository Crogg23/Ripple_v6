<title>The Library Map</title>
<style>
:root {
  --page: #f7f6f2;
  --surface: #fcfcfb;
  --surface2: #f1f0ea;
  --ink: #171613;
  --ink2: #52514e;
  --muted: #898781;
  --line: #e1e0d9;
  --line-soft: #eceae2;
  --accent: #2a78d6;
  --accent-deep: #1c5cab;
  --steel: #2a78d6;
  --strong: #1baf7a;
  --corr: #4a3aa7;
  --geo: #c98500;
  --prob: #898781;
  --shadow: 0 1px 3px rgba(23,22,19,.06), 0 4px 16px rgba(23,22,19,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #111110;
    --surface: #1a1a19;
    --surface2: #232322;
    --ink: #f2f1ec;
    --ink2: #c3c2b7;
    --muted: #898781;
    --line: #2c2c2a;
    --line-soft: #262624;
    --accent: #3987e5;
    --accent-deep: #6da7ec;
    --steel: #3987e5;
    --strong: #199e70;
    --corr: #9085e9;
    --geo: #c98500;
    --prob: #898781;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --page: #111110;
  --surface: #1a1a19;
  --surface2: #232322;
  --ink: #f2f1ec;
  --ink2: #c3c2b7;
  --muted: #898781;
  --line: #2c2c2a;
  --line-soft: #262624;
  --accent: #3987e5;
  --accent-deep: #6da7ec;
  --steel: #3987e5;
  --strong: #199e70;
  --corr: #9085e9;
  --geo: #c98500;
  --prob: #898781;
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --page: #f7f6f2;
  --surface: #fcfcfb;
  --surface2: #f1f0ea;
  --ink: #171613;
  --ink2: #52514e;
  --muted: #898781;
  --line: #e1e0d9;
  --line-soft: #eceae2;
  --accent: #2a78d6;
  --accent-deep: #1c5cab;
  --steel: #2a78d6;
  --strong: #1baf7a;
  --corr: #4a3aa7;
  --geo: #c88500;
  --prob: #898781;
  --shadow: 0 1px 3px rgba(23,22,19,.06), 0 4px 16px rgba(23,22,19,.05);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ── Header ─────────────────────────────── */
.masthead {
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  padding: 26px 28px 0;
}
.masthead-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; max-width: 1500px; margin: 0 auto; }
.masthead h1 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 30px; font-weight: 600; letter-spacing: .01em; margin: 0;
  text-wrap: balance;
}
.masthead .whatis { color: var(--ink2); font-size: 14.5px; max-width: 62ch; }
.stats-row {
  display: flex; flex-wrap: wrap; gap: 6px 26px; align-items: baseline;
  max-width: 1500px; margin: 14px auto 0; padding-bottom: 16px;
  font-variant-numeric: tabular-nums;
}
.stat b { font-size: 17px; font-weight: 650; }
.stat span { color: var(--muted); font-size: 12.5px; margin-left: 6px; letter-spacing: .04em; text-transform: uppercase; }

/* ── Shell ──────────────────────────────── */
.shell {
  display: grid; grid-template-columns: 330px minmax(0,1fr);
  max-width: 1500px; margin: 0 auto; gap: 0;
  align-items: start;
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static !important; height: auto !important; max-height: 46vh; border-right: none !important; border-bottom: 1px solid var(--line); }
}

/* ── Rail ───────────────────────────────── */
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line);
  padding: 18px 16px 40px;
  background: var(--page);
}
.searchbox { position: relative; margin-bottom: 10px; }
.searchbox input {
  width: 100%; padding: 9px 12px 9px 34px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink);
  font: 14px/1.3 system-ui, -apple-system, sans-serif;
}
.searchbox input::placeholder { color: var(--muted); }
.searchbox svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.trust-toggle {
  display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  margin-bottom: 16px; background: var(--surface);
}
.trust-toggle button {
  flex: 1; padding: 7px 4px; font-size: 12.5px; color: var(--ink2);
  border-right: 1px solid var(--line);
}
.trust-toggle button:last-child { border-right: none; }
.trust-toggle button.on { background: var(--surface2); color: var(--ink); font-weight: 600; }
.rail-note { font-size: 12px; color: var(--muted); margin: -8px 0 14px; line-height: 1.45; }

.shelf { margin-bottom: 4px; }
.shelf summary {
  cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px;
  padding: 7px 6px; border-radius: 6px; user-select: none;
}
.shelf summary::-webkit-details-marker { display: none; }
.shelf summary:hover { background: var(--surface2); }
.shelf summary .tri { color: var(--muted); font-size: 10px; transition: transform .15s; display: inline-block; width: 10px; }
.shelf[open] summary .tri { transform: rotate(90deg); }
.shelf summary .dom-name { font-weight: 600; font-size: 13.5px; }
.shelf summary .dom-count { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.rail-item {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  padding: 5px 6px 5px 24px; border-radius: 6px; font-size: 13px; line-height: 1.35;
  color: var(--ink2);
}
.rail-item:hover { background: var(--surface2); color: var(--ink); }
.rail-item.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); font-weight: 600; }
.rail-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item .deg { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rail-section-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 6px 6px; }
.hit-col { color: var(--accent-deep); font-size: 11px; }

/* ── Main ───────────────────────────────── */
.main { padding: 24px 28px 80px; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 28px; flex-wrap: wrap; }
.backbtn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--accent-deep); font-weight: 600;
  padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
}
.backbtn:hover { border-color: var(--accent); }
.crumb-from { font-size: 12.5px; color: var(--muted); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); padding: 22px 24px; margin-bottom: 18px;
}
.card h2 {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 24px; font-weight: 600; margin: 0 0 2px; text-wrap: balance; line-height: 1.25;
}
.card h3 {
  font-size: 13px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); font-weight: 650; margin: 0 0 12px;
}
.fqn { font-size: 12.5px; color: var(--muted); word-break: break-all; }
.idline { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin: 8px 0 0; font-size: 13px; color: var(--ink2); }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
  padding: 2px 9px; border-radius: 999px; white-space: nowrap;
}
.chip.dom { background: var(--surface2); color: var(--ink2); }
.onerow {
  margin: 14px 0 4px; padding: 12px 16px;
  background: var(--surface2); border-radius: 8px; font-size: 14.5px;
}
.onerow b { font-weight: 650; }
.desc { color: var(--ink2); font-size: 14px; margin: 12px 0 0; max-width: 78ch; }

/* tier chips + edges */
.tchip { border: 1.5px solid; background: transparent; }
.tchip.STEEL { color: var(--steel); border-color: var(--steel); }
.tchip.STRONG { color: var(--strong); border-color: var(--strong); }
.tchip.CORROBORATED { color: var(--corr); border-color: var(--corr); }
.tchip.GEO { color: var(--geo); border-color: var(--geo); }
.tchip.PROBABILISTIC { color: var(--prob); border-color: var(--prob); border-style: dashed; }
.kchip { color: #fff; }
.kchip.STEEL { background: var(--steel); }
.kchip.STRONG { background: var(--strong); }
.kchip.CORROBORATED { background: var(--corr); }
.kchip.GEO { background: var(--geo); }
.kchip.PROBABILISTIC { background: var(--prob); }
:root[data-theme="light"] .kchip, .kchip { text-shadow: 0 1px 1px rgba(0,0,0,.15); }

/* ego map */
.egomap-wrap { overflow-x: auto; }
.egomap { display: block; width: 100%; min-width: 560px; height: auto; }
.egomap .edge { fill: none; stroke-width: 2; }
.egomap .edge.PROBABILISTIC { stroke-dasharray: 5 5; }
.egomap .nlabel { font: 11.5px system-ui, -apple-system, sans-serif; fill: var(--ink2); }
.egomap .klabel { font: 600 9.5px ui-monospace, "SF Mono", Menlo, monospace; }
.egomap .center-label { font: 600 13px system-ui, -apple-system, sans-serif; fill: var(--ink); }
.egomap g.nb { cursor: pointer; }
.egomap g.nb:hover .nlabel { fill: var(--ink); font-weight: 600; }
.egomap g.nb:hover circle { stroke-width: 3; }
.map-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

/* connection groups */
.congroup { border-top: 1px solid var(--line-soft); padding: 14px 0; }
.congroup:first-of-type { border-top: none; }
.congroup-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 8px; }
.congroup-head .gloss { color: var(--ink2); font-size: 13px; }
.congroup-head .cnt { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.conlist { display: flex; flex-direction: column; gap: 2px; }
.conrow {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: 7px; font-size: 13.5px;
}
.conrow:hover { background: var(--surface2); }
.conrow .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conrow .stat2 { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.showmore { font-size: 12.5px; color: var(--accent-deep); font-weight: 600; padding: 6px 10px; text-align: left; }

/* columns */
.colgrid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 3px 14px; max-height: 430px; overflow-y: auto;
  border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px 14px;
  background: var(--page);
}
.colitem {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; padding: 2.5px 4px; border-radius: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2);
}
.colitem.iskey { font-weight: 700; }
.colitem.iskey .keytag { font-size: 9.5px; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; margin-left: 6px; color: #fff; vertical-align: 1px; }
.colitem.meta { color: var(--muted); font-style: italic; }
.colsearch { margin: 0 0 10px; }
.colsearch input {
  width: 100%; max-width: 340px; padding: 6px 10px; font-size: 13px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink);
}
.col-count { color: var(--muted); font-size: 12.5px; margin-left: 8px; }

/* overview */
.intro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; margin-bottom: 18px; }
.keyrow {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 8px; border-top: 1px solid var(--line-soft);
}
.keyrow:first-of-type { border-top: none; }
.keyrow:hover { background: var(--surface2); }
.keyrow .gloss { color: var(--ink2); font-size: 13px; flex: 1; min-width: 0; }
.keyrow .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hub-list { display: flex; flex-direction: column; gap: 2px; }
.hubrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; }
.hubrow:hover { background: var(--surface2); }
.hubrow .nm { font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.hubrow .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; flex: 0 0 180px; }
.hubrow .bar i { display: block; height: 100%; border-radius: 2px; }
.hubrow .deg { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; width: 70px; text-align: right; }
.tierlegend { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 14px; }
.howto { color: var(--ink2); font-size: 14px; max-width: 74ch; }
.howto p { margin: 0 0 10px; }
.howto b { color: var(--ink); }

/* key view */
.pairrow { display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: baseline; gap: 10px; padding: 6px 10px; border-radius: 7px; font-size: 13.5px; }
.pairrow:hover { background: var(--surface2); }
.pairrow .side { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; font-weight: 550; color: var(--ink); }
.pairrow .side:hover { color: var(--accent-deep); }
.pairrow .lnk { color: var(--muted); font-size: 11px; }
.pairrow .stat2 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 700px) { .pairrow { grid-template-columns: 1fr; gap: 2px; } .pairrow .stat2 { text-align: left; } }

.empty-note { color: var(--muted); font-size: 13.5px; padding: 8px 0; }
</style>

<header class="masthead">
  <div class="masthead-top">
    <h1>The Library Map</h1>
    <div class="whatis">Every probed table in the Library, what it holds, and what it measurably joins to — grouped by the key that makes the join work.</div>
  </div>
  <div class="stats-row" id="stats"></div>
</header>

<div class="shell">

    </div>
    <div class="rail-note" id="railnote"></div>
    <div id="raillist"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

/* ── static vocab ─────────────────────────── */
const TIER_ORDER = ["STEEL","STRONG","CORROBORATED","GEO","PROBABILISTIC"];
const TIER_RANK = Object.fromEntries(TIER_ORDER.map((t,i)=>[t,i]));
const TIER_LABEL = {
  STEEL: "STEEL — hard ID",
  STRONG: "STRONG — official code",
  CORROBORATED: "CORROBORATED — name + place agree",
  GEO: "GEO — same places",
  PROBABILISTIC: "LEAD — fuzzy text match"
};
const TIER_GLOSS = {
  STEEL: "A government-issued identifier (EIN, CIK). A join on this is a fact: same entity on both sides.",
  STRONG: "A controlled code (industry classification). Reliable join, but it groups entities rather than pinpointing one.",
  CORROBORATED: "Name AND ZIP agree. Two weak signals lining up — a strong lead.",
  GEO: "Shared geography (ZIP, county, country). Connects places, not entities — good for “what else happened here.”",
  PROBABILISTIC: "Fuzzy text match on a name or address. Treat every one as a lead to verify, never as proof."
};
const KEY_GLOSS = {
  EIN: "IRS tax ID for a business or nonprofit. Same EIN = same organization, guaranteed.",
  CIK: "SEC filer number. Same CIK = same registered company, guaranteed.",
  NAICS: "Industry code — what line of business an entity is in.",
  SIC: "Older industry code (pre-NAICS). Same idea, coarser.",
  "NAME@ZIP": "Same name AND same ZIP code. A name match corroborated by location.",
  ZIP: "Shared ZIP codes. The two tables cover the same neighborhoods — that's overlap of place, not identity.",
  FIPS: "County/state geo code. Same as ZIP but at county level.",
  COUNTRY: "Shared country codes. The loosest geographic overlap.",
  NAME: "Organization/person name matched as text. Names collide and mutate — always verify.",
  ADDRESS: "Street address matched as text. Same caveat as names."
};
const DOM_LABEL = {
  open_data_portal: "Open-data portals", health_medicine: "Health & medicine",
  transport_movement: "Transport & movement", housing_social: "Housing & social",
  economy_labor_trade: "Economy, labor & trade", education: "Education",
  energy_environment: "Energy & environment", corporate_entities: "Corporate entities",
  spending_budget: "Spending & budgets", sanctions_enforcement: "Sanctions & enforcement",
  money_finance: "Money & finance", government_power: "Government & power",
  money_in_politics: "Money in politics", justice_courts: "Justice & courts",
  elections_voting: "Elections & voting", crime_security: "Crime & security",
  immigration_migration: "Immigration & migration", UNCLASSIFIED: "Not yet classified"
};
const META_COLS = new Set(["_INGESTED_AT","_SOURCE_RUN_ID","_SRC_SHA256"]);
const COLKEY_PATTERNS = [
  [/(^|_)EIN(_|$)/, "EIN", "STEEL"],
  [/(^|_)CIK(_|$)/, "CIK", "STEEL"],
  [/(^|_)NPI(_|$)/, "NPI", "STEEL"],
  [/(^|_)LEI(_|$)/, "LEI", "STEEL"],
  [/(^|_)UEI(_|$)|DUNS/, "UEI", "STEEL"],
  [/NAICS/, "NAICS", "STRONG"],
  [/(^|_)SIC(_|$)/, "SIC", "STRONG"],
  [/ZIP/, "ZIP", "GEO"],
  [/FIPS/, "FIPS", "GEO"],
  [/(^|_)COUNTY(_|$)/, "COUNTY", "GEO"],
  [/COUNTRY/, "COUNTRY", "GEO"],
  [/(^|_)LAT(ITUDE)?(_|$)|(^|_)LON(GITUDE)?(_|$)|(^|_)LNG(_|$)/, "GEO", "GEO"],
  [/ADDRESS|(^|_)ADDR(_|$)/, "ADDR", "PROBABILISTIC"],
  [/(^|_)NAME(S)?(_|$)/, "NAME", "PROBABILISTIC"]
];

/* ── data prep ────────────────────────────── */
const NODES = RAW.nodes;      // [{id,nm,d,u,p,dom,jur,life,rows,cols}]
const KEYS = RAW.keys;        // [{k,tier,n}]
const EDGES = RAW.edges;      // [ai,bi,ki,matched,aDist,bDist,rate]
const SOLID = new Set(["STEEL","STRONG","CORROBORATED"]);

const adj = NODES.map(()=>[]);
EDGES.forEach((e,i)=>{ adj[e[0]].push(i); adj[e[1]].push(i); });
NODES.forEach((n,i)=>{
  n.i = i;
  n.deg = adj[i].length;
  n.degSolid = adj[i].filter(ei => SOLID.has(KEYS[EDGES[ei][2]].tier)).length;
});
const byId = Object.fromEntries(NODES.map(n=>[n.id, n.i]));

const state = { view: "overview", sel: null, filter: "all", trail: [] };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("en-US");
const tierOfEdge = ei => KEYS[EDGES[ei][2]].tier;
const keyOfEdge = ei => KEYS[EDGES[ei][2]].k;
const otherEnd = (ei, i) => { const e = EDGES[ei]; return e[0] === i ? e[1] : e[0]; };
const passesFilter = ei => state.filter === "all" || SOLID.has(tierOfEdge(ei));
const degOf = n => state.filter === "all" ? n.deg : n.degSolid;
const domLabel = d => DOM_LABEL[d] || d || "Not yet classified";
const tierColor = t => `var(--${{STEEL:"steel",STRONG:"strong",CORROBORATED:"corr",GEO:"geo",PROBABILISTIC:"prob"}[t]})`;

function colKeyTag(name) {
  if (META_COLS.has(name)) return null;
  for (const [re, tag, tier] of COLKEY_PATTERNS) if (re.test(name)) return { tag, tier };
  return null;
}

/* ── navigation ───────────────────────────── */
function goto(i, push=true) {
  if (push && state.sel != null && state.sel !== i) state.trail.push(state.sel);
  if (state.view === "overview" || state.view === "key") state.trail = state.sel != null ? state.trail : [];
  state.view = "table"; state.sel = i;
  render();
  document.getElementById("main").closest("body") && window.scrollTo({top: 0});
}
function gotoKey(k) { state.view = "key"; state.selKey = k; render(); window.scrollTo({top:0}); }
function goHome() { state.view = "overview"; state.sel = null; state.trail = []; render(); window.scrollTo({top:0}); }
function goBack() {
  if (state.trail.length) { state.sel = state.trail.pop(); state.view = "table"; render(); }
  else goHome();
}

/* ── header stats ─────────────────────────── */
function renderStats() {
  const nEdges = state.filter === "all" ? EDGES.length : EDGES.filter((_,i)=>passesFilter(i)).length;
  const totCols = NODES.reduce((s,n)=>s+n.cols.length,0);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${fmt(NODES.length)}</b><span>tables</span></div>
    <div class="stat"><b>${fmt(nEdges)}</b><span>measured links${state.filter==="solid" ? " (solid)" : ""}</span></div>
    <div class="stat"><b>${fmt(totCols)}</b><span>columns</span></div>
    <div class="stat"><b>${KEYS.length}</b><span>join keys</span></div>`;
}

/* ── rail ─────────────────────────────────── */
function renderRail() {
  const q = document.getElementById("search").value.trim().toUpperCase();
  const list = document.getElementById("raillist");
  document.getElementById("railnote").textContent =
    state.filter === "solid"
      ? "Solid = joins on hard IDs, official codes, or name+ZIP. Geography overlaps and fuzzy name matches are hidden."
      : "Counts show measured links per table. Fuzzy/geo links included.";

  if (q.length >= 2) {
    const nameHits = NODES.filter(n =>
      n.id.includes(q) || n.nm.toUpperCase().includes(q) || (n.p||"").toUpperCase().includes(q));
    const colHits = NODES.map(n => {
      const cols = n.cols.filter(c => c.includes(q));
      return cols.length ? {n, cols} : null;
    }).filter(Boolean).filter(h => !nameHits.includes(h.n));
    let html = "";
    html += `<div class="rail-section-h">Tables (${nameHits.length})</div>`;
    html += nameHits.slice(0,60).map(n => railItem(n)).join("") || `<div class="empty-note">No table names match.</div>`;
    if (colHits.length) {
      html += `<div class="rail-section-h">Have a matching column (${colHits.length})</div>`;
      html += colHits.slice(0,40).map(h =>
        railItem(h.n, `<span class="hit-col mono">${esc(h.cols[0].length>24?h.cols[0].slice(0,23)+"…":h.cols[0])}${h.cols.length>1?" +"+(h.cols.length-1):""}</span>`)
      ).join("");
    }
    list.innerHTML = html;
    return;
  }

  const groups = {};
  NODES.forEach(n => (groups[n.dom || "UNCLASSIFIED"] ??= []).push(n));
  const ordered = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
  list.innerHTML = ordered.map(([dom, arr], gi) => {
    arr.sort((a,b)=>degOf(b)-degOf(a) || a.nm.localeCompare(b.nm));
    const open = state.sel != null ? arr.some(n=>n.i===state.sel) : gi < 2;
    return `<details class="shelf" ${open?"open":""}>
      <summary><span class="tri">▶</span><span class="dom-name">${esc(domLabel(dom))}</span><span class="dom-count">${arr.length}</span></summary>
      ${arr.map(n => railItem(n)).join("")}
    </details>`;
  }).join("");
}
function railItem(n, extra="") {
  return `<button class="rail-item ${n.i===state.sel?"sel":""}" data-goto="${n.i}" title="${esc(n.id)}">
    <span class="nm">${esc(n.nm)}</span>${extra}<span class="deg">${degOf(n)}</span>
  </button>`;
}

/* ── overview ─────────────────────────────── */
function renderOverview() {
  const keysSorted = [...KEYS].sort((a,b)=>TIER_RANK[a.tier]-TIER_RANK[b.tier] || b.n-a.n);
  const hubs = [...NODES].sort((a,b)=>degOf(b)-degOf(a)).slice(0,12);
  const maxDeg = degOf(hubs[0]) || 1;
  return `
  <div class="card">
    <h3>How to read this map</h3>
    <div class="howto">
      <p><b>Every table below is a catalog card:</b> what one row of it means, who publishes it, and every column it carries. Pick any table from the shelf on the left — or search for a table, publisher, or column name.</p>
      <p><b>Links are measured, not assumed.</b> The connect scan took real values from both tables and counted the overlap. Each link is labeled with the key that makes the join work, and colored by how much you can trust it:</p>
    </div>
    <div class="tierlegend">
      ${TIER_ORDER.map(t=>`<span class="chip tchip ${t}" title="${esc(TIER_GLOSS[t])}">${esc(TIER_LABEL[t])}</span>`).join("")}
    </div>
  </div>
  <div class="intro-grid">
    <div class="card">
      <h3>The glue — 10 keys make every connection</h3>
      ${keysSorted.map(k=>`
        <button class="keyrow" data-gotokey="${esc(k.k)}">
          <span class="chip kchip ${k.tier} mono">${esc(k.k)}</span>
          <span class="gloss">${esc(KEY_GLOSS[k.k]||"")}</span>
          <span class="cnt">${fmt(k.n)} links</span>
        </button>`).join("")}
    </div>
    <div class="card">
      <h3>The hubs — most-connected tables</h3>
      <div class="hub-list">
        ${hubs.map(n=>{
          const counts = {};
          adj[n.i].filter(passesFilter).forEach(ei=>{ const t=tierOfEdge(ei); counts[t]=(counts[t]||0)+1; });
          const bar = TIER_ORDER.filter(t=>counts[t]).map(t=>
            `<i style="width:${(counts[t]/maxDeg*100).toFixed(1)}%;background:${tierColor(t)}" title="${counts[t]} ${t} links"></i>`).join("");
          return `<button class="hubrow" data-goto="${n.i}">
            <span class="nm">${esc(n.nm)}</span>
            <span class="bar">${bar}</span>
            <span class="deg">${degOf(n)} links</span>
          </button>`;
        }).join("")}
      </div>
      <p class="map-note">Link counts respect the trust filter. A huge count via ZIP means shared coverage area, not 265 relationships.</p>
    </div>
  </div>
  <div class="card">
    <h3>Scope — what this map does and doesn't show</h3>
    <div class="howto">
      <p>The Library holds ~1,780 landing tables. The connect scan has probed <b>${fmt(NODES.length)}</b> of them so far and confirmed <b>${fmt(EDGES.length)}</b> working links. A table missing from this map hasn't been probed yet — it may still connect to plenty.</p>
      <p>Data pulled live from <span class="mono">LIBRARY_META."CONNECT".CONNECT_EDGES_INC</span>, <span class="mono">SOURCE_REGISTRY</span>, and <span class="mono">LIBRARY_RAW</span> column metadata on 2026-07-04.</p>
    </div>
  </div>`;
}

/* ── key view ─────────────────────────────── */
function renderKeyView() {
  const k = KEYS.find(x=>x.k===state.selKey);
  if (!k) return "";
  const eis = EDGES.map((e,i)=>i).filter(i=>keyOfEdge(i)===k.k)
    .sort((a,b)=>EDGES[b][3]-EDGES[a][3]);
  const tables = new Set(); eis.forEach(i=>{ tables.add(EDGES[i][0]); tables.add(EDGES[i][1]); });
  return `
  <div class="card">
    <h2 class="serif"><span class="chip kchip ${k.tier} mono" style="font-size:14px">${esc(k.k)}</span></h2>
    <div class="idline"><span class="chip tchip ${k.tier}">${esc(TIER_LABEL[k.tier])}</span>
      <span>${fmt(eis.length)} links across ${fmt(tables.size)} tables</span></div>
    <p class="desc">${esc(KEY_GLOSS[k.k]||"")} ${esc(TIER_GLOSS[k.tier])}</p>
  </div>
  <div class="card">
    <h3>Every link made by ${esc(k.k)} — biggest overlaps first</h3>
    ${eis.slice(0,200).map(i=>{
      const e = EDGES[i], A=NODES[e[0]], B=NODES[e[1]];
      return `<div class="pairrow">
        <button class="side" data-goto="${A.i}" title="${esc(A.id)}">${esc(A.nm)}</button>
        <span class="lnk">⇄</span>
        <button class="side" data-goto="${B.i}" title="${esc(B.id)}">${esc(B.nm)}</button>
        <span class="stat2">${fmt(e[3])} matched</span>
      </div>`;
    }).join("")}
    ${eis.length>200?`<div class="empty-note">…and ${fmt(eis.length-200)} more.</div>`:""}
  </div>`;
}

/* ── table view ───────────────────────────── */
function renderTable() {
  const n = NODES[state.sel];
  const eis = adj[n.i].filter(passesFilter)
    .sort((a,b)=>TIER_RANK[tierOfEdge(a)]-TIER_RANK[tierOfEdge(b)] || EDGES[b][3]-EDGES[a][3]);

  // group by key
  const groups = new Map();
  eis.forEach(ei=>{ const k=keyOfEdge(ei); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(ei); });

  const hiddenCount = adj[n.i].length - eis.length;

  return `
  <div class="card">
    <h2>${esc(n.nm)}</h2>
    <div class="fqn mono">LIBRARY_RAW.LANDING.${esc(n.id)}</div>
    <div class="idline">
      <span class="chip dom">${esc(domLabel(n.dom))}</span>
      ${n.p?`<span>published by <b>${esc(n.p)}</b></span>`:""}
      <span><b>${fmt(n.rows)}</b> rows</span>
      <span><b>${n.cols.length}</b> columns</span>
      <span><b>${eis.length}</b> links${hiddenCount>0?` <span style="color:var(--muted)">(+${hiddenCount} fuzzy/geo hidden)</span>`:""}</span>
    </div>
    ${n.u?`<div class="onerow">One row = <b>${esc(n.u.replace(/^\s*(one|1)\s+row\s*(=|is)\s*/i,""))}</b></div>`:""}
    ${n.d?`<p class="desc">${esc(n.d)}</p>`:""}
  </div>

  ${eis.length ? `
  <div class="card">
    <h3>Connection map — strongest links drawn, all listed below</h3>
    <div class="egomap-wrap">${egoSvg(n, eis)}</div>
    <div class="map-note">Line color = the key's trust tier · dashed = fuzzy text match (a lead, not proof). Click any node to jump to it.</div>
  </div>
  <div class="card">
    <h3>All connections, grouped by the key that makes the join</h3>
    ${[...groups.entries()].map(([k, arr]) => conGroup(n, k, arr)).join("")}
  </div>` : `
  <div class="card"><div class="empty-note">No ${state.filter==="solid"?"solid ":""}measured links for this table${state.filter==="solid"?" — flip to “All links” to see fuzzy/geo overlaps":""}. It may still join to unprobed tables.</div></div>`}

  <div class="card">
    <h3>Columns <span class="col-count">landing layer stores everything as TEXT; types get cast in staging</span></h3>
    <div class="colsearch"><input id="colfilter" type="search" placeholder="Filter ${n.cols.length} columns…" aria-label="Filter columns"></div>
    <div class="colgrid" id="colgrid">${colItems(n.cols)}</div>
  </div>`;
}

function colItems(cols, q="") {
  const Q = q.toUpperCase();
  const shown = cols.filter(c => !Q || c.includes(Q));
  const keyed = [], plain = [], meta = [];
  shown.forEach(c => {
    const t = colKeyTag(c);
    if (META_COLS.has(c)) meta.push(c);
    else if (t) keyed.push([c,t]);
    else plain.push(c);
  });
  return keyed.map(([c,t]) =>
      `<div class="colitem iskey" title="looks like a ${esc(t.tag)} join key">${esc(c)}<span class="keytag" style="background:${tierColor(t.tier)}">${esc(t.tag)}</span></div>`)
    .concat(plain.map(c=>`<div class="colitem" title="${esc(c)}">${esc(c)}</div>`))
    .concat(meta.map(c=>`<div class="colitem meta" title="pipeline bookkeeping added at load time">${esc(c)}</div>`))
    .join("") || `<div class="empty-note">No columns match.</div>`;
}

function conGroup(center, k, eis) {
  const key = KEYS.find(x=>x.k===k);
  const LIMIT = 12;
  const expanded = state.expanded === k;
  const shown = expanded ? eis : eis.slice(0, LIMIT);
  return `<div class="congroup">
    <div class="congroup-head">
      <button data-gotokey="${esc(k)}" title="See every link made by this key"><span class="chip kchip ${key.tier} mono">via ${esc(k)}</span></button>
      <span class="chip tchip ${key.tier}">${esc(TIER_LABEL[key.tier])}</span>
      <span class="cnt">${fmt(eis.length)} table${eis.length===1?"":"s"}</span>
      <span class="gloss">${esc(KEY_GLOSS[k]||"")}</span>
    </div>
    <div class="conlist">
      ${shown.map(ei=>{
        const e = EDGES[ei], o = NODES[otherEnd(ei, center.i)];
        const centerIsA = e[0]===center.i;
        const centerDist = centerIsA ? e[4] : e[5];
        const share = centerDist ? Math.min(100, Math.round(e[3]/centerDist*100)) : null;
        return `<button class="conrow" data-goto="${o.i}" title="${esc(o.id)}">
          <span class="nm">${esc(o.nm)}</span>
          <span class="stat2">${fmt(e[3])} shared value${e[3]===1?"":"s"}${share!=null?` · ${share}% of this table's ${esc(k)}s`:""}</span>
        </button>`;
      }).join("")}
      ${eis.length>LIMIT && !expanded ? `<button class="showmore" data-expand="${esc(k)}">Show all ${fmt(eis.length)} ↓</button>`:""}
    </div>
  </div>`;
}

/* ── ego map svg ──────────────────────────── */
function egoSvg(center, eis) {
  const MAXN = 16;
  const picked = eis.slice(0, MAXN);
  const extra = eis.length - picked.length;
  const W = 1000, H = 60 + Math.max(300, picked.length * 26), CX = W/2, CY = H/2;
  const RX = W*0.29, RY = H/2 - 44;
  const items = picked.map((ei, idx) => {
    const angle = (idx / picked.length) * Math.PI * 2 - Math.PI/2;
    return { ei, x: CX + RX*Math.cos(angle), y: CY + RY*Math.sin(angle), angle };
  });
  const trunc = (s,n)=> s.length>n ? s.slice(0,n-1)+"…" : s;
  return `<svg class="egomap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Connection map for ${esc(center.nm)}">
    ${items.map(({ei,x,y})=>{
      const t = tierOfEdge(ei);
      return `<line class="edge ${t}" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${tierColor(t)}" opacity="0.75"></line>`;
    }).join("")}
    ${items.map(({ei,x,y,angle})=>{
      const t = tierOfEdge(ei), k = keyOfEdge(ei);
      const o = NODES[otherEnd(ei, center.i)];
      const rightSide = Math.cos(angle) >= 0;
      const anchor = rightSide ? "start" : "end";
      const dx = rightSide ? 12 : -12;
      const mx = CX + (x-CX)*0.62, my = CY + (y-CY)*0.62;
      return `<g class="nb" data-goto="${o.i}" tabindex="0" role="link" aria-label="${esc(o.nm)} via ${esc(k)}">
        <text class="klabel" x="${mx.toFixed(1)}" y="${(my-5).toFixed(1)}" text-anchor="middle" fill="${tierColor(t)}">${esc(k)}</text>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${tierColor(t)}" stroke="var(--surface)" stroke-width="2"></circle>
        <text class="nlabel" x="${(x+dx).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}">${esc(trunc(o.nm, 28))}</text>
        <title>${esc(o.nm)} — via ${esc(k)} (${esc(t)}) · ${fmt(EDGES[ei][3])} values in common</title>
      </g>`;
    }).join("")}
    <circle cx="${CX}" cy="${CY}" r="11" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"></circle>
    <text class="center-label" x="${CX}" y="${CY - 20}" text-anchor="middle">${esc(trunc(center.nm, 40))}</text>
    ${extra>0?`<text class="nlabel" x="${CX}" y="${H-10}" text-anchor="middle" fill="var(--muted)">+ ${extra} more links in the list below</text>`:""}
  </svg>`;
}

/* ── render root ──────────────────────────── */
function render() {
  renderStats();
  renderRail();
  const main = document.getElementById("main");
  let crumbs = "";
  if (state.view !== "overview") {
    const backTo = state.trail.length ? NODES[state.trail[state.trail.length-1]].nm : "overview";
    crumbs = `<div class="crumbs">
      <button class="backbtn" id="backbtn">← ${state.trail.length?esc(backTo):"Back to the map"}</button>
      <button class="backbtn" id="homebtn" ${state.trail.length?"":"hidden"}>⌂ Overview</button>
    </div>`;
  }
  main.innerHTML = crumbs + (
    state.view === "overview" ? renderOverview() :
    state.view === "key" ? renderKeyView() : renderTable());
  const cf = document.getElementById("colfilter");
  if (cf) cf.addEventListener("input", () => {
    document.getElementById("colgrid").innerHTML = colItems(NODES[state.sel].cols, cf.value.trim());
  });
}

/* ── events (delegated) ───────────────────── */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (g) { goto(Number(g.dataset.goto)); return; }
  const k = e.target.closest("[data-gotokey]");
  if (k) { gotoKey(k.dataset.gotokey); return; }
  const x = e.target.closest("[data-expand]");
  if (x) { state.expanded = x.dataset.expand; render(); return; }
  if (e.target.closest("#backbtn")) { goBack(); return; }
  if (e.target.closest("#homebtn")) { goHome(); return; }
  if (e.target.closest("#f-all")) { setFilter("all"); return; }
  if (e.target.closest("#f-solid")) { setFilter("solid"); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("g.nb")) { goto(Number(e.target.dataset.goto)); }
  if (e.key === "Enter" && e.target.id === "search") {
    const first = document.querySelector(".rail-item");
    if (first) goto(Number(first.dataset.goto));
  }
});
function setFilter(f) {
  state.filter = f; state.expanded = null;
  document.getElementById("f-all").classList.toggle("on", f==="all");
  document.getElementById("f-solid").classList.toggle("on", f==="solid");
  render();
}
document.getElementById("search").addEventListener("input", renderRail);

render();
</script>
