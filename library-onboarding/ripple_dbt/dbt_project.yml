name: 'ripple'
version: '1.0.0'
config-version: 2

# Minimal dbt project the onboarding agent (checkpoint 4) writes models into.
# We do NOT run dbt from the agent -- it only scaffolds model files here. Running
# dbt (and the matching profiles.yml with Snowflake creds) is a separate step.
profile: 'ripple'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

# Staging mirrors LIBRARY_STAGING (views); marts mirror LIBRARY_MARTS (tables).
models:
  ripple:
    staging:
      +materialized: view
      +database: LIBRARY_STAGING
    intermediate:
      +materialized: view
      +database: LIBRARY_STAGING
    # The canonical-clock layer (added 2026-08-20). One view per clocked mart,
    # exposing ripple_ts / ripple_grain / ripple_clock / ripple_source beside the
    # original columns, plus the rolled-up shared timeline. Views, deliberately:
    # they cost nothing to create or store, leave the marts untouched, and can be
    # regenerated in seconds when a clock label is corrected. Generated by
    # scripts/census/gen_time_views.py -- do not hand-edit the files.
    timeline:
      +materialized: view
      +database: LIBRARY_MARTS
      +schema: TIMELINE
    marts:
      +materialized: table
      +database: LIBRARY_MARTS
      # Disabled 2026-07-01 (housekeeping): broken 1-row / degenerate stubs from
      # failed source ingestion. The tables were dropped and snapshotted to
      # LIBRARY_MARTS._RESTORE_20260701 by scripts/housekeeping_cleanup.py.
      # Re-enable (flip to true, dbt run) once the underlying source is re-ingested
      # correctly. Rationale: outputs/housekeeping_HARDENED_2026-07-01.md (B5).
      civil_rights:
        civil_rights__fed_nara_wra_aad:
          +enabled: true  # re-enabled 2026-07-24: NARA_AAD has 554 rows, WRA subset
      corporate_registry:
        corporate_registry__intl_ie_cro:
          +enabled: true  # re-enabled 2026-07-24: source re-ingested (819K rows)
      # 2026-07-31: both sources re-graded STATUS='empty' by the density gate's new
      # single-populated-column trigger. They must be disabled here TOO, not just
      # re-graded -- LIBRARY_META.REGISTRY.CATALOG resolves LIFECYCLE with
      # `WHEN f.real_mart THEN 'modeled'` as its FIRST branch, so a mart built on
      # garbage keeps advertising the source as fully modeled/mart-grade no matter
      # what the ingest log says. Removing the mart is what lets LIFECYCLE fall
      # through to 'empty'.
      #
      # NB: do NOT "fix" this by making empty beat real_mart in that view. fed_dea_arcos
      # has a stale 409-row failed run sitting next to a genuinely healthy 178.6M-row
      # dataset; that precedence is what protects it from being wrongly condemned.
      finance:
        finance__fed_fara:
          # 2026-08-06: stub -- 30 rows, loaded from justice.gov/nsd-fara's program
          # homepage (not a data file). REGISTRANT_NAME is literally the site's
          # ".gov website" banner text on every row; every real field (registration
          # number, foreign principal, EIN, dates) is blank. A separate, real bulk
          # FARA loader already exists and works (foreign_influence__fed_fara_bulk,
          # 221,900 rows) -- this stub adds nothing and is pure redundant garbage.
          +enabled: false
        finance__fed_ffiec_call_reports:
          +enabled: false  # source is a saved HTML page: only populated column is DOCTYPE_HTML
        finance__fed_cfpb_complaints:
          # 2026-07-31: raw passthrough duplicate of consumer_protection__fed_cfpb_complaints,
          # auto-generated under a different domain than the hand-built mart (the
          # gen_mart_models.py cross-domain duplicate bug -- see that fix's note).
          # Verified the hand-built copy is CORRECT, not lossy: the 11,502-row gap
          # between them is entirely rows with a blank/missing Complaint ID, which
          # collapse together as ONE group under PARTITION BY (SQL puts all NULLs/
          # blanks in one partition) -- every non-blank complaint ID is already
          # unique with zero collisions. No real complaint is lost.
          +enabled: false
        finance__fed_fec_pac_summary:
          # 2026-07-31: raw passthrough duplicate of politics__fed_fec_pac_summary,
          # same cross-domain duplicate bug. This one is what EXPOSED that the
          # hand-built mart's grain was wrong (see that model's header) -- now fixed
          # and grain-exact, so the raw twin adds nothing.
          +enabled: false
        finance__fed_fec_bulk_candidates:
          +enabled: false  # raw twin of politics__fec_candidate (agrees, 17,900 rows; redundant)
        finance__fed_fec_bulk_linkages:
          # verified 2026-07-31: politics__fec_cand_cmte_link's small row-count gap
          # vs this raw twin is real duplicate LINKAGE_IDs with IDENTICAL substantive
          # fields (cmte_tp, cmte_dsgn) -- collapsing them loses nothing. Not a bug;
          # this twin is still redundant, so disabled.
          +enabled: false
        finance__fed_fec_bulk_summary:
          +enabled: false  # raw twin of politics__fec_candidate_summary (agrees, 7,933 rows; redundant)
      health:
        health__fed_cms_partd_prescriber_drug:
          # 2026-07-31: raw passthrough duplicate of health__fed_cms_partd_prescribers
          # -- this is the pair the WIDENED (resolve-by-actual-source, not filename)
          # duplicate check caught. The hand-built mart's grain was missing
          # brand_name and was silently discarding real claims/cost data (see that
          # model's header) -- now fixed and grain-exact, so the raw twin adds
          # nothing.
          +enabled: false
        health__fed_cms_hpt_mrf:
          # 2026-08-06: same failure mode as the BIA_TRIBAL_GEO case below --
          # the loader's registered URL (github.com/CMSgov/hospital-price-transparency)
          # is a GitHub repo's documentation page, not a data file. Hospital price
          # transparency machine-readable files are published per-hospital at
          # thousands of separate hospital sites; there is no single bulk source
          # to point at. Confirmed live: landing table is 1 row, 31 of 32 columns
          # blank, and that row's NPI is an empty string (not SQL NULL) -- which is
          # why this mart's existing not_null/unique tests were passing while the
          # mart advertised itself as real, unique billing records. Disabling
          # rather than "fixing" the tests, same doctrine as BIA_TRIBAL_GEO: a
          # real bulk ingestion for this source is a separate, much larger job
          # (crawl thousands of per-hospital endpoints), not something to fake
          # with a webpage scrape.
          +enabled: false
      # 2026-07-31: an "uncategorized" domain full of raw autogen twins of already
      # hand-built marts -- exactly the cross-domain duplicate bug, just routed to
      # the fallback folder instead of a named domain. All 4 verified AGREEING with
      # their hand-built sibling (no accuracy issue), disabled as pure redundancy.
      uncategorized:
        uncategorized__fed_dea_arcos_full:
          +enabled: false  # raw twin of health__fed_dea_arcos (agrees, 178,598,026 rows; redundant)
        uncategorized__fed_epa_frs_full:
          +enabled: false  # raw twin of environment__fed_epa_frs_facilities (agrees, 5,300,149 rows; redundant)
        uncategorized__int_uk_companies_house:
          +enabled: false  # raw twin of corporate_registry__intl_uk_companies_house (agrees, 5,734,780 rows; redundant)
        uncategorized__int_gleif_rr:
          +enabled: false  # raw twin of economics__int_gleif_rr (agrees, 481,933 rows; redundant)
      economics:
        economics__fed_fincen_boi:
          # 2026-08-06: stub -- 1 row, loaded from fincen.gov's general BOI
          # informational webpage (not a data file). Worth noting beyond the
          # usual "wrong URL" case: FinCEN's Beneficial Ownership database is
          # restricted-access under the Corporate Transparency Act (law
          # enforcement / financial institutions only) and, as of the March
          # 2025 rule change, only covers foreign reporting companies -- a
          # real public bulk source for this may not exist at all, not just
          # "not yet found." Existing not_null/unique tests were passing
          # falsely because the blank values are empty strings, not SQL NULL.
          +enabled: false
        economics__fed_hhs_taggs:
          +enabled: false  # stub: 45 rows of scraped HTML nav text, not real grants
        economics__intl_ch_zefix:
          +enabled: false  # stub: 18 rows, scrape captured page chrome not company data
        economics__intl_gr_gemi:
          +enabled: false  # stub: 40 rows, scrape captured page chrome not registry data
        economics__intl_es_borme:
          # 2026-07-31: raw passthrough duplicate of corporate_registry__intl_es_borme.
          # The SOURCE is dead here, not the model -- every dedupe-key column
          # (date, issue number, section, company_id, company_name, act_type,
          # country) is constant across all 25 rows; corporate_registry's 3-row
          # collapse is the pipeline correctly recognizing a degenerate source, same
          # class of failure as FED_FJC_IDB. The raw 25-row copy is not "more
          # complete", it's just uncollapsed garbage.
          +enabled: false
      history:
        history__fed_nara_wra_aad:
          # 2026-07-31: raw passthrough duplicate of civil_rights__fed_nara_wra_aad.
          # Same story as economics__intl_es_borme above: FED_NARA_WRA_AAD's source
          # is dead (36 rows, every column constant), civil_rights' 1-row collapse
          # is correct, this 36-row raw copy is not.
          +enabled: false
      government_records:
        government_records__fed_nara_aad:
          +enabled: true  # re-enabled 2026-07-24: source re-ingested (554 rows)
      # 2026-08-26: RE-ENABLED. FED_BIA_TRIBAL_GEO's registered URL was an ArcGIS
      # Hub HOME PAGE (https://opendata-1-bia-geospatial.hub.arcgis.com/), not a
      # dataset endpoint -- the loader scraped the portal's item directory
      # instead of real tribal land data (see the 2026-07-31 note in git history
      # for the full symptom writeup). Re-pointed at the real BIA AIAN-LAR
      # FeatureServer (scripts/bia_tribal_geo_reload.py); 335 real Land Area
      # Representation polygons landed, staging model rekeyed on LARID.
      land_and_territory:
        land_and_territory__fed_bia_tribal_geo:
          +enabled: true
      reference:
        reference__fed_bia_tribal_geo:
          +enabled: true
      politics:
        # 2026-07-30: STANDING POLICY no_selectorless_dbt_build enforced for real,
        # not just documented. These models mirror Python-built canonical tables
        # (politics/loaders/*.py, reconciled to the penny against OpenFEC/GovTrack)
        # purely so `dbt test` can run against them. `dbt build`/`dbt run` against
        # any model in this folder now hard-fails at compile time unless you pass
        # --vars '{"allow_politics_rebuild": true}' -- see macros/guard_politics_mirror.sql.
        # `dbt test` is completely unaffected (pre-hooks don't fire for tests).
        +pre-hook: "{{ guard_politics_mirror() }}"
        politics__fed_govinfo_billstatus:
          +enabled: false  # raw twin of politics__bills (agrees, 36,465 rows; redundant)
        politics__fed_govinfo_bill_cosponsors:
          # verified 2026-07-31: politics__bill_cosponsors' small row-count gap vs
          # this raw twin is a DOCUMENTED intentional collapse (a member who
          # withdrew then re-cosponsored keeps one row, preferring not-withdrawn)
          # plus a data-quality filter on malformed rows. Not a bug; this twin is
          # still redundant, so disabled.
          +enabled: false
        politics__fed_voteview_rollcalls:
          +enabled: false  # raw twin of politics__voteview_votes (agrees, 945,523 rows; redundant)
        politics__fed_voteview_rollcall_meta:
          # Re-enabled 2026-08-11: no longer a twin. Repointed to the full-history
          # re-pull (113,512 roll-calls, 1789-present, publisher-exact) while the
          # canonical Python-built chain still covers only the 118th-119th
          # congresses (3,364). When the canonical chain is extended to full
          # history, re-evaluate which one retires.
          +enabled: true
      historical_records:
        historical_records__fed_slavevoyages_intraamerican:
          +enabled: true  # re-enabled 2026-07-24: source re-ingested (11.5K rows)
      justice:
        justice__fed_bop_statistics:
          # 2026-08-06: stub -- 50 rows, loaded from bop.gov's statistics landing
          # page (not a data file). Confirmed live: METRIC_NAME/METRIC_VALUE are
          # scraped page-navigation labels ("Search", "Age:", "Race:", "Related
          # Links"), not real Bureau of Prisons population figures.
          +enabled: false
        justice__fed_doj_crt_cases:
          +enabled: false  # stub: 1 row, failed scrape
        justice__fed_msha_violations:
          # 2026-07-31: raw passthrough duplicate of labor__fed_msha_violations,
          # same cross-domain duplicate bug as the finance/consumer_safety ones
          # above. This is what exposed the hand-built mart's grain was ALMOST but
          # not quite unique (see that model's header, 51 contested-docket rows).
          # Now grain-exact; the raw twin adds nothing.
          +enabled: false
        justice__intl_fatf_ratings:
          +enabled: false  # 2026-07-31: source parse failed -- COUNTRY populated, all 6 rating columns blank
        justice__fed_msha_accidents:
          +enabled: false  # raw twin of labor__fed_msha_accidents (agrees, 273,623 rows; redundant)
        justice__fed_msha_mines:
          +enabled: false  # raw twin of labor__fed_msha_mines (agrees, 91,906 rows; redundant)
        justice__fed_fdic_enforcement:
          # 2026-07-31: raw twin of regulation__fed_fdic_enforcement, which is
          # ALREADY disabled below as a dead-source stub (14 rows, failed scrape).
          # This is the orphan of an already-known-dead source, not a new bug.
          +enabled: false
      education:
        education__fed_ed_edfacts:
          # 2026-08-06: stub -- 33 rows, loaded from ed.gov's EDFacts Initiative
          # homepage (not a data file). Confirmed live: SCHOOL_YEAR and
          # TOTAL_ENROLLMENT are 100% blank; AGENCY_NAME populated on only
          # 11 of 33 rows. Not usable school-level enrollment data.
          +enabled: false
      procurement:
        procurement__intl_adb_data:
          # 2026-08-06: stub -- 41 rows, loaded from data.adb.org's homepage (not
          # a data file). Confirmed live: COUNTRY, PROJECT_ID, LOAN_AMOUNT_USD --
          # every real field -- are 100% blank across all rows.
          +enabled: false
      transport:
        transport__fed_nhtsa_investigations:
          # 2026-07-31: a raw passthrough auto-generated under a DIFFERENT domain
          # folder than the hand-built consumer_safety__fed_nhtsa_investigations --
          # gen_mart_models.py's duplicate guard only checked its own folder, so it
          # never saw the existing mart and published a second copy. That copy is
          # what first exposed the grain bug in the hand-built one (see that model's
          # header). Now that the hand-built model is grain-correct (154,209 rows,
          # exact), this raw twin adds nothing but a second row-order-only, generic
          # C1..C11 copy of the same data. Disabled rather than left to drift again.
          +enabled: false
        transport__fed_nhtsa_complaints:
          +enabled: false  # raw twin of consumer_safety__fed_nhtsa_complaints (agrees, 2,227,941 rows; redundant)
        transport__fed_nhtsa_recalls:
          +enabled: false  # raw twin of consumer_safety__fed_nhtsa_recalls (agrees, 242,993 rows; redundant)
      legal_enforcement:
        legal_enforcement__fed_naag_multistate_settlements:
          +enabled: true  # re-enabled 2026-07-24: source re-ingested (882 rows)
      regulation:
        regulation__fed_fdic_enforcement:
          +enabled: false  # stub: 14 rows, failed scrape

# The canonical-clock control table (added 2026-08-20). Every live mart table is
# listed, including the 244 with no usable clock and WHY -- a table missing from
# the registry would be indistinguishable from one that was checked and found to
# have none. This is what lets the timeline layer run on plain SQL with no AI at
# runtime. Regenerate with scripts/census/gen_time_views.py.
seeds:
  ripple:
    ripple_time_registry:
      +database: LIBRARY_MARTS
      +schema: TIMELINE
