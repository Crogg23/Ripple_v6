version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_USASPENDING_BULK
        description: >
          Raw landing table for USAspending.gov Bulk Award Data Archive. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_usaspending_bulk__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (UEI+ACTION_DATE+ACTION_DATE_FISCAL_YEAR+PERIOD_OF_PERFORMANCE_START_DATE+AWARD_ID_PIID+PARENT_AWARD_AGENCY_ID+PARENT_AWARD_ID_PIID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: recipient_uei
        data_tests:
          - not_null
      - name: action_date
        data_tests:
          - not_null
      - name: action_date_fiscal_year
        data_tests:
          - not_null
      - name: period_of_performance_start_date
        data_tests:
          - not_null
      - name: award_id_piid
        data_tests:
          - not_null
      - name: parent_award_agency_id
        data_tests:
          - not_null
      - name: parent_award_id_piid
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - recipient_uei
            - action_date
            - action_date_fiscal_year
            - period_of_performance_start_date
            - award_id_piid
            - parent_award_agency_id
            - parent_award_id_piid
