version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ITIS_PUBLICATIONS
        description: >
          Raw landing table for ITIS (Integrated Taxonomic Information System,
          USDA/USGS) — publications. All data columns arrive as TEXT;
          metadata columns are INGESTED_AT (epoch NUMBER) / SOURCE_RUN_ID / SRC_SHA256.

models:
  - name: stg_fed_itis_publications__publications
    description: >
      Staged view of the ITIS publications landing table.
      Bibliographic records for publications cited as taxonomic evidence; one row per publication id (with prefix).
      Grain verified live: one row per pub_id_prefix, publication_id (30,772 rows).
    columns:
      - name: itis_publications_key
        description: Surrogate key over (pub_id_prefix, publication_id) — the verified grain.
        data_tests:
          - unique
          - not_null
      - name: pub_id_prefix
        description: Component of the composite key.
        data_tests:
          - not_null
      - name: publication_id
        description: Component of the composite key.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingestion timestamp (from epoch INGESTED_AT).
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run.
