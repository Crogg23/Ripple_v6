version: 2

models:
  - name: stg_fed_epa_sdwa_sdwa_facilities__facilities
    description: "GRAIN: one row per facility (PWSID+FACILITY_DEACTIVATION_DATE+FIRST_REPORTED_DATE+LAST_REPORTED_DATE+FACILITY_ID+STATE_FACILITY_ID unique). SPINE_ENTITY: facility."
    columns:
      - name: pwsid
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: facility_deactivation_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: first_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: last_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: facility_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: state_facility_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pwsid
              - facility_deactivation_date
              - first_reported_date
              - last_reported_date
              - facility_id
              - state_facility_id
