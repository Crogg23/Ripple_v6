version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FRA_CASUALTIES

models:
  - name: stg_fed_fra_casualties__all
    description: "FRA Form 55a rail casualties (injuries/illnesses/deaths) by railroad, person type and cause, 1975-present."
    columns:
      - name: report_key
        description: FRA report key, verified unique on the 2026-08-09 load.
        data_tests: [not_null, unique]
      - name: railroad_code
        data_tests: [not_null]
      - name: incident_year
        data_tests: [not_null]
