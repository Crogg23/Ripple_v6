    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (HAZARD_MODEL_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: hazard_model_id
        data_tests:
          - unique
          - not_null
