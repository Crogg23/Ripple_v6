version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_GEM_HAZARD
        description: >
          Raw landing table for GEM Global Seismic Hazard Model (OpenQuake Mosaic). All columns arrive as TEXT and
          are cast in the staging layer.

models:
