version: 2

models:
  - name: stg_fed_epa_icis_air_icis_air_program_subparts__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (PGM_SYS_ID+PROGRAM_CODE+PROGRAM_DESC+AIR_PROGRAM_SUBPART_CODE unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: pgm_sys_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: program_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: program_desc
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: air_program_subpart_code
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pgm_sys_id
              - program_code
              - program_desc
              - air_program_subpart_code
