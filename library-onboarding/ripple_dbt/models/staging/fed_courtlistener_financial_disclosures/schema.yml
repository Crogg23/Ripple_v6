version: 2

models:
  - name: stg_fed_courtlistener_financial_disclosures__people
    description: "GRAIN: one row per person (CL_PERSON_ID+DATE_CREATED+DATE_MODIFIED+YEAR+ID unique). SPINE_ENTITY: person."
    columns:
      - name: person_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: date_created
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: date_modified
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: year
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - date_created
              - date_modified
              - year
              - id
