version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CMS_MAIN
        description: >
          Raw landing table for CMS Data Portal (data.cms.gov). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_cms_main__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (DATASET_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: dataset_id
        data_tests:
          - unique
          - not_null
