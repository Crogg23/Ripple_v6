version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FJC_SERVICE
        description: >
          Raw landing table for FJC Biographical Directory of Article III Federal Judges -- Federal Judicial Service. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_fjc_service__people
    description: "GRAIN: one row per person (SEAT_ID is unique). SPINE_ENTITY: person."
    columns:
      - name: seat_id
        data_tests:
          - unique
          - not_null
