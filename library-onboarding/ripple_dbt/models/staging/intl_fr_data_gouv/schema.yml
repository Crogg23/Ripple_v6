version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_FR_DATA_GOUV
        description: >
          Raw landing table for data.gouv.fr. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_intl_fr_data_gouv__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (DATASET_ID+RESOURCE_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: dataset_id
        data_tests:
          - not_null
      - name: resource_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - dataset_id
            - resource_id
