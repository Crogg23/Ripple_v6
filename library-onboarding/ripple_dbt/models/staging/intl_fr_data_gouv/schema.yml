version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_FR_DATA_GOUV_FULL
        description: >
          Raw landing table for data.gouv.fr, re-pulled in full 2026-08-11
          (130,431 rows). DATASET-grain publisher export: ID and SLUG are both
          unique; the old capped table's dataset+resource grain and RESOURCE_*
          columns no longer exist. ORGANIZATION_ID is null on ~6.6K
          user-owned (non-organization) datasets. All columns arrive as TEXT
          and are cast in the mart layer.

models:
  - name: stg_intl_fr_data_gouv__records
    description: >
      GRAIN: one row per dataset (dataset_id unique; verified 2026-08-11 on
      the full pull, 130,431 distinct IDs in 130,431 rows).
    columns:
      - name: dataset_id
        data_tests:
          - not_null
          - unique
      - name: slug
        data_tests:
          - not_null
