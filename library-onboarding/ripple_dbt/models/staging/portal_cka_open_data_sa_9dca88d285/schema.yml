version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_OPEN_DATA_SA_9DCA88D285
        description: >
          Raw landing table for IMP Drainage. All columns arrive as TEXT and
          are cast in the staging layer.

models:
