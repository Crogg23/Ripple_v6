    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (GEOM+FISCAL_YEAR unique). SPINE_ENTITY: place."
    columns:
      - name: shape__length
        data_tests:
          - not_null
      - name: fiscal_year
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shape__length
              - fiscal_year