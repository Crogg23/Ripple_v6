version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FDA_DEVICE_ENFORCEMENT
        description: >
          Raw landing table for FDA Device Enforcement (Recall) reports
          (openFDA device/enforcement API). Lands as VARIANT chunk rows
          holding whole API responses; the real records live in the
          RAW:results arrays.

models:

  - name: stg_fed_fda_device_enforcement__device_enforcement_recalls
    description: >
      Staging model for FDA device enforcement recall records. Flattens the
      RAW:results arrays from the openFDA response chunks, renames to
      snake_case, casts to appropriate types, and deduplicates on
      recall_number keeping the most recently ingested row.
    columns:

      - name: recall_number
        description: Unique identifier for the recall action assigned by FDA.
        data_tests:
          - unique
          - not_null

      - name: event_id
        description: FDA enforcement event identifier grouping related recall actions.
        data_tests:
          - not_null

      - name: product_code
        description: Three-letter FDA product code for the recalled device category (joins to device classification).

      - name: status
        description: Current status of the recall.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Ongoing
                  - Completed
                  - Terminated
                  - Pending

      - name: classification
        description: >
          Recall classification: Class I (dangerous/defective),
          Class II (may cause temporary adverse health consequences),
          Class III (unlikely to cause health problems).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Class I
                  - Class II
                  - Class III
                  - Not Yet Classified

      - name: voluntary_mandated
        description: Whether the recall was voluntary (firm-initiated) or FDA-mandated.
        data_tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values:
                  - Voluntary
                  - FDA Mandated
                  - FDA-Mandated
      - name: product_type
        description: Type of product recalled.

      - name: product_description
        description: Detailed description of the recalled device.

      - name: product_quantity
        description: Quantity of product subject to recall.

      - name: reason_for_recall
        description: Narrative explanation of why the device is being recalled.

      - name: distribution_pattern
        description: Geographic scope and channels of distribution for the recalled device.

      - name: code_info
        description: Lot numbers, expiration dates, serial numbers, or other product codes.

      - name: more_code_info
        description: Additional code/lot information beyond the primary code_info field.

      - name: recall_initiation_date
        description: Date the recall was initiated by the recalling firm.

      - name: center_classification_date
        description: Date FDA center classified the recall.

      - name: termination_date
        description: Date the recall was terminated, if applicable.

      - name: report_date
        description: Date the enforcement report was published by FDA.

      - name: recalling_firm
        description: Name of the firm initiating the recall.
        data_tests:
          - not_null

      - name: address_1
        description: Primary street address of the recalling firm.

      - name: address_2
        description: Secondary address line of the recalling firm.

      - name: city
        description: City of the recalling firm.

      - name: state
        description: State of the recalling firm.

      - name: postal_code
        description: Postal/ZIP code of the recalling firm.

      - name: country
        description: Country of the recalling firm.

      - name: initial_firm_notification
        description: Method used by the firm to first notify the public or trade about the recall.

      - name: openfda
        description: openFDA enrichment sub-object, kept whole.

      - name: _ingested_at
        description: Timestamp when the record was loaded into the landing table.
        data_tests:
          - not_null

      - name: _source_run_id
        description: Pipeline run identifier that produced this row.

  - name: health__fed_fda_device_enforcement
    description: >
      Analytics-ready mart table for FDA device enforcement recall records.
      One row per recall_number, with recalling-firm location, recall
      classification, and product_code for joining to device classification.
    columns:

      - name: recall_number
        description: Unique identifier for the recall action assigned by FDA (primary key).
        data_tests:
          - unique
          - not_null

      - name: event_id
        description: FDA enforcement event identifier grouping related recall actions.
        data_tests:
          - not_null

      - name: product_code
        description: Three-letter FDA product code for the recalled device category.

      - name: status
        description: Current status of the recall.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Ongoing
                  - Completed
                  - Terminated
                  - Pending

      - name: classification
        description: Recall classification (Class I / II / III).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Class I
                  - Class II
                  - Class III
                  - Not Yet Classified

      - name: voluntary_mandated
        description: Whether the recall was voluntary or FDA-mandated.
        data_tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values:
                  - Voluntary
                  - FDA Mandated
                  - FDA-Mandated
      - name: initial_firm_notification
        description: Method used by the firm to first notify the public or trade.

      - name: product_type
        description: Type of product recalled.

      - name: product_description
        description: Detailed description of the recalled device.

      - name: product_quantity
        description: Quantity of product subject to recall.

      - name: reason_for_recall
        description: Narrative explanation of why the device is being recalled.

      - name: distribution_pattern
        description: Geographic scope and channels of distribution.

      - name: code_info
        description: Lot numbers, expiration dates, serial numbers, or other product codes.

      - name: more_code_info
        description: Additional code/lot information.

      - name: recall_initiation_date
        description: Date the recall was initiated.

      - name: center_classification_date
        description: Date FDA center classified the recall.

      - name: termination_date
        description: Date the recall was terminated, if applicable.

      - name: report_date
        description: Date the enforcement report was published.

      - name: recalling_firm
        description: Name of the firm initiating the recall.
        data_tests:
          - not_null

      - name: address_1
        description: Primary street address of the recalling firm.

      - name: address_2
        description: Secondary address line of the recalling firm.

      - name: city
        description: City of the recalling firm.

      - name: state
        description: State of the recalling firm.

      - name: postal_code
        description: Postal/ZIP code of the recalling firm.

      - name: country
        description: Country of the recalling firm.

      - name: registration_number_list
        description: openFDA establishment registration numbers, joined to a scalar list.

      - name: k_number_list
        description: openFDA 510(k) clearance numbers, joined to a scalar list.

      - name: fei_number_list
        description: openFDA FEI facility identifiers, joined to a scalar list.

      - name: openfda
        description: openFDA enrichment sub-object, kept whole.
