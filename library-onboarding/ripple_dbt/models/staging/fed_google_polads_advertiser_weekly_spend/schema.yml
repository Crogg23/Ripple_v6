version: 2

models:
  - name: stg_fed_google_polads_advertiser_weekly_spend__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (ADVERTISER_ID+ELECTION_CYCLE+WEEK_START_DATE unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: advertiser_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: election_cycle
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: week_start_date
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - advertiser_id
              - election_cycle
              - week_start_date
