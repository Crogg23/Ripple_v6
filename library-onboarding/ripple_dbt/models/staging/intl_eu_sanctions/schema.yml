version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_EU_SANCTIONS
        description: >
          Raw landing table for EU Consolidated Financial Sanctions List. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_intl_eu_sanctions__places
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per place (ZIP+DATE_FILE+LEBA_PUBLICATION_DATE+NAAL_LEBA_PUBLICATION_DATE+ENTITY_LOGICAL_ID+NAAL_LOGICAL_ID+ENTITY_LOGICAL_ID_1+ENTITY_LOGICAL_ID_2+BIRT_LOGICAL_ID+ENTITY_LOGICAL_ID_3+IDEN_LOGICAL_ID+ENTITY_LOGICAL_ID_4+CITI_LOGICAL_ID+ENTITY_LOGICAL_ID_5 unique). SPINE_ENTITY: place."
    columns:
      - name: addr_zipcode
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: date_file
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: leba_publication_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: naal_leba_publication_date
        data_tests:
          - not_null:
              config:
