version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_SOC_TEXAS_OPEN_DATA_354E3ABF4F
        description: >
          Raw landing table for Texas Commission on Environmental Quality - NOR Facilities. All columns arrive as TEXT and
          are cast in the staging layer.

models:
