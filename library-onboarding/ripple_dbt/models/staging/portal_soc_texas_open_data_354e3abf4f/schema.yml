    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per place (ZIP+NOR_REGISTRATION_DATE unique). SPINE_ENTITY: place."
    columns:
      - name: site_zip_cd
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: nor_registration_date
        data_tests:
          - not_null:
              config:
                severity: warn
