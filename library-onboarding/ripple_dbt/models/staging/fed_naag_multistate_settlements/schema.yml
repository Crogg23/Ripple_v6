version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_NAAG_MULTISTATE_SETTLEMENTS
        description: >-
          Raw landing table for the NAAG Multistate Settlements Database.
          All columns arrive as TEXT and are cast in the staging layer.

models:
  - name: stg_fed_naag_multistate_settlements__multistate_settlements
    description: >-
      Staging model for NAAG Multistate Settlements — REWRITTEN 2026-08-22
      against the schema the 2026-08-22 re-pull actually landed (case number,
      defendants, AG coalitions, settlement amounts). Grain: one row = one
      settlement entry, deduped on ID (source's own unique key; verified
      882 = 882, zero null on rewrite day).
    columns:
      - name: id
        description: Source-provided unique record identifier.
        data_tests:
          - not_null
          - unique

      - name: case_number
        description: NAAG case number.

      - name: date_resolved
        description: Date the settlement resolved (cast from M/D/YYYY text).

      - name: defendants
        description: Primary defendant company names, comma-separated.

      - name: total_settlement_amount
        description: Total settlement value in USD (cast to DOUBLE).

      - name: lead_ags
        description: Attorneys general who led the multistate coalition.

      - name: _ingested_at
        description: Timestamp when the record was ingested into the landing table.

      - name: _source_run_id
        description: Identifier for the pipeline run that loaded the record.

  - name: legal_enforcement__fed_naag_multistate_settlements
    description: >-
      Analytics-ready mart table for NAAG Multistate Settlements. Exposes
      key identifiers for cross-source joins and adds convenience columns
      such as settlement year, month, and a surrogate key.

      GRAIN NOTE (2026-08-07): the model's current .sql selects straight from
      the raw source (C_CASE, YEAR, ID, etc.) rather than the company_name/
      settlement_amount/settlement_year columns documented below -- that
      column list is stale relative to the live SQL. The dedup test added
      here targets ID, the source's own unique record identifier, which is
      what the current SELECT actually exposes as the row-level key.
    columns:
      - name: id
        description: >-
          Source-provided unique record identifier for the settlement entry
          (the actual grain key of the current SQL -- see GRAIN NOTE above).
        data_tests:
          - not_null
          - unique
      - name: company_name
        description: Legal name of the company involved in the settlement.

      - name: settlement_amount
        description: Monetary value of the settlement in USD.

      - name: case_description
        description: Narrative description of the case and alleged violations.

      - name: industry
        description: Industry sector of the company involved.

      - name: lead_state
        description: The state that led the multistate coalition in the case.

      - name: num_states
        description: Number of states participating in the settlement.

      - name: document_url
        description: URL to the official settlement document.

      - name: settlement_year
        description: Calendar year extracted from settlement_date for time-series analysis.

      - name: settlement_month
        description: Calendar month extracted from settlement_date for time-series analysis.

      - name: _ingested_at
        description: Timestamp when the record was ingested into the landing table.

      - name: _source_run_id
        description: Identifier for the pipeline run that loaded the record.