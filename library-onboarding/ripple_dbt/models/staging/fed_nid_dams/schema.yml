version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_NID_DAMS

models:
  - name: stg_fed_nid_dams__structures
    description: "USACE National Inventory of Dams: one row per structure. NID_ID NOT unique (associated structures share the parent dam's id; 2 rows have no id) as published -- no unique test."
    columns:
      - name: dam_name
        description: Blank on 4,339 structures as published by USACE (unnamed dams).
      - name: nid_id
        description: Shared by a dam's associated structures; null on 2 rows as published.
