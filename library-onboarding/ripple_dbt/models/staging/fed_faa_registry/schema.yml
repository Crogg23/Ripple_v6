version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FAA_REGISTRY
        description: >
          Raw landing table for FAA Civil Aircraft Registry. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_faa_registry__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (UNIQUE_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: unique_id
        data_tests:
          - unique
          - not_null
