version: 2

models:
  - name: stg_fed_treasury_mts_receipts__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (PARENT_ID+CLASSIFICATION_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: parent_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: classification_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - parent_id
              - classification_id
