    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FINCEN_BOI
        description: >
          Raw landing table for Beneficial Ownership Information Registry. All columns arrive as TEXT and
          are cast in the staging layer.

models:
