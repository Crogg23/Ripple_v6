version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ITIS_LONGNAMES
        description: >
          Raw landing table for ITIS (Integrated Taxonomic Information System,
          USDA/USGS) — longnames. All data columns arrive as TEXT;
          metadata columns are INGESTED_AT (epoch NUMBER) / SOURCE_RUN_ID / SRC_SHA256.

models:
  - name: stg_fed_itis_longnames__complete_names
    description: >
      Staged view of the ITIS longnames landing table.
      Lookup of the assembled complete scientific name for every TSN.
      Grain verified live: one row per tsn (993,346 rows).
    columns:
      - name: tsn
        description: Primary key for this table.
        data_tests:
          - unique
          - not_null
      - name: _loaded_at
        description: Ingestion timestamp (from epoch INGESTED_AT).
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run.
