version: 2

models:
  - name: stg_fed_epa_sdwa_sdwa_events_milestones__facilities
    description: "GRAIN: one row per facility (PWSID+EVENT_END_DATE+EVENT_ACTUAL_DATE+FIRST_REPORTED_DATE+EVENT_SCHEDULE_ID unique). SPINE_ENTITY: facility."
    columns:
      - name: pwsid
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: event_end_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: event_actual_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: first_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: event_schedule_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pwsid
              - event_end_date
              - event_actual_date
              - first_reported_date
              - event_schedule_id
