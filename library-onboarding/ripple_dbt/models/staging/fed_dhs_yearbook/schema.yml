version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_DHS_YEARBOOK
        description: >
          Raw landing table for DHS Yearbook of Immigration Statistics. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_dhs_yearbook__places
    description: "GRAIN: one row per place (COUNTRY+FISCAL_YEAR unique). SPINE_ENTITY: place."
    columns:
      - name: country_of_last_residence
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: fiscal_year
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_of_last_residence
              - fiscal_year
