version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ICE_DETENTION_FACILITY_LIST
        description: >
          Raw landing table for the ICE Detention Facility List published by
          U.S. Immigration and Customs Enforcement. All columns arrive as TEXT.
        columns:
          - name: AOR
            description: Area of Responsibility code assigned by ICE.
          - name: FACILITY_NAME
            description: Name of the detention facility.
          - name: CITY
            description: City in which the facility is located.
          - name: STATE
            description: State in which the facility is located.
          - name: FACILITY_TYPE_DETAILED
            description: Detailed classification of the facility type.
          - name: _ingested_at
            description: Timestamp when the row was ingested into the landing table.
          - name: _source_run_id
            description: Identifier for the ingestion run that loaded this row.

models:

  - name: stg_fed_ice_detention_facility_list__facility
    description: >
      Staging model for the ICE Detention Facility List. Renames columns to
      snake_case, casts to appropriate types, and deduplicates on facility_name
      keeping the most recently ingested record.
    columns:
      - name: facility_name
        description: Name of the detention facility (primary key).
        data_tests:
          - unique
          - not_null
      - name: aor
        description: Area of Responsibility code assigned by ICE.
        data_tests:
          - not_null
      - name: city
        description: City in which the facility is located.
      - name: state
        description: Two-letter state abbreviation where the facility is located.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - AL
                  - AK
                  - AZ
                  - AR
                  - CA
                  - CO
                  - CT
                  - DC
                  - DE
                  - FL
                  - GA
                  - GU
                  - HI
                  - ID
                  - IL
                  - IN
                  - IA
                  - KS
                  - KY
                  - LA
                  - ME
                  - MD
                  - MA
                  - MI
                  - MN
                  - MS
                  - MO
                  - MT
                  - NE
                  - NV
                  - NH
                  - NJ
                  - NM
                  - NY
                  - NC
                  - ND
                  - OH
                  - OK
                  - OR
                  - PA
                  - PR
                  - RI
                  - SC
                  - SD
                  - TN
                  - TX
                  - UT
                  - VT
                  - VA
                  - VI
                  - WA
                  - WV
                  - WI
                  - WY
                  - MP
                quote: true
      - name: facility_type_detailed
        description: Detailed classification of the facility type.
      - name: _ingested_at
        description: Timestamp when the row was ingested into the landing table.
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion run that loaded this row.
        data_tests:
          - not_null
