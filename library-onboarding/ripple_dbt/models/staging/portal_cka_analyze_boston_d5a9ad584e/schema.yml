version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_ANALYZE_BOSTON_D5A9AD584E
        description: >
          Raw landing table for Zoning Reform Impact Tracker. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_cka_analyze_boston_d5a9ad584e__filings
    description: "GRAIN: one row per filing (ZIP+PERMIT_APPLICATION_FILING_DATE+PERMIT_ISSUED_DATE+REZONING_EFFECTIVE_DATE+PARCEL_ID+SAM_ID unique). SPINE_ENTITY: filing."
    columns:
      - name: zip_code
        data_tests:
          - not_null
      - name: permit_application_filing_date
        data_tests:
          - not_null
      - name: permit_issued_date
        data_tests:
          - not_null
      - name: rezoning_effective_date
        data_tests:
          - not_null
      - name: parcel_id
        data_tests:
          - not_null
      - name: sam_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip_code
              - permit_application_filing_date
              - permit_issued_date
              - rezoning_effective_date
              - parcel_id
              - sam_id