version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_WQP_MONITORING_STATIONS
        description: >
          Raw landing table for fed_wqp_monitoring_stations. Water Quality Portal monitoring stations: surface- and ground-water monitoring locations with organization, type, HUC8 watershed, coordinates, and well/aquifer details.
          Nearly all columns arrive as TEXT.

models:
  - name: stg_fed_wqp_monitoring_stations__stations
    description: >
      Staged view of the fed_wqp_monitoring_stations landing table. TEXT columns are cast to
      appropriate types. Grain: one row = one monitoring station (monitoringlocationidentifier unique).
    columns:
      - name: monitoring_location_identifier
        description: Primary key for this entity.
        data_tests:
          - unique
          - not_null
      - name: _loaded_at
        description: Epoch timestamp (microseconds) when the record was ingested into the landing table.
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run that loaded this record.
      - name: _src_sha256
        description: SHA-256 of the source file the record came from.
