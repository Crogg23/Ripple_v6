version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ICE_DETENTION_FACILITY_CODES
        description: >
          Raw landing table for fed_ice_detention_facility_codes. ICE detention facility code list: the internal facility codes ICE uses in detention data, with facility name, address, county, area of responsibility (AOR), coordinates, and facility type.
          Nearly all columns arrive as TEXT.

models:
  - name: stg_fed_ice_detention_facility_codes__facility_codes
    description: >
      Staged view of the fed_ice_detention_facility_codes landing table. TEXT columns are cast to
      appropriate types. Grain: one row = one detention facility code (detention_facility_code unique).
    columns:
      - name: detention_facility_code
        description: Primary key for this entity.
        data_tests:
          - unique
          - not_null
      - name: _loaded_at
        description: Epoch timestamp (microseconds) when the record was ingested into the landing table.
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run that loaded this record.
      - name: _src_sha256
        description: SHA-256 of the source file the record came from.
