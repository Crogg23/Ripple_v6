version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FEC_BULK_COMMITTEES
        description: >
          Raw landing table for FEC Bulk Data -- Committee Master (cm.txt), 2026 refresh. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_fec_bulk_committees__people
    description: "GRAIN: one row per organization-person relationship (FEC_CAND_ID+FEC_CMTE_ID is unique). SPINE_ENTITY: person."
    columns:
      - name: fec_cand_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: fec_cmte_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fec_cand_id
              - fec_cmte_id
