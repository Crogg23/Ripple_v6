    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (EIN+ACTIVE_DATE+APPOINTMENT_TYPE+NAIC_ID unique). SPINE_ENTITY: organization."
    columns:
      - name: npn_ein
        data_tests:
          - not_null
      - name: active_date
        data_tests:
          - not_null
      - name: appointment_type
        data_tests:
          - not_null
      - name: naic_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - npn_ein
              - active_date
              - appointment_type
              - naic_id