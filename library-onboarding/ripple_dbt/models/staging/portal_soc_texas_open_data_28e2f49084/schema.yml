version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_SOC_TEXAS_OPEN_DATA_28E2F49084
        description: >
          Raw landing table for Active insurance company appointments for agents and adjusters. All columns arrive as TEXT and
          are cast in the staging layer.

models:
