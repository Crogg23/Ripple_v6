version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_SLAVEVOYAGES_INTRAAMERICAN
        description: >
          Raw landing table for the Intra-American Slave Trade Database
          (SlaveVoyages). All columns arrive as TEXT from the ingestion pipeline.

models:

  - name: stg_fed_slavevoyages_intraamerican__intra_american_voyages
    description: >
      Staging model for the Intra-American Slave Trade Database (SlaveVoyages).
      Renames raw SlaveVoyages codebook columns (VOYAGEID, TSLAVESD, SLAARRIV,
      ...) per the official SPSS codebook, casts to appropriate types, and
      deduplicates on voyage_id. Geography fields are carried through as raw
      numeric SlaveVoyages place codes (no code->name table is landed in this
      warehouse) rather than fabricated as country names — see the model's
      2026-07-30 remediation note for why.
    columns:

      - name: voyage_id
        description: Unique identifier for each recorded voyage (VOYAGEID).
        data_tests:
          - unique
          - not_null

      - name: date_of_departure
        description: Parsed date the voyage began (DATEDEPA/B/C).
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: year_of_arrival
        description: Year of arrival at the port of disembarkation (YEARAM, per codebook).
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: port_of_departure_code
        description: >
          Numeric SlaveVoyages place code for the port of departure (PORTDEP)
          — NOT a resolved place name; no geography lookup table is landed.
          Verified live 2026-07-30: populated on only 29/11,521 rows (0.25%)
          — a strict not_null would fail on 99.75% of this 500-year-old
          historical record, not catch a real defect.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: port_of_arrival_code
        description: >
          Numeric SlaveVoyages place code for the first intended port of
          disembarkation (ARRPORT) — NOT a resolved place name. Verified live
          2026-07-30: populated on 4,813/11,521 rows (42%).
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: captain_name
        description: >
          Name of the first captain recorded for the voyage (CAPTAINA).
          Verified live 2026-07-30: populated on 10,512/11,521 rows (91%).
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: num_enslaved_embarked
        description: >
          Total enslaved people on board at departure from the last slaving
          port (TSLAVESD, per codebook).

      - name: num_enslaved_disembarked
        description: >
          Total enslaved people who arrived at the first port of
          disembarkation (SLAARRIV, per codebook).

      - name: vessel_name
        description: Name of the vessel used for the voyage (SHIPNAME).

      - name: first_owner_name
        description: First recorded owner of the voyage/venture (OWNERA).

      - name: source_citation
        description: First recorded bibliographic source for the voyage (SOURCEA).

      - name: _ingested_at
        description: Real per-row landing timestamp propagated from the ingestion layer (INGESTED_AT).

      - name: _source_run_id
        description: Pipeline run identifier propagated from the ingestion layer.

  - name: historical_records__fed_slavevoyages_intraamerican
    description: >
      Analytics-ready mart table for the Intra-American Slave Trade Database.
      Exposes standardised cross-source join keys alongside voyage-level detail
      including temporal, geographic, and demographic dimensions.
    columns:

      - name: country_of_arrival
        description: Country associated with the port of arrival.

      - name: slave_trade_company
        description: Trading company associated with the voyage.

      - name: num_enslaved_embarked
        description: Number of enslaved persons who embarked on the voyage.

      - name: num_enslaved_disembarked
        description: Number of enslaved persons who disembarked from the voyage.

      - name: num_enslaved_mortality_estimate
        description: >
          Derived estimate of mortality: embarked minus disembarked.
          Null values in source measures are treated as zero for this calculation.

      - name: vessel_name
        description: Name of the vessel used for the voyage.

      - name: source_citation
        description: Bibliographic citation for the primary source record.

      - name: source_voyage_id
        description: Voyage identifier as supplied by the original source system.

      - name: fips_code
        description: FIPS geographic code (null for this source — reserved for cross-source joins).

      - name: _ingested_at
        description: Timestamp when the row was processed by the staging model.

      - name: _source_run_id
        description: Pipeline run identifier propagated from the ingestion layer.