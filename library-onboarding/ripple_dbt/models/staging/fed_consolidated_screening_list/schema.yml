version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CONSOLIDATED_SCREENING_LIST

models:
  - name: stg_fed_consolidated_screening_list__entries
    description: "US Consolidated Screening List: one row per entry across 13 federal export-control/sanctions lists. entry_id has ~96 published doubles (differing name/source) -- no unique test."
    columns:
      - name: entry_id
        data_tests: [not_null]
      - name: source_list
        data_tests: [not_null]
      - name: name
        data_tests: [not_null]
