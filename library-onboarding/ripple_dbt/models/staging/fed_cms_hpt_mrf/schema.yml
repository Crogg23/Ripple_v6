version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CMS_HPT_MRF
        description: >
          Raw landing table for Hospital Price Transparency Machine-Readable Files. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_cms_hpt_mrf__providers
    description: "GRAIN: one row per provider (NPI is unique). SPINE_ENTITY: provider."
    columns:
      - name: npi
        data_tests:
          - unique
          - not_null
