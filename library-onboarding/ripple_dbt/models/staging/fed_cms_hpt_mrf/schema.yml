version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CMS_HPT_MRF
        description: >
          Raw landing table for Hospital Price Transparency Machine-Readable Files. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_cms_hpt_mrf__providers
    description: "GRAIN: one row per provider (NPI is unique). SPINE_ENTITY: provider."
    columns:
      - name: npi
        description: >
          KNOWN BAD (found by key_is_real live-profiling, 2026-08-06): this table
          is functionally empty -- exactly 1 row, and its NPI is an empty string
          ('', not SQL NULL), so it silently passes not_null while carrying zero
          real data. A masked-blank case, not a real key yet. Source needs a real
          reload before this model is usable.
        data_tests:
          - unique
          - not_null
          - key_is_real:
              config:
                severity: warn
              arguments:
                min_distinct: 1
