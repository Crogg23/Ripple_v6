version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: XC_UK_SANCTIONS_LIST

models:
  - name: stg_xc_uk_sanctions_list__designations
    description: "UK OFSI consolidated financial sanctions list: one row per name variant of a designated target (designation_id groups variants; 6,315 designations over 57,883 name rows). Not row-unique by design."
    columns:
      - name: designation_id
        data_tests: [not_null]
      - name: regime_name
        data_tests: [not_null]
