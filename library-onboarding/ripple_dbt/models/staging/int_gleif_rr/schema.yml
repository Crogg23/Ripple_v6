version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INT_GLEIF_RR

models:
  - name: stg_int_gleif_rr__all
    description: >
      GLEIF Relationship Records — parent-child ownership chains across 482K
      relationship rows. Grain is (LEI, PARENT_LEI, RELATIONSHIP_TYPE): a single
      child LEI can have multiple relationship rows (e.g. IS_DIRECTLY_CONSOLIDATED_BY
      and IS_ULTIMATELY_CONSOLIDATED_BY are separate rows), so LEI alone is not unique.
    columns:
      - name: LEI
        data_tests:
          - not_null
      - name: PARENT_LEI
        data_tests:
          - not_null
      - name: RELATIONSHIP_TYPE
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - LEI
              - PARENT_LEI
              - RELATIONSHIP_TYPE
