version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_ANALYZE_BOSTON_DD269D0A1D
        description: >
          Raw landing table for Boston Street Segments (SAM System). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_cka_analyze_boston_dd269d0a1d__places
    description: "GRAIN: one row per place (ZIP+SEGMENT_ID unique). SPINE_ENTITY: place."
    columns:
      - name: zip_r
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: segment_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip_r
              - segment_id
