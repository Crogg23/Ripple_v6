version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_GRANTS_GOV
        description: >
          Raw landing table for Grants.gov Opportunity Search API. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_grants_gov__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (OPPORTUNITY_ID is unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: opportunity_id
        data_tests:
          - unique
          - not_null
