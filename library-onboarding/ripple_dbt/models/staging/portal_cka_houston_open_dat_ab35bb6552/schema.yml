version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_HOUSTON_OPEN_DAT_AB35BB6552
        description: >
          Raw landing table for BARC Dog Intakes for Calendar Years 2011 and 2012. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_cka_houston_open_dat_ab35bb6552__places
    description: "GRAIN: one row per place (ZIP+IN_DATE+DUE_DATE+OUT_DATE+ID unique). SPINE_ENTITY: place."
    columns:
      - name: zip
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: in_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: due_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: out_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip
              - in_date
              - due_date
              - out_date
              - id
