version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FHFA_FHLB_MEMBERSHIP
        description: >
          Raw landing table for fed_fhfa_fhlb_membership. FHFA Federal Home Loan Bank membership roster: every FHLB member institution with district, member type, charter type, and regulator identifiers (FDIC CERT, Fed ID, NCUA ID, NAIC ID).
          Nearly all columns arrive as TEXT.

models:
  - name: stg_fed_fhfa_fhlb_membership__members
    description: >
      Staged view of the fed_fhfa_fhlb_membership landing table. TEXT columns are cast to
      appropriate types. Grain: one row = one FHLB member institution (fhfa_id unique).
    columns:
      - name: fhfa_id
        description: Primary key for this entity.
        data_tests:
          - unique
          - not_null
      - name: cert
        description: "FDIC certificate number — join key to FDIC bank data."
      - name: ncua_id
        description: "NCUA charter number — join key to NCUA credit-union data."
      - name: naic_id
        description: "NAIC company code — join key to state insurance data."
      - name: _loaded_at
        description: Epoch timestamp (microseconds) when the record was ingested into the landing table.
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run that loaded this record.
      - name: _src_sha256
        description: SHA-256 of the source file the record came from.
