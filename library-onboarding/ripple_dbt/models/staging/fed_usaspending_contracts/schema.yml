version: 2

models:
  - name: stg_fed_usaspending_contracts__organizations
    description: "GRAIN: one row per organization (UEI+ACTION_DATE+PERIOD_OF_PERFORMANCE_START_DATE+PERIOD_OF_PERFORMANCE_CURRENT_END_DATE+AWARD_ID_PIID unique). SPINE_ENTITY: organization."
    columns:
      - name: recipient_uei
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: action_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: period_of_performance_start_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: period_of_performance_current_end_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: award_id_piid
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - recipient_uei
              - action_date
              - period_of_performance_start_date
              - period_of_performance_current_end_date
              - award_id_piid
