version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: XC_OWID_REFUGEES
        description: >
          Raw landing table for OWID — Refugee population by country of origin. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_xc_owid_refugees__places
    description: "GRAIN: one row per place (COUNTRY+YEAR+CODE unique). SPINE_ENTITY: place."
    columns:
      - name: refugees_by_country_of_origin
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: year
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: code
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - refugees_by_country_of_origin
              - year
              - code
