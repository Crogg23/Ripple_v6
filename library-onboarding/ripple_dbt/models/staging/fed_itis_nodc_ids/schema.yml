version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ITIS_NODC_IDS
        description: >
          Raw landing table for ITIS (Integrated Taxonomic Information System,
          USDA/USGS) — nodc_ids. All data columns arrive as TEXT;
          metadata columns are INGESTED_AT (epoch NUMBER) / SOURCE_RUN_ID / SRC_SHA256.

models:
  - name: stg_fed_itis_nodc_ids__nodc_ids
    description: >
      Staged view of the ITIS nodc_ids landing table.
      Crosswalk from legacy NOAA/NODC taxonomic codes to ITIS TSNs; one row per NODC id x TSN.
      Grain verified live: one row per nodc_id, tsn (209,565 rows).
    columns:
      - name: itis_nodc_ids_key
        description: Surrogate key over (nodc_id, tsn) — the verified grain.
        data_tests:
          - unique
          - not_null
      - name: nodc_id
        description: Component of the composite key.
        data_tests:
          - not_null
      - name: tsn
        description: Component of the composite key.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingestion timestamp (from epoch INGESTED_AT).
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run.
