version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_SOC_UTAH_OPEN_DATA_P_D4ACA49A9B
        description: >
          Raw landing table for 2022 - 2023 Utah Clinic Quality Comparisons. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_soc_utah_open_data_p_d4aca49a9b__providers
    description: "GRAIN: one row per provider (NPI+REPORTING_PERIOD+ZIP+MEASURE_ID unique). SPINE_ENTITY: provider."
    columns:
      - name: provider_npi
        data_tests:
          - not_null
      - name: reporting_period
        data_tests:
          - not_null
      - name: provider_postal_code
        data_tests:
          - not_null
      - name: measure_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - provider_npi
            - reporting_period
            - provider_postal_code
            - measure_id
