version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_INDIANA_DATA_HUB_FE00D42ACC
        description: >
          Raw landing table for COVID-19 Vaccinations by Date. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_cka_indiana_data_hub_fe00d42acc__places
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per place (FIPS+DATE unique). SPINE_ENTITY: place."
    columns:
      - name: fips
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: date
        data_tests:
          - not_null:
              config:
                severity: warn
