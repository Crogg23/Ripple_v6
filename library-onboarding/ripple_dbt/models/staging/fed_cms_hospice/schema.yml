version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CMS_HOSPICE
        description: >
          Raw landing table for CMS Care Compare — Hospice General Information. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_cms_hospice__facilities
    description: "GRAIN: one row per facility (CCN is unique). SPINE_ENTITY: facility."
    columns:
      - name: ccn
        data_tests:
          - unique
          - not_null
          - key_is_real:
              arguments:
                min_distinct: 4000
                max_blank_fraction: 0.1
