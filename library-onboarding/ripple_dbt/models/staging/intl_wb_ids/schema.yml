version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_WB_IDS
        description: >
          Raw landing table for World Bank International Debt Statistics (IDS). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_intl_wb_ids__places
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per place (COUNTRY+COUNTERPART_AREA_CODE+SERIES_CODE unique). SPINE_ENTITY: place."
    columns:
      - name: country_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: counterpart_area_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: series_code
        data_tests:
          - not_null:
              config:
                severity: warn
