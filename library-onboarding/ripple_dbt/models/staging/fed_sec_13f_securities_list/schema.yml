version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_SEC_13F_SECURITIES_LIST

models:
  - name: stg_fed_sec_13f_securities_list__all
    description: "SEC Official List of Section 13(f) Securities, 2026 Q2. GRAIN: one row per list line. CUSIP repeats on option lines (CALL/PUT), so it is not unique."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - LIST_QUARTER
              - LINE_NO
    columns:
      - name: LINE_NO
        data_tests:
          - not_null
      - name: CUSIP
        data_tests:
          - not_null
