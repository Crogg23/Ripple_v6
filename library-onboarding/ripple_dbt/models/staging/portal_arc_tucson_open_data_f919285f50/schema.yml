version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_ARC_TUCSON_OPEN_DATA_F919285F50
        description: >
          Raw landing table for Parcels outside the City - 100+ Acres. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_arc_tucson_open_data_f919285f50__cases
    description: "GRAIN: one row per case (DOCKET+LAST_EDITED_DATE unique). SPINE_ENTITY: case."
    columns:
      - name: docket
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: last_edited_date
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - docket
              - last_edited_date
