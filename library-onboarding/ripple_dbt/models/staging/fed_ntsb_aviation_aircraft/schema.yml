version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_NTSB_AVIATION_AIRCRAFT

models:
  - name: stg_fed_ntsb_aviation_aircraft__aircraft
    description: "NTSB aviation accident database, aircraft table: one row per aircraft involved in an event (ev_id + aircraft_key unique). Registration, make/model, owner/operator, certification."
    columns:
      - name: ev_id
        data_tests: [not_null]
      - name: aircraft_key
        data_tests: [not_null]
      - name: oper_cert
        description: >-
          PUBLISHER-ABSENT (byte-check 2026-08-11): 0 of 31,503 rows non-null in
          NTSB's own avall.mdb (fresh download from data.ntsb.gov). NTSB ships the
          column empty; 100% NULL here is faithful to source, NOT a loader bug.
      - name: oprtng_cert
        description: >-
          PUBLISHER-ABSENT (byte-check 2026-08-11): 0 non-null in NTSB's own
          avall.mdb — see oper_cert note. Faithful to source, NOT a loader bug.
