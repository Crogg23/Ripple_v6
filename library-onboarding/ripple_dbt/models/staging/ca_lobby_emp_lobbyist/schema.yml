version: 2

models:
  - name: stg_ca_lobby_emp_lobbyist__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (LOBBYIST_ID+SESSION_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: lobbyist_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: session_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - lobbyist_id
              - session_id
