version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ITIS_GEOGRAPHIC_DIV
        description: >
          Raw landing table for ITIS (Integrated Taxonomic Information System,
          USDA/USGS) — geographic_div. All data columns arrive as TEXT;
          metadata columns are INGESTED_AT (epoch NUMBER) / SOURCE_RUN_ID / SRC_SHA256.

models:
  - name: stg_fed_itis_geographic_div__geographic_divisions
    description: >
      Staged view of the ITIS geographic_div landing table.
      Geographic divisions (continental/oceanic regions) in which each taxon occurs; one row per TSN x geographic value.
      Grain verified live: one row per tsn, geographic_value (480,351 rows).
    columns:
      - name: itis_geographic_div_key
        description: Surrogate key over (tsn, geographic_value) — the verified grain.
        data_tests:
          - unique
          - not_null
      - name: tsn
        description: Component of the composite key.
        data_tests:
          - not_null
      - name: geographic_value
        description: Component of the composite key.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingestion timestamp (from epoch INGESTED_AT).
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run.
