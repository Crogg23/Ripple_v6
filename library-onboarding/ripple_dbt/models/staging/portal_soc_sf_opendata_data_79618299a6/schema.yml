version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_SOC_SF_OPENDATA_DATA_79618299A6
        description: >
          Raw landing table for Registered Business Locations - San Francisco. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_soc_sf_opendata_data_79618299a6__places
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (ZIP+DBA_START_DATE+LOCATION_START_DATE unique). SPINE_ENTITY: place."
    columns:
      - name: business_zip
        data_tests:
          - not_null
      - name: dba_start_date
        data_tests:
          - not_null
      - name: location_start_date
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - business_zip
              - dba_start_date
              - location_start_date