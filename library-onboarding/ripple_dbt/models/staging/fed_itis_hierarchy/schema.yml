version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_ITIS_HIERARCHY
        description: >
          Raw landing table for ITIS (Integrated Taxonomic Information System,
          USDA/USGS) — hierarchy. All data columns arrive as TEXT;
          metadata columns are INGESTED_AT (epoch NUMBER) / SOURCE_RUN_ID / SRC_SHA256.

models:
  - name: stg_fed_itis_hierarchy__hierarchy
    description: >
      Staged view of the ITIS hierarchy landing table.
      Materialized taxonomic tree: one row per TSN with its full hierarchy string, parent TSN, tree level and child count (valid/accepted taxa only).
      Grain verified live: one row per tsn (678,363 rows).
    columns:
      - name: tsn
        description: Primary key for this table.
        data_tests:
          - unique
          - not_null
      - name: _loaded_at
        description: Ingestion timestamp (from epoch INGESTED_AT).
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run.
