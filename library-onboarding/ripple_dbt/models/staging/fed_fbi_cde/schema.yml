version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FBI_CDE
        description: >
          Raw landing table for FBI Crime Data Explorer (NIBRS/UCR). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_fbi_cde__places
    description: "GRAIN: one row per place (FIPS is unique). SPINE_ENTITY: place."
    columns:
      - name: fips_county_code
        data_tests:
          - unique
          - not_null
