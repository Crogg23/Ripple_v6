version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_SLAVEVOYAGES_TRANSATLANTIC
        description: >
          Raw landing table for Trans-Atlantic Slave Trade Database (SlaveVoyages). Grain not yet determined.

models:
  - name: stg_fed_slavevoyages_transatlantic__records
    description: >
      Minimal passthrough staging (grain undetermined, needs manual review) --
      a straight snake_case rename of ~280 raw SlaveVoyages columns, no
      renaming/relabeling. 2026-07-31: added column-level tests -- this
      model is structurally identical in shape (huge hand-listed column
      list, generated by scripts/generate_minimal_staging.py) to
      stg_fed_slavevoyages_intraamerican__intra_american_voyages, which was
      found 100% broken this session after a re-land changed its landing
      schema without anyone updating the model. This one is NOT currently
      broken (verified live: VOYAGEID resolves, fully populated and unique,
      36,108 rows) but had zero tests to catch it if it ever does.
    columns:
      - name: voyageid
        description: >
          Voyage identification number (VOYAGEID, per the SlaveVoyages SPSS
          codebook). Verified live 2026-07-31: unique and fully populated.
        data_tests:
          - unique
          - not_null
