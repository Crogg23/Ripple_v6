version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_NURSINGHOME411
        description: >
          Raw landing table for NursingHome411 State-Level Nursing Home Data. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_nursinghome411__facilities
    description: "GRAIN: one row per facility (CCN is unique). SPINE_ENTITY: facility."
    columns:
      - name: cms_certification_number_ccn
        data_tests:
          - unique
          - not_null
