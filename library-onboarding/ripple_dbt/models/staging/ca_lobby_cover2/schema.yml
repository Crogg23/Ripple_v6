version: 2

models:
  - name: stg_ca_lobby_cover2__filings
    description: "GRAIN: one row per filing (AMEND_ID+ENTITY_ID+FILING_ID+TRAN_ID unique). SPINE_ENTITY: filing."
    columns:
      - name: amend_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: entity_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: filing_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: tran_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - amend_id
              - entity_id
              - filing_id
              - tran_id
