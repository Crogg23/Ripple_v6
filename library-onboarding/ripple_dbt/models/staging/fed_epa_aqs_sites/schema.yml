version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_EPA_AQS_SITES
        description: >
          Raw landing table for fed_epa_aqs_sites. EPA Air Quality System (AQS) monitoring sites: every air-quality monitoring site with location, land use, setting, owning agency, and open/close dates.
          Nearly all columns arrive as TEXT.

models:
  - name: stg_fed_epa_aqs_sites__sites
    description: >
      Staged view of the fed_epa_aqs_sites landing table. TEXT columns are cast to
      appropriate types. Grain: one row = one monitoring site (state_code + county_code + site_number exactly unique).
    columns:
      - name: aqs_site_id
        description: Primary key for this entity.
        data_tests:
          - unique
          - not_null
      - name: _loaded_at
        description: Epoch timestamp (microseconds) when the record was ingested into the landing table.
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run that loaded this record.
      - name: _src_sha256
        description: SHA-256 of the source file the record came from.
