version: 2

models:
  - name: stg_ca_lobby_amendments__filings
    description: "GRAIN: one row per filing (FILING_ID+AMEND_ID unique). SPINE_ENTITY: filing."
    columns:
      - name: filing_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: amend_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - filing_id
              - amend_id
