version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_ARC_TUCSON_OPEN_DATA_F0203665DD
        description: >
          Raw landing table for Pharmacies Proposal2. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_arc_tucson_open_data_f0203665dd__places
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (ZIP+INDUSTRY_DESC unique). SPINE_ENTITY: place."
    columns:
      - name: zip
        data_tests:
          - not_null
      - name: industry_desc
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zip
              - industry_desc