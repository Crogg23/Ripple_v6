version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_EIA860_3_4_ENERGY_STORAGE
        description: >
          Raw landing table for EIA-860 Schedule 3.4 (Energy Storage), 2024
          reporting year. One sheet-row per storage generator. Columns arrive
          as TEXT except STORAGE_TECHNOLOGY_3/4 (all-null, inferred NUMBER).

models:
  - name: stg_fed_eia860_3_4_energy_storage__all
    description: >
      Staged EIA-860 2024 Schedule 3.4 energy-storage detail. One row per
      plant_code + generator_id (verified exact-unique). Energy capacity,
      charge/discharge rates, use-case flags, and coupling typed from TEXT.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plant_code
              - generator_id
    columns:
      - name: plant_code
        description: EIA plant code -- composite primary key component.
        data_tests: [not_null]
      - name: generator_id
        description: Generator identifier within the plant -- composite primary key component.
        data_tests: [not_null]
      - name: utility_id
        description: Reporting utility identifier (FK to Schedule 1).
      - name: nameplate_capacity_mw
        description: Nameplate power capacity in megawatts.
      - name: nameplate_energy_capacity_mwh
        description: Nameplate energy capacity in megawatt-hours.
      - name: maximum_charge_rate_mw
        description: Maximum charge rate in megawatts.
      - name: maximum_discharge_rate_mw
        description: Maximum discharge rate in megawatts.
      - name: storage_technology_1
        description: Primary storage technology code (e.g. LIB = lithium-ion battery).
      - name: _loaded_at
        description: Timestamp the row was ingested into the landing table.
      - name: _source_run_id
        description: Ingestion pipeline run identifier.
      - name: _src_file
        description: Source workbook/sheet file name.
