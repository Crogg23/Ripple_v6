version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_CH_OPENDATASWISS
        description: >
          Raw landing table for Switzerland Open Government Data Portal (opendata.swiss). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_intl_ch_opendataswiss__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (ID is unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
