version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_EIA861_DELIVERY_COMPANIES
        description: >
          Raw landing table for the EIA-861 2024 annual electric utility survey
          (delivery_companies workbook), ingestion sweep 2026-08-05.
          All columns arrive as TEXT; the Excel header landed corrupted and is
          repaired positionally in staging.

models:
  - name: stg_fed_eia861_delivery_companies__sales
    description: >
      EIA-861 (2024 vintage) Delivery Companies: energy-delivery-only companies' revenue (thousand dollars), sales (MWh) and customer counts by sector. All data is reporting year 2024.
      Grain: surrogate over (data_year, utility_number, state, part, service_type); grain not verifiable pre-clean.
    columns:
      - name: record_id
        description: >
          Surrogate key: hash of the natural composite plus a deterministic
          row_number tiebreaker over the full-row hash.
        data_tests:
          - unique
          - not_null
      - name: data_year
        description: Reporting year (2024 for this vintage).
      - name: utility_number
        description: EIA utility identification number.
      - name: _loaded_at
        description: Ingestion timestamp (from _INGESTED_AT).
      - name: _source_run_id
        description: Ingestion pipeline run identifier.
      - name: _src_file
        description: Source Excel workbook file name.
