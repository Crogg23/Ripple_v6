version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_BIA_TRIBAL_GEO
        description: >
          Raw landing table for the BIA Open Data Geospatial Portal.
          All columns are loaded as TEXT from the source system.

models:

  - name: stg_fed_bia_tribal_geo__bia_geospatial_features
    description: >
      Staging model for the BIA American Indian & Alaska Native Land Area
      Representations (AIAN-LAR). Renames columns to snake_case, casts TEXT
      columns to appropriate types, and deduplicates on LARID (most recent
      record wins).
    columns:

      - name: lar_id
        description: BIA Land Area Representation ID — primary key for this entity.
        data_tests:
          - unique
          - not_null

      - name: object_id
        description: Internal object identifier from the source system.
        data_tests:
          - not_null

      - name: lar_name
        description: Name of the tribal Land Area Representation (e.g. "Cheyenne River LAR").

      - name: gis_acres
        description: Acreage of the land area, as computed by the source GIS system.

      - name: shape_area
        description: Polygon area in the source's native units.

      - name: shape_length
        description: Polygon perimeter length in the source's native units.

      - name: geometry_json

      - name: _ingested_at
        description: Timestamp when the record was ingested into the landing layer.

      - name: _source_run_id
        description: Pipeline run identifier for traceability.

  - name: land_and_territory__fed_bia_tribal_geo
    description: >
      Analytics-ready mart table for BIA tribal Land Area Representations.
      Exposes key identifiers for cross-source joins and presents clean,
      typed columns suitable for downstream analysis and mapping.
    columns:

      - name: lar_id
        description: BIA Land Area Representation ID — primary key for this entity.
        data_tests:
          - unique
          - not_null

      - name: object_id
        description: Internal object identifier from the source system.
        data_tests:
          - not_null

      - name: lar_name
        description: Name of the tribal Land Area Representation.

      - name: gis_acres
        description: Acreage of the land area.

      - name: shape_area
        description: Polygon area in the source's native units.

      - name: shape_length
        description: Polygon perimeter length in the source's native units.

      - name: geometry_json

      - name: _ingested_at
        description: Timestamp when the record was ingested into the landing layer.

      - name: _source_run_id
        description: Pipeline run identifier for traceability.
