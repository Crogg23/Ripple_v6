version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_ISO_MIC_REGISTRY
        description: >
          Raw landing table for intl_iso_mic_registry. ISO 10383 Market Identifier Code (MIC) registry: every registered trading venue / market segment worldwide, with operating MIC, legal entity name, LEI, country, and status.
          Nearly all columns arrive as TEXT.

models:
  - name: stg_intl_iso_mic_registry__market_identifier_codes
    description: >
      Staged view of the intl_iso_mic_registry landing table. TEXT columns are cast to
      appropriate types. Grain: one row = one market identifier code (mic unique).
    columns:
      - name: mic
        description: Primary key for this entity.
        data_tests:
          - unique
          - not_null
      - name: lei
        description: "Legal Entity Identifier of the market operator — join key to GLEIF/LEI data."
      - name: _loaded_at
        description: Epoch timestamp (microseconds) when the record was ingested into the landing table.
        data_tests:
          - not_null
      - name: _source_run_id
        description: Identifier for the ingestion pipeline run that loaded this record.
      - name: _src_sha256
        description: SHA-256 of the source file the record came from.
