version: 2

models:
  - name: stg_fed_fec_bulk_summary__people
    description: "GRAIN: one row per person (FEC_CAND_ID+CYCLE unique). SPINE_ENTITY: person."
    columns:
      - name: cand_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: cycle
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cand_id
              - cycle
