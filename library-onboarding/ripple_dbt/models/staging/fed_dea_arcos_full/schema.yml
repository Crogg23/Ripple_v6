version: 2

models:
  - name: stg_fed_dea_arcos_full__organizations
    description: "GRAIN: one row per organization (DEA_NO+TRANSACTION_DATE+TRANSACTION_CODE+DRUG_CODE+TRANSACTION_ID unique). SPINE_ENTITY: organization."
    columns:
      - name: reporter_dea_no
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: transaction_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: transaction_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: drug_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: transaction_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - reporter_dea_no
              - transaction_date
              - transaction_code
              - drug_code
              - transaction_id
