version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_EPA_ECHO
        description: >
          Raw landing table for EPA ECHO Exporter (Facility-level Enforcement & Compliance). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_epa_echo__facilities
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per facility (FRS_ID is unique). SPINE_ENTITY: facility."
    columns:
      - name: frs_id
        data_tests:
          - not_null:
              config:
                severity: warn
