version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: ST_CANNABIS_POLICY_BUNDLES
        description: >
          Raw landing table for US State Cannabis Policy Bundles Dataset. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_st_cannabis_policy_bundles__places
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per place (FIPS+YEAR unique). SPINE_ENTITY: place."
    columns:
      - name: fips
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: year
        data_tests:
          - not_null:
              config:
                severity: warn
