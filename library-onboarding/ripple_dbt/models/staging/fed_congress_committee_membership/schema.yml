version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CONGRESS_COMMITTEE_MEMBERSHIP
        description: >
          Raw landing table for Congress -- Committee Membership (who chairs/sits on what). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_congress_committee_membership__people
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per person (BIOGUIDE+COMMITTEE_CODE unique). SPINE_ENTITY: person."
    columns:
      - name: bioguide
        data_tests:
          - not_null
          # hand-written, restored 2026-09-19 after a --force regen dropped it
          - key_is_real:
              arguments:
                min_distinct: 100
                max_blank_fraction: 0.1
      - name: committee_code
        data_tests:
          - not_null:
              config:
                severity: warn
