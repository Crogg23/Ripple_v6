version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CMS_MEDICARE_PROVIDER
        description: >
          Raw landing table for Medicare Physician & Other Practitioners - by Provider. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_cms_medicare_provider__providers
    description: "GRAIN: one row per provider (NPI is unique). SPINE_ENTITY: provider."
    columns:
      - name: npi
        data_tests:
          - unique
          - not_null
          - key_is_real:
              arguments:
                min_distinct: 500000
                max_blank_fraction: 0.1
