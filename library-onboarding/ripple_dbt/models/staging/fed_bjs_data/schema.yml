version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_BJS_DATA
        description: >
          Raw landing table holding NCVS (National Crime Victimization Survey)
          person-level victimization microdata from the Bureau of Justice
          Statistics (source_id: fed_bjs_data). One row per reported
          victimization record; all columns land as TEXT.

models:
  - name: stg_fed_bjs_data__bjs_data_collections
    description: >
      Staging model for BJS NCVS victimization microdata. One row per
      person-level victimization record. Renames columns to descriptive
      snake_case, nulls empty strings, and safely casts year and survey
      weights to numeric. NOT unique on person_id — a respondent can report
      multiple victimizations, and weighted records can repeat.
    columns:
      - name: person_id
        description: NCVS person identifier (IDPER). Not unique — one row per victimization record.
        data_tests:
          - not_null

      - name: year_quarter
        description: Survey year and quarter as reported (e.g. '1993.1').
        data_tests:
          - not_null

      - name: survey_year
        description: Survey year, cast to numeric.
        data_tests:
          - not_null

      - name: age_group_code
        description: Respondent age group code (NCVS coded value; negatives are sentinels).

      - name: sex_code
        description: Respondent sex code.

      - name: hispanic_code
        description: Respondent Hispanic-origin code.

      - name: race_code
        description: Respondent race code.

      - name: race_ethnicity_code
        description: Combined race/ethnicity code.

      - name: household_income_code_1
        description: Household income bracket code (variant 1).

      - name: household_income_code_2
        description: Household income bracket code (variant 2).

      - name: marital_status_code
        description: Respondent marital status code.

      - name: education_code_1
        description: Respondent education level code (variant 1).

      - name: education_code_2
        description: Respondent education level code (variant 2).

      - name: veteran_code
        description: Veteran status code.

      - name: citizen_code
        description: Citizenship status code.

      - name: population_size_code
        description: Population size class of the respondent's area.

      - name: region_code
        description: Census region code.

      - name: msa_code
        description: Metropolitan statistical area status code.

      - name: locality_code
        description: Urban/suburban/rural locality code.

      - name: crime_type_code
        description: Type-of-crime code for the victimization (NEWCRIME).

      - name: offense_code
        description: Offense category code (NEWOFF).

      - name: serious_violent_code
        description: Serious-violent-crime classification code.

      - name: police_notified_code
        description: Whether the incident was reported to police (coded).

      - name: victim_services_code
        description: Whether victim services were used (coded).

      - name: location_code
        description: Incident location code.

      - name: victim_offender_relationship_code
        description: Victim-offender relationship code (DIREL).

      - name: weapon_code
        description: Weapon presence code.

      - name: weapon_category_code
        description: Weapon category code.

      - name: injury_code
        description: Injury indicator code.

      - name: serious_injury_code
        description: Serious-injury classification code.

      - name: medical_treatment_code
        description: Medical treatment received code.

      - name: offender_age_code
        description: Offender age group code.

      - name: offender_sex_code
        description: Offender sex code.

      - name: offender_race_code
        description: Offender race code (OFFTRACENEW).

      - name: victimization_weight
        description: Victimization survey weight (WGTVICCY), cast to numeric.

      - name: series_flag
        description: Series-victimization flag.

      - name: adjusted_weight
        description: Adjusted survey weight (NEWWGT), cast to numeric.

      - name: _ingested_at
        description: Timestamp when the record was ingested into the landing table.

      - name: _source_run_id
        description: Pipeline run identifier associated with the ingestion.

  - name: criminal_justice__fed_bjs_data
    description: >
      Analytics-ready mart of NCVS victimization microdata. One row per
      person-level victimization record, passed through from staging.
    columns:
      - name: person_id
        description: NCVS person identifier. Not unique.
        data_tests:
          - not_null

      - name: survey_year
        description: Survey year, numeric.

      - name: victimization_weight
        description: Victimization survey weight.

      - name: _ingested_at
        description: Timestamp when the record was ingested into the landing table.

      - name: _source_run_id
        description: Pipeline run identifier associated with the ingestion.
