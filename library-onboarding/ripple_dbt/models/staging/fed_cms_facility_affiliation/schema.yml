version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CMS_FACILITY_AFFILIATION
        description: >
          Raw landing table for CMS Doctors & Clinicians — Facility Affiliation (NPI↔CCN crosswalk). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_cms_facility_affiliation__providers
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per facility-provider relationship (CCN+NPI is unique). SPINE_ENTITY: provider."
    columns:
      - name: ccn
        data_tests:
          - not_null
          # hand-written, restored 2026-09-19 after a --force regen dropped it
          - key_is_real:
              arguments:
                min_distinct: 20000
                max_blank_fraction: 0.1
      - name: npi
        data_tests:
          - not_null
          # hand-written, restored 2026-09-19 after a --force regen dropped it
          - key_is_real:
              arguments:
                min_distinct: 500000
                max_blank_fraction: 0.1
