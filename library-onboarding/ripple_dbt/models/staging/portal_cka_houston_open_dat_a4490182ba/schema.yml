    columns:
      - name: zipcode
        data_tests:
          - not_null
      - name: sr_create_date
        data_tests:
          - not_null
      - name: due_date
        data_tests:
          - not_null
      - name: date_closed
        data_tests:
          - not_null
      - name: tax_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - zipcode
              - sr_create_date
              - due_date
              - date_closed
              - tax_id