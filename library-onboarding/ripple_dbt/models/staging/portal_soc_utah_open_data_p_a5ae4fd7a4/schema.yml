version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_SOC_UTAH_OPEN_DATA_P_A5AE4FD7A4
        description: >
          Raw landing table for Skilled Nursing Center Costs Utah 2019. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_soc_utah_open_data_p_a5ae4fd7a4__facilities
    description: "GRAIN: one row per facility (CCN+FISCAL_YEAR_BEGIN_DATE unique). SPINE_ENTITY: facility."
    columns:
      - name: provider_ccn
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: fiscal_year_begin_date
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - provider_ccn
              - fiscal_year_begin_date
