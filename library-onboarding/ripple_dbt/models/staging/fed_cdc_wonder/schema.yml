version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_CDC_WONDER

models:
  - name: stg_fed_cdc_wonder__records
    description: "CDC WONDER national mortality grid 1999-2020: deaths, population and crude rate per year x ICD chapter x sex (API is national-only by CDC policy)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, icd_chapter, sex]
    columns:
      - name: year
        data_tests: [not_null]
      - name: icd_chapter
        data_tests: [not_null]
      - name: sex
        data_tests: [not_null]
      - name: deaths
        description: "NULL where CDC suppressed the cell (counts under 10; 8 rows on the 2026-08-09 load)."
