version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_SOC_TEXAS_OPEN_DATA_DA657010B1
        description: >
          Raw landing table for Mixed Beverage Tax Permits. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_soc_texas_open_data_da657010b1__places
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per place (ZIP+RESP_BEGIN_DATE unique). SPINE_ENTITY: place."
    columns:
      - name: loc_zip
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: resp_begin_date
        data_tests:
          - not_null:
              config:
                severity: warn
