    columns:
      - name: pwsid
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: visit_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: first_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: last_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
