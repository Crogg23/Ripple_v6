version: 2

models:
  - name: stg_fed_epa_sdwa_sdwa_site_visits__facilities
    description: "GRAIN: one row per facility (PWSID+VISIT_DATE+FIRST_REPORTED_DATE+LAST_REPORTED_DATE unique). SPINE_ENTITY: facility."
    columns:
      - name: pwsid
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: visit_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: first_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: last_reported_date
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pwsid
              - visit_date
              - first_reported_date
              - last_reported_date
