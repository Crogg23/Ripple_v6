version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_OPEN_DATA_SA_2FCD3AEFD6
        description: >
          Raw landing table for PreliminaryPlat. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_cka_open_data_sa_2fcd3aefd6__places
    description: "GRAIN: one row per place (GEOM+CREATED_DATE unique). SPINE_ENTITY: place."
    columns:
      - name: shape__length
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: created_date
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shape__length
              - created_date
