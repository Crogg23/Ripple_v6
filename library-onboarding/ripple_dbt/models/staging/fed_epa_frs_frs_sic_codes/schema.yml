version: 2

models:
  - name: stg_fed_epa_frs_frs_sic_codes__facilities
    description: "GRAIN: one row per facility (FRS_ID+SIC+PGM_SYS_ID unique). SPINE_ENTITY: facility."
    columns:
      - name: registry_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: sic_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pgm_sys_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - registry_id
              - sic_code
              - pgm_sys_id
