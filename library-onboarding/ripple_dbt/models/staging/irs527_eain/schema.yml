version: 2

models:
  - name: stg_irs527_eain__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (FORM_ID_NUMBER+EAIN_ID unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: form_id_number
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: eain_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - form_id_number
              - eain_id
