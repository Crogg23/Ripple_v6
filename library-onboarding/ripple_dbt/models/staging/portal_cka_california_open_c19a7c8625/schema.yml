version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: PORTAL_CKA_CALIFORNIA_OPEN_C19A7C8625
        description: >
          Raw landing table for CA Urban Retail Water System Water Loss Annual Loss Audit Data. All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_portal_cka_california_open_c19a7c8625__facilities
    description: "GRAIN: one row per facility (PWSID+SUBMITTED_DATE unique). SPINE_ENTITY: facility."
    columns:
      - name: pws_id_or_other_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: submitted_date
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pws_id_or_other_id
              - submitted_date
