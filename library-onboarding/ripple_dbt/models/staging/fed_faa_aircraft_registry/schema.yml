version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FAA_AIRCRAFT_REGISTRY

models:
  - name: stg_fed_faa_aircraft_registry__all
    description: "FAA releasable aircraft master file: registered aircraft joined to owner names and addresses."
    columns:
      - name: n_number
        description: Aircraft registration number (trimmed), verified unique on the 2026-08-09 load.
        data_tests: [not_null, unique]
      - name: name
        description: "Registered owner name. NULL on ~4,700 sale-reported/expired registrations (status V etc.) that legitimately carry no owner."
