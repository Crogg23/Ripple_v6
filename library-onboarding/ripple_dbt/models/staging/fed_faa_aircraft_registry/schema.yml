version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_FAA_AIRCRAFT_REGISTRY

models:
  - name: stg_fed_faa_aircraft_registry__aircraft
    description: "FAA Civil Aircraft Registry: one row per registered aircraft (N-number unique, verified 2026-08-09). Supersedes the stale July fed_faa_registry twin."
    columns:
      - name: n_number
        data_tests: [not_null, unique]
      - name: unique_id
        data_tests: [not_null, unique]
      - name: registrant_name
        description: Blank on 4,676 aircraft as published (typically sale-reported / registration-pending records).
