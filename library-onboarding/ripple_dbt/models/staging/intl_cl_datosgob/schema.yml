version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: INTL_CL_DATOSGOB
        description: >
          Raw landing table for Chile National Open Data Portal (datos.gob.cl). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_intl_cl_datosgob__records
    description: "GRAIN: one row per record (spine_entity not determined -- no registry hint available) (DATASET_ID is unique). SPINE_ENTITY: (not determined)."
    columns:
      - name: dataset_id
        data_tests:
          - unique
          - not_null
