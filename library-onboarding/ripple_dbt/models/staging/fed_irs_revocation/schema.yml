version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_IRS_REVOCATION
        description: >
          Raw landing table for IRS Automatic Revocation of Exemption List (Auto-Revocation). All columns arrive as TEXT and
          are cast in the staging layer.

models:
  - name: stg_fed_irs_revocation__organizations
    description: "GRAIN NOT PROVEN: registry natural_key is not unique within a load; whole-row dedupe (exact copies only). GRAIN: one row per organization (EIN is unique). SPINE_ENTITY: organization."
    columns:
      - name: ein
        data_tests:
          - not_null
          # hand-written, restored 2026-09-19 after a --force regen dropped it
          - key_is_real:
              arguments:
                min_distinct: 500000
                max_blank_fraction: 0.1
