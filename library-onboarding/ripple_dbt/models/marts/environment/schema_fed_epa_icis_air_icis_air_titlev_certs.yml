version: 2

models:
  - name: environment__fed_epa_icis_air_icis_air_titlev_certs
    columns:
      - name: pgm_sys_id
        data_tests:
          - not_null
      - name: activity_id
        data_tests:
          - not_null
      - name: comp_monitor_type_code
        data_tests:
          - not_null
    data_tests:
      # Grain corrected 2026-08-11: the publisher issues multiple cert rows
      # per (permit, activity) differing in monitor type / end date / flags.
      # After the exact-dup dedupe the FULL projection is unique (verified
      # 499,113 = 499,113); (pgm_sys_id, activity_id) alone never was.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pgm_sys_id
              - activity_id
              - comp_monitor_type_code
              - comp_monitor_type_desc
              - state_epa_flag
              - actual_end_date
              - facility_rpt_deviation_flag
