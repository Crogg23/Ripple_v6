version: 2

models:
  - name: environment__fed_noaa_weather_api
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
      # blank string in source on all 287 rows; the guarded cast now reads it as NULL (2026-09-20)
      - name: station_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: fips_code
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: zip_code
        data_tests:
          - not_null:
              config:
                severity: warn
