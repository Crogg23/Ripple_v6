version: 2

models:
  - name: environment__fed_noaa_storm_events
    columns:
      # 3 rows blank in source; now reads as NULL (2026-09-20)
      - name: episode_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: event_id
        data_tests:
          - not_null
          - unique
      - name: state_fips
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: cz_fips
        data_tests:
          - not_null
      # only filled for tornadoes that cross a county line, blank on the other 1.78M rows by design
      - name: tor_other_cz_fips
        data_tests:
          - not_null:
              config:
                severity: warn
