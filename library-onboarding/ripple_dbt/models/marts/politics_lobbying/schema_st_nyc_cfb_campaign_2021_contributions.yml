version: 2

models:
  - name: politics__st_nyc_cfb_campaign_2021_contributions
    description: "NYC Campaign Finance Board: contribution-level campaign finance disclosure data for the 2021 NYC election cycle, 457,521 rows. One row = one reported contribution transaction (exactly unique natural key (RECIPID+COMMITTEE+FILING+REFNO)); contribution_record_id is the surrogate primary key."
    columns:
      - name: contribution_record_id
        data_tests: [not_null, unique]
