version: 2

models:
  - name: energy__fed_eia860_6_1_enviroassoc
    description: "EIA-860 2024 annual report, Schedule 6.1 (EnviroAssoc): bridge linking boilers to the generators they serve. One row per plant + boiler + generator + steam plant type."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plant_code
              - boiler_id
              - generator_id
              - steam_plant_type
    columns:
      - name: plant_code
        data_tests: [not_null]
