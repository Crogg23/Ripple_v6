version: 2

models:
  - name: energy__fed_eia860_3_1_generator
    description: "EIA-860 2024 annual report, Schedule 3.1 (Generator): every generator with technology, prime mover, capacities (nameplate/summer/winter MW), status, fuel sources, operating dates, and planned changes/retirements. One row per plant + generator."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plant_code
              - generator_id
    columns:
      - name: plant_code
        data_tests: [not_null]
      - name: generator_id
        data_tests: [not_null]
