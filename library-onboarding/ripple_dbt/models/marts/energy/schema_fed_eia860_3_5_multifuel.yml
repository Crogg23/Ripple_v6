version: 2

models:
  - name: energy__fed_eia860_3_5_multifuel
    description: "EIA-860 2024 annual report, Schedule 3.5 (Multifuel): fuel-switching capability of multi-fuel generators -- cofire sources, gas/oil switch times, and capacity under each fuel. One row per plant + generator."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - plant_code
              - generator_id
    columns:
      - name: plant_code
        data_tests: [not_null]
      - name: generator_id
        data_tests: [not_null]
