version: 2

# SAM exclusions is the LEFT side of debarred_but_funded.
#
# GRAIN CHANGE (2026-08-11 full re-pull, 167,928 rows): the old capped table
# (~9K rows) deduped on UEI and tested `unique` on it. The full publisher file
# proves that invariant was an artifact of the cap: one entity carries several
# exclusion records (47,684 non-null UEIs, only 38,425 distinct), and even
# UEI-or-name+date has 7,377 duplicate keys. The real record key is SAM_NUMBER.
# UEI stays nullable BY DESIGN — individual debarments have no UEI.
#
# KEY RE-PROOF (2026-09-20): "verified unique across all 167,928 landing rows"
# above was a ONE-TIME proof, never re-checked -- exactly the "proven once, not
# re-proven" failure mode f41ebff9 closed in 289 staging views (a key proven
# unique at generation time silently stops identifying a row after a reload,
# while a `unique` test on the ALREADY-DEDUPED output stays green forever). The
# model SQL now re-runs that proof LIVE, every build (key_proof CTE, mirrors
# scripts/generate_staging_models.py's key_is_unique_within_each_load()).
# Currently 168,328 rows (2026-08-11 pull re-verified 2026-09-20), 168,328
# distinct, 1 load, zero collision -- proven. `unique` below stays valid only as
# long as that live check keeps passing; if it ever shows would_collapse > 0,
# the model's own QUALIFY has already fallen back to a whole-row dedupe and this
# test should be dropped that day.
models:
  - name: procurement__fed_sam_exclusions
    description: >
      SAM.gov debarments and suspensions, full 2026-08-11 pull. One row per
      exclusion record (sam_number). UEI is nullable (individuals) and
      non-unique (repeat exclusions per entity).
    columns:
      - name: sam_number
        description: SAM exclusion record number — the record key.
        data_tests:
          - unique
          - not_null
      - name: uei
        description: >
          Unique Entity Identifier. Null for individual debarments; NOT unique
          in the full file (multiple exclusion records per entity).
      - name: is_currently_excluded
        description: >
          Whether the exclusion is still in force as of the model run.
          'Indefinite' termination text counts as still excluded.
        data_tests:
          - not_null
