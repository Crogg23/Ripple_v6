version: 2

# Sources used ONLY by the review marts (lead_queue).
#
# NOTE: every ripple_raw landing table this mart reads is declared by its own
# staging/<source>/schema.yml (or intermediate/usaspending/schema.yml) — do NOT
# redeclare them here, dbt hard-errors on duplicate source tables. That rule was
# violated for FED_SEC_EDGAR_FINANCIALS and FED_SAM_EXCLUSIONS, which broke
# `dbt parse` outright; both were removed 2026-07-29 and the empty ripple_raw
# block went with them. This file now declares only the guarded CONNECT view.

sources:
  - name: library_meta_connect
    description: >
      The connect layer's SAFE read surface. "CONNECT" is a reserved word in
      Snowflake — the quoting flag below is what renders
      LIBRARY_META."CONNECT".V_LEADS_PUBLISHED correctly. V_LEADS_PUBLISHED is
      the libel firewall: active leads only, human-suppressed verdicts
      (rejected/retracted/stale) already dropped, REVIEW_STATE stamped on every
      row so an unreviewed lead can never read as fact. The review mart reads
      THIS view, never raw LEADS — same rule the viz guard enforces.
    database: LIBRARY_META
    schema: CONNECT
    quoting:
      schema: true
    tables:
      - name: V_LEADS_PUBLISHED
