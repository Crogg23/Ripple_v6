version: 2

models:
  - name: lead_queue
    description: >
      The Reading Room triage mart: one row per reviewable lead (REVIEW_STATE
      pending or needs_work in LIBRARY_META."CONNECT".V_LEADS_PUBLISHED — this
      model never reads raw LEADS). Rebuilt via
      `dbt build --select marts.review` — NEVER a selector-less build (POLICY
      no_selectorless_dbt_build). Zero AI anywhere: headlines are fixed SQL
      templates (draft v1 pending Checkpoint-1 approval), receipt logic is a
      SQL port of scripts/lead_receipt.py (the spec — parity proven by
      tests/test_lead_queue_receipt_parity.py), and priority is the
      deterministic formula below.

      PRIORITY FORMULA (weights draft v1, Checkpoint-1 approval pending):
        priority_score =
            tier weight      (FACT_GRADE_3_SOURCE 3.0 | TWO_SOURCE 2.0 |
                              HARD_ID_ONLY 1.5 | NPPES_CONFLICT 0.75 |
                              LEIE_ROW_MISSING 0.5)
          + receipt weight   (PAID_ON_OR_AFTER_EXCLUSION 2.0 |
                              NOT_EVALUATED 0.75 | TIMELINE_UNKNOWN 0.75 |
                              PAYMENTS_PREDATE_EXCLUSION 0.5)
          + detector weight  (banned_but_operating 1.5 | excluded_but_billing
                              1.25 | banned_but_paid 1.0 | debarred_but_funded
                              1.0 | sanctioned_vessel_broadcasting_v2 0.75 |
                              sec_filer_in_irs_bmf 0.5 |
                              sanctioned_vessel_broadcasting 0.25 [superseded,
                              retired to STATUS='stale' by
                              scripts/provision_pattern_desk.sql])
          + detector-score band:
              osha_cohort_outlier_2024:
                LEAST(LN(1 + fold) / LN(65), 1.0) * 2.0 where fold is the
                detector score (fold-vs-cohort), demoted to a 2.0 floor when
                the establishment's DART rate exceeds 50 (physically
                implausible, audit F7). Replaces the old LEAST(score,1)*0.5
                band that saturated for every OSHA lead and left 94% of the
                queue tied at 3.25 (audit F2, 2026-08-01).
              all other detectors: LEAST(detector score, 1.0) * 0.5
                (uncalibrated ranking signal, tiebreak band only)
        priority_rank = ROW_NUMBER() OVER (ORDER BY priority_score DESC,
        lead_id) — the lead_id tiebreak guarantees a total order.

      Activity numbers (counts, dollars, dates) are RECOMPUTED from the same
      source tables the detectors read, never trusted from the 50-item-capped
      EVIDENCE array. Known per-detector data traps travel in the caveat
      column. banned_but_operating's source table (FED_CMS_FACILITY_AFFILIATION)
      was restored to LANDING 2026-07-25 after being briefly dropped; this
      mart still reads its frozen EVIDENCE snapshot rather than recomputing
      live (see the caveat column). An 8th detector, osha_cohort_outlier_2024,
      is a peer-cohort statistical outlier (not a hard-ID ban-list join like
      the other seven) — see connect/cohort_leads.py.
    columns:
      - name: lead_id
        description: PK, from V_LEADS_PUBLISHED (LEAD_ + md5 of rule|key).
        data_tests: [unique, not_null]
      - name: detector
        description: The detector (RULE_NAME) that produced the lead.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - banned_but_paid
                  - excluded_but_billing
                  - banned_but_operating
                  - debarred_but_funded
                  - sanctioned_vessel_broadcasting
                  - sanctioned_vessel_broadcasting_v2
                  - sec_filer_in_irs_bmf
                  - osha_cohort_outlier_2024
      - name: priority_rank
        description: Total order over the queue; unique proves totality.
        data_tests: [unique, not_null]
      - name: priority_score
        description: Deterministic score per the formula in the model description.
        data_tests: [not_null]
      - name: headline
        description: >
          Fixed per-detector SQL template, fully COALESCE-guarded. The guard
          tests forbid the NULL-poisoning tells ('NULL', 'None', '||') from
          ever reaching an analyst.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "NOT LIKE '%NULL%'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "NOT LIKE '%None%'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "NOT LIKE '%||%'"
      - name: confidence_tier
        description: >
          The 3-source corroboration verdict (port of lead_receipt.py):
          FACT_GRADE_3_SOURCE = NPPES registry surname agrees with LEIE;
          TWO_SOURCE = NPPES blank/deactivated (no third confirmation);
          NPPES_CONFLICT = registry shows a DIFFERENT surname (verify before
          use); LEIE_ROW_MISSING = the exclusion row vanished since detection
          (monthly OIG refresh removes reinstated providers) — no comparison
          possible, never labeled a conflict; HARD_ID_ONLY = non-NPI
          detectors (the hard key is the identity; no third registry exists
          to corroborate).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [FACT_GRADE_3_SOURCE, TWO_SOURCE, NPPES_CONFLICT, LEIE_ROW_MISSING, HARD_ID_ONLY]
      - name: receipt_verdict
        description: >
          The timeline verdict (port of lead_receipt.py): evaluated only for
          banned_but_paid, whose activity side carries real payment dates.
          TIMELINE_UNKNOWN is the honest state for a missing date (the Python
          spec lumps it into the weaker verdict; the parity test maps both).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [PAID_ON_OR_AFTER_EXCLUSION, PAYMENTS_PREDATE_EXCLUSION, TIMELINE_UNKNOWN, NOT_EVALUATED]
      - name: entity_a_key_type
        description: The hard ID type (NPI/UEI/IMO/EIN) — the join IS the identity.
        data_tests: [not_null]
      - name: entity_a_key_value
        description: The hard ID value.
        data_tests: [not_null]
      - name: evidence_sql
        description: >
          COMPILED_SQL from the LEADS table — the exact frozen query that
          produced this lead (the receipt). Smoke-tested by
          tests/test_lead_queue_evidence_smoke.py; banned_but_operating's is
          known-irreproducible (source table dropped, see caveat).
        data_tests: [not_null]
      - name: review_state
        description: pending or needs_work at build time (decided leads are excluded).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pending, needs_work]
      - name: first_name_conflict
        description: >
          Audit F4 (2026-08-01). TRUE when LEIE and NPPES both carry a first
          name for this NPI and they differ down to the first letter — the
          confidence tier corroborates on surname only, so this flags likely
          alternate/anglicized names (or wrong-person matches) that FACT_GRADE
          would otherwise oversell. Surfaced as a case-file warning plus an
          appended caveat sentence; the tier vocabulary itself is unchanged.
        data_tests: [not_null]

  - name: cohort_queue
    description: >
      The Pattern Desk triage mart: one row per peer cohort (NAICS-4 x
      employer size band) holding at least one reviewable
      osha_cohort_outlier_2024 lead. The Pattern Desk reviews the COHORT —
      the systemic pattern — and member leads are its receipts; a cohort
      verdict (TARGET_KIND='cohort', TARGET_ID=cohort_id in
      LIBRARY_META.REVIEW.DECISIONS) covers member leads with no individual
      decision via LIBRARY_META.REVIEW.V_EFFECTIVE_LEAD_DECISIONS
      (specific-beats-general: a lead-level decision always wins). Zero AI
      anywhere; headlines are fixed SQL templates; receipts_sample carries the
      5 worst PLAUSIBLE members by fold (DART rates above 50 are excluded as
      filing errors — audit F7 — but stay counted in n_implausible).

      COHORT PRIORITY FORMULA (weights draft v1, Checkpoint-1 approval
      pending):
        priority_score =
            LEAST(LN(1 + worst_fold_plausible) / LN(65), 1.0) * 3.0  [severity]
          + LEAST(LN(1 + n_outliers) / LN(101), 1.0) * 1.5           [breadth]
          + IFF(n_deaths_total > 0, 1.0, 0.0)                        [fatality]
          + LEAST(n_outliers / cohort_n, 0.25) * 2.0                 [density]
        priority_rank = ROW_NUMBER() OVER (ORDER BY priority_score DESC,
        cohort_id).
    columns:
      - name: cohort_id
        description: naics || '|' || size_band — the detector's natural cohort key.
        data_tests: [unique, not_null]
      - name: priority_rank
        data_tests: [unique, not_null]
      - name: headline
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "NOT LIKE '%NULL%'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "NOT LIKE '%None%'"
      - name: n_outliers
        data_tests: [not_null]
      - name: caveat
        description: Self-reported-inputs caveat + conditional implausible-rate and EIN-drift sentences. Never null for this detector.
        data_tests: [not_null]

  - name: case_queue
    description: >
      The Case Desk grouping view: one row per flagged person/entity (unit)
      across the hard-ID detectors (OSHA and the retired v1 vessel detector
      excluded). Groups the audit's 179 cross-detector duplicates so a person
      is reviewed once with every claim in one case file. Decisions stay
      per-lead — this view only groups; lead_ids carries the member leads in
      priority order.
    columns:
      - name: unit_id
        description: entity_a_key_type || '|' || entity_a_key_value.
        data_tests: [unique, not_null]
      - name: unit_rank
        data_tests: [unique, not_null]
      - name: n_leads
        data_tests: [not_null]