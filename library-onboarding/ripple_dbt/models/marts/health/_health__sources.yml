version: 2

sources:
  - name: ripple_raw
    database: LIBRARY_RAW
    schema: LANDING
    tables:
      - name: FED_HRSA_NPDB
        description: >
          National Practitioner Data Bank Public Use Data File — adverse action
          reports (licensure/clinical privileges/society membership/DEA/exclusion)
          and medical malpractice payment reports on physicians, dentists, and
          other licensed practitioners. SEQNO is the report-level key (verified
          unique). No individual practitioner name/identity in the public file
          (de-identified by design) -- practitioner-level joins are not possible
          from this table alone.
      - name: FED_DEA_ARCOS_FULL
        description: >
          DEA ARCOS — every controlled substance transaction from manufacturer/distributor
          to pharmacy/hospital. 178M records. The supply-side map of the opioid crisis.
      - name: FED_FDA_FAERS_DRUG
      - name: FED_FDA_FAERS_REAC
      - name: FED_FDA_FAERS_INDI
      - name: FED_FDA_FAERS_DEMO
      - name: FED_FDA_FAERS_OUTC
      - name: FED_CMS_MEDICARE_PHYSICIAN_OTHER_PRACTITIONERS_BY_PROVIDER
      - name: FED_CMS_MEDICARE_PHYSICIAN_OTHER_PRACTITIONERS_BY_PROVIDER_AND_SERVI
      - name: FED_CMS_MEDICARE_DIALYSIS_FACILITIES
      - name: FED_CMS_FACILITY_LEVEL_MINIMUM_DATA_SET_FREQUENCY
      - name: FED_CMS_FISCAL_INTERMEDIARY_SHARED_SYSTEM_ATTENDING_AND_RENDERING
      - name: FED_CMS_ORDER_AND_REFERRING
      - name: FED_CDC_NNDSS_WEEKLY_2024
      - name: FED_CMS_QUALITY_PAYMENT_PROGRAM_EXPERIENCE
      - name: FED_CMS_MEDICARE_DURABLE_MEDICAL_EQUIPMENT_DEVICES_SUPPLIES_BY_SUPPL
      - name: FED_CMS_NURSING_HOME_DEFICIENCIES
      - name: FED_CMS_MEDICARE_DURABLE_MEDICAL_EQUIPMENT_DEVICES_SUPPLIES_BY_REFER
      - name: FED_CMS_NURSING_HOME_FIRE_DEFICIENCIES
      - name: FED_CMS_MEDICARE_INPATIENT_HOSPITALS_BY_PROVIDER_AND_SERVICE
      - name: FED_CMS_MEDICARE_OUTPATIENT_HOSPITALS_BY_PROVIDER_AND_SERVICE
      - name: FED_CMS_OPT_OUT_AFFIDAVITS
      - name: FED_CMS_NURSING_HOME_PENALTIES
      - name: FED_CMS_SKILLED_NURSING_FACILITY_ENROLLMENTS
      - name: FED_CMS_HOME_HEALTH_AGENCY_ENROLLMENTS
      - name: FED_HRSA_PROVIDER_RELIEF_FUND
        description: >
          HHS Provider Relief Fund public payment file (CDC portal kh8y-3es6, the file
          hrsa.gov/provider-relief/payments-and-data points at). Four columns: provider
          name, state, city, payment as a '$1,234' string. 419,846 rows, $135.06B, file
          dated 2025-03-28, landed 2026-09-07 by scripts/hrsa_prf_load.py. No EIN, NPI
          or CCN; name + city + state is the only bridge. Audit columns are _INGESTED_AT,
          _SOURCE_RUN_ID, _SRC_SHA256.
      - name: FED_CMS_HOME_HEALTH_OWNERS
        description: >
          CMS Home Health Agency All Owners (data.cms.gov fc009b2d-7846-44b1-b4a1-692f0c143879),
          quarterly. One row per (enrollment, owner, role); 101,188 rows landed 2026-09-07 by
          scripts/cms_hha_owners_load.py. Audit column is INGESTED_AT, no underscore.
      - name: FED_CMS_FEDERALLY_QUALIFIED_HEALTH_CENTER_ENROLLMENTS
      - name: FED_CMS_HOSPITAL_ENROLLMENTS
      - name: FED_CMS_PENDING_INITIAL_LOGGING_AND_TRACKING_PHYSICIANS
      - name: FED_CMS_PENDING_INITIAL_LOGGING_AND_TRACKING_NON_PHYSICIANS
