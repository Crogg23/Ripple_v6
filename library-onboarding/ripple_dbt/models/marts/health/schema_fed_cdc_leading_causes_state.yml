version: 2

models:
  - name: health__fed_cdc_leading_causes_state
    description: "NCHS leading causes of death by state and year (1999-2017): deaths and age-adjusted death rates, with a 'United States' rollup row per year x cause."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, state, cause_name]
    columns:
      - name: year
        data_tests:
          - not_null
      - name: state
        data_tests:
          - not_null
      - name: cause_name
        data_tests:
          - not_null
      - name: deaths
        data_tests:
          - not_null
