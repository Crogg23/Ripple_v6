version: 2

models:
  - name: health__fed_cms_medicare_physician_other_practitioners_by_provider_and_servi
    description: >
      Medicare Part B, one row per rendering provider x HCPCS code x place of
      service. CMS deletes (not nulls) any row where a service was furnished to
      under 11 beneficiaries before the file is published. Live-confirmed
      2026-09-20: min(tot_benes) = 11, zero rows below it, zero nulls, across
      all 9,781,673 rows. Every total, sum or ranking built off this table is a
      floor, never a complete count -- one sampled real provider showed 90.2%
      of their own billing missing at this grain versus their row in
      health__fed_cms_medicare_physician_other_practitioners_by_provider.
      Use that provider-level mart for a true total; use this one for
      service-mix detail only.
    columns:
      - name: tot_benes
        description: >
          Never below 11: CMS deletes the row instead of publishing a smaller
          count. A null or a value under 11 here would mean something broke
          upstream, not that the service was rare.
      - name: rndrng_npi
        data_tests:
          - not_null
      - name: rndrng_prvdr_state_fips
        description: >
          5 of 9,781,673 rows are NULL (found after reloading the full table
          2026-08-06, was truncated at 500,000 before). Trivial rate, likely
          foreign/territory provider addresses with no FIPS mapping.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: est_mdcr_pymt_amt
        description: This row's Medicare payment, average payment times services. Added 2026-09-21.
      - name: provider_tot_mdcr_pymt_amt
        description: >-
          The provider's true Medicare payment total, from the one-row-per-NPI mart. It includes the
          services CMS deleted from this table for having under 11 patients.
        data_tests:
          - not_null
      - name: service_rows_cover_pct
        description: >-
          THE LOCK. Share of the provider's true total that this table's surviving rows add up to, 0 to 100.
          Measured 2026-09-21: the table holds $97.3B of $120.1B, 81 percent; 159,439 providers sit under
          50 percent. Filter or report this column before summing anything here. Null on 8 rows where the
          provider total is zero.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100.5
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - rndrng_npi
              - hcpcs_cd
              - place_of_srvc
