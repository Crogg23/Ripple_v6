version: 2

models:
  - name: health__fed_nursinghome411
    columns:
      # blank for homes that belong to no chain (4,551 rows, live 2026-09-20); now reads as NULL
      - name: chain_id
        data_tests:
          # 4,551 of 14,713 null in source, measured 2026-09-21. Threshold, not a warn: fails above 6,836.
          - not_null:
              config:
                warn_if: ">5466"
                error_if: ">6836"
      - name: cms_region_number
        data_tests:
          - not_null
      - name: cms_certification_number_ccn
        data_tests:
          - unique
          - not_null
