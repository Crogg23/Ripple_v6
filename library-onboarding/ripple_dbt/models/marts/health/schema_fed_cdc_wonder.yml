version: 2

models:
  - name: health__fed_cdc_wonder
    description: "CDC WONDER national mortality baselines: deaths, population and crude rate by year x ICD chapter x sex. Deaths NULL where CDC suppresses counts under 10."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, icd_chapter, sex]
    columns:
      - name: year
        data_tests:
          - not_null
      - name: icd_chapter
        data_tests:
          - not_null
      - name: sex
        data_tests:
          - not_null
