version: 2

models:
  - name: health__fed_cms_hospice
    columns:
      - name: ccn
        data_tests:
          - unique
      - name: zip_code
        data_tests:
          - not_null
      # 75 rows blank in source; now reads as NULL (2026-09-20)
      - name: telephone_number
        data_tests:
          # 75 of 6,852 null in source, measured 2026-09-21. Threshold, not a warn: fails above 122.
          - not_null:
              config:
                warn_if: ">95"
                error_if: ">122"
