version: 2

models:
  - name: health__fed_cms_partd_prescribers
    description: >
      CMS Part D Prescriber Drug, one row per NPI x generic name x brand name.
      Vintage is DY2022; the landing table carries no year/DY column (checked
      live 2026-09-20), so this is documented, not derived from the data.
      NPPES, Part B, and the unsuffixed QPP and Open Payments marts are 2024
      vintage -- health__fed_cms_part_d_prescribers (by-provider) is also 2024.
      Any join from this mart to those needs the ~2-year gap accounted for
      by hand.
    columns:
      - name: data_year
        description: The Medicare data year this whole file covers, DY2022. One value by design. Check it before joining Part D files to each other or to 2024-vintage tables.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2022]
                quote: false
      - name: npi
        data_tests:
          - not_null
      - name: prescriber_state_fips
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - npi
              - generic_name
              - brand_name
