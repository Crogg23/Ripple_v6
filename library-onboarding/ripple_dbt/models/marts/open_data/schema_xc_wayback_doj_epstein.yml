version: 2

models:
  - name: open_data__xc_wayback_doj_epstein
    description: >
      GRAIN: one row per Wayback Machine capture (urlkey + capture_timestamp
      _raw), per the model's own header comment.
    columns:
      - name: status_code
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - urlkey
              - capture_timestamp_raw
