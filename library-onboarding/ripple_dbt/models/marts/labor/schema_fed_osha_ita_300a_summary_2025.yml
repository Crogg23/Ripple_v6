version: 2

models:
  - name: labor__fed_osha_ita_300a_summary_2025
    description: >
      GRAIN: one row per establishment for this filing-year file (matches the
      sibling 2023/2024 OSHA ITA 300A mart tests -- each year's file is a
      separate table, so establishment_id is unique within it, not just id).
    columns:
      - name: id
        data_tests:
          # not_null downgraded to warn 2026-08-22: exactly 3 of 383,280 rows
          # arrive from OSHA with a blank submission id (real establishments —
          # Grand Prairie x2, Norwalk). Source noise, not a load defect;
          # dropping the rows to satisfy the test would delete real filings.
          - not_null:
              config:
                severity: warn
          - unique
      - name: establishment_id
        data_tests:
          - not_null
