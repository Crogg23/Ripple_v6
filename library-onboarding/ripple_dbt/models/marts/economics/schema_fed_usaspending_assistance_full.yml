version: 2

models:
  - name: economics__fed_usaspending_assistance_full
    description: "USASpending Federal Assistance Awards, one row per award transaction, FY2007 to FY2026, 128,155,142 rows. UNCAPPED since 2026-09-21: this model unions the twenty per-fiscal-year landing tables, every fiscal year runs Oct 1 to Sep 30 and ASSISTANCE_TRANSACTION_UNIQUE_KEY is unique across all rows. Before that it read FED_USASPENDING_ASSISTANCE_FULL, which the download cut at exactly 1,000,000 rows per fiscal year; totals from before that date were floors. Missing values arrive as real NULLs. FY2026 holds action dates through 2026-09-30 as published by the source."
