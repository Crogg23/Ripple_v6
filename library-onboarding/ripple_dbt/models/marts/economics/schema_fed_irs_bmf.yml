version: 2

models:
  - name: economics__fed_irs_bmf
    columns:
      - name: subsection_code
        data_tests:
          - not_null
      - name: classification_code
        data_tests:
          - not_null
      - name: affiliation_code
        data_tests:
          - not_null
      - name: deductibility_code
        data_tests:
          - not_null
      - name: foundation_code
        data_tests:
          - not_null
      - name: activity_code
        data_tests:
          - not_null
      - name: ntee_code
        data_tests:
          # 581,028 organisations carry no NTEE code in the IRS file; blank in source, NULL since staging typing.
          # A threshold, not a warn: it still fails if the blank share jumps.
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null"
              config:
                where: "1=1"
                error_if: ">650000"
                warn_if: ">600000"
      - name: group_exemption_number
        data_tests:
          - not_null
      - name: spine_entity_id
        data_tests:
          - not_null
          - unique
