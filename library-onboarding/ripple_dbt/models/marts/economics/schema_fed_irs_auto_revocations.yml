version: 2

models:
  - name: economics__fed_irs_auto_revocations
    columns:
      - name: zip_code
        # 2026-08-25: verified live -- only 4 of 1,207,295 rows are null, all
        # foreign-address orgs (Liechtenstein, Kenya, Australia, UK) filed with
        # country='US' but a foreign place name sitting in the city field and no
        # US postal code at all. Raw source itself has NULL here (straight
        # passthrough, no join/transform involved) -- these entities legitimately
        # have no US ZIP. Downgraded to warn rather than filtered out: they are
        # real IRS auto-revocation records and dropping them would lose data.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: ein
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ein
              - revocation_date
