version: 2

models:
  - name: immigration__fed_ice_detention_stints
    description: "ICE detention stints 2004-2026, person-level with anonymized hash IDs: facility, demographics, criminal-history flags, bond and release outcome. Publisher-flagged duplicate rows excluded; softer duplicate flags carried through."
    columns:
      - name: person_hash
        description: NULL on ~7k rows as published.
      - name: detention_facility
        data_tests: [not_null]
      - name: book_in_at
        data_tests: [not_null]
  - name: immigration__fed_ice_detainers
    description: "ICE detainers Oct 2022-2026, person-level with anonymized hash IDs: requests to local jails/prisons to hold a person for ICE, with criminal-history flags and lift/removal outcome."
    columns:
      - name: person_hash
        description: NULL on ~75k rows as published.
      - name: detainer_prepare_date
        data_tests: [not_null]
