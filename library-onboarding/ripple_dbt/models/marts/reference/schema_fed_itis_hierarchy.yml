version: 2

models:
  - name: reference__fed_itis_hierarchy
    description: "ITIS (Integrated Taxonomic Information System, USDA/USGS taxonomy) reference data — Materialized taxonomic tree: one row per TSN with its full hierarchy string, parent TSN, tree level and child count (valid/accepted taxa only). Grain: one row per tsn (678,363 rows)."
    columns:
      - name: tsn
        data_tests: [not_null, unique]
