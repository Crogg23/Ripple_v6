version: 2

models:
  - name: justice__fed_uscourts_stats
    columns:
      - name: table_number
        data_tests:
          - not_null
      - name: fips_code
        data_tests:
          - not_null
      - name: chapter_code
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - table_number
              - reporting_period
              - circuit
              - district
              - fips_code
              - chapter_code
              - case_type
