version: 2

models:
  - name: justice__intl_eu_sanctions
    columns:
      - name: entity_logical_id
        data_tests:
          - not_null
      # blank string in source for entries with no such sub-record (addr_number: all 42,347 rows,
      # live 2026-09-20); the guarded read now shows it as NULL instead of a blank that looked filled.
      - name: naal_logical_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: addr_logical_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: addr_number
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: birt_logical_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: iden_logical_id
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: iden_number
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: citi_logical_id
        data_tests:
          - not_null:
              config:
                severity: warn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - entity_logical_id
              - naal_logical_id
              - addr_logical_id
              - addr_number
              - birt_logical_id
              - iden_logical_id
              - iden_number
              - citi_logical_id
              - programme
              - leba_numtitle
              - eu_ref_num
              - date_file
