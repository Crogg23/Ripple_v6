version: 2

models:
  - name: justice__xc_mapping_police_violence
    columns:
      - name: mpv_id
        data_tests:
          - not_null
          # unique downgraded to warn 2026-08-25: 3 of 15,476 mpv_id values
          # (15554, 15684, 15685) are each shared by two genuinely distinct
          # victims -- different names/ages/races/cities/dates (e.g. 15684 =
          # both Daniel Bolinger, Crestview Hills KY, and Michael Bradley
          # Davis, Red Oak TX). Source ID max (15773) exceeds row count
          # (15476), so MPV's own numbering has gaps and a handful of
          # collisions -- not a load defect. These are real, separate deaths;
          # collapsing or dropping either row to satisfy uniqueness would
          # erase a real recorded killing. Not a dedup case, not a wrong test
          # grain -- a known imperfection in the source's own ID field.
          - unique:
              config:
                severity: warn
