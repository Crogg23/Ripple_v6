version: 2

models:
  - name: consumer_safety__fed_nhtsa_investigations
    columns:
      - name: nhtsa_action_number
        data_tests:
          - not_null
      - name: recall_number
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - nhtsa_action_number
              - make
              - model
              - model_year
              - component
              - mfr_name
              - recall_number
