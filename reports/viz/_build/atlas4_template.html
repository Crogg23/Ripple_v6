<title>Ripple Warehouse Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Spline+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground:#eceff1; --card:#fbfcfd; --card-edge:#d5dde2;
    --ink:#24313a; --ink-soft:#5c6b76; --accent:#1c7a5a; --accent-soft:#e2f0ea;
    --row-line:#e5eaee; --fuzzy:#8a97a1; --geo:#a4762a; --frontier:#7a6ba4;
    --r0:#0f8a62; --r1:#2e6fca; --r2:#a07b1e; --r3:#c4356e;
    --r4:#4a9a2e; --r5:#7a4fd0; --r6:#1e94a8; --r7:#8a94a0;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --sans:"Spline Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#12171c; --card:#1f272e; --card-edge:#35414a;
      --ink:#dbe4ea; --ink-soft:#8b9aa5; --accent:#4fbf94; --accent-soft:#223730;
      --row-line:#2b353d; --fuzzy:#5c6b76; --geo:#c8a256; --frontier:#9b8cc9;
      --r0:#3ce6a8; --r1:#6aa8ff; --r2:#e8c05a; --r3:#ff6aa8;
      --r4:#8ae05a; --r5:#b48aff; --r6:#5ad8e8; --r7:#b6c4ce;
    }
  }
  :root[data-theme="dark"] {
    --ground:#12171c; --card:#1f272e; --card-edge:#35414a;
    --ink:#dbe4ea; --ink-soft:#8b9aa5; --accent:#4fbf94; --accent-soft:#223730;
    --row-line:#2b353d; --fuzzy:#5c6b76; --geo:#c8a256; --frontier:#9b8cc9;
    --r0:#3ce6a8; --r1:#6aa8ff; --r2:#e8c05a; --r3:#ff6aa8;
    --r4:#8ae05a; --r5:#b48aff; --r6:#5ad8e8; --r7:#b6c4ce;
  }
  body { margin:0; background:var(--ground); font-family:var(--sans); color:var(--ink);
    overflow:hidden; height:100vh; }
  #cosmo { position:fixed; inset:0; }
  #cosmo canvas { display:block; }
  body.walking #cosmo { display:none; }
  #world { position:absolute; transform-origin:0 0; display:none; cursor:grab; }
  body.walking #world { display:block; }
  body.walking.panning { cursor:grabbing; }
  svg.wires { position:absolute; inset:0; pointer-events:none; }
  .edge { fill:none; stroke-width:1.6; transition:opacity .15s; }
  .edge.steel { stroke:var(--accent); opacity:.7; }
  .edge.fuzzy { stroke:var(--fuzzy); opacity:.32; }
  .edge.geo { stroke:var(--geo); opacity:.45; }
  .edge.xwire { stroke-width:1.1; opacity:.14; stroke-dasharray:5 4; }
  svg.wires.focused .edge { opacity:.05; }
  svg.wires.focused .edge.lit { opacity:.9; stroke-width:2; }
  [hidden] { display:none !important; }

  /* labels floated over the canvas */
  .clabel { position:fixed; transform:translate(-50%,-130%); pointer-events:none;
    font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--ink);
    text-shadow:0 0 6px var(--ground), 0 0 12px var(--ground); white-space:nowrap; z-index:3; }
  .clabel.region { font-family:var(--sans); font-weight:700; font-size:12px;
    letter-spacing:.22em; text-transform:uppercase; opacity:.85; }
  #tip { position:fixed; pointer-events:none; z-index:7; background:var(--card);
    border:1px solid var(--card-edge); border-radius:5px; padding:7px 11px;
    font-family:var(--mono); font-size:11px; display:none; max-width:340px; }
  #tip .tt { font-weight:600; }
  #tip .td { color:var(--ink-soft); font-size:10px; margin-top:3px;
    font-family:var(--sans); }

  /* ---- walk mode cards (DOM, unchanged language) ---- */
  .fcard { position:absolute; box-sizing:border-box; background:var(--card); width:380px;
    border:1px solid var(--card-edge); border-radius:6px; overflow:hidden;
    box-shadow:0 4px 14px rgba(10,20,26,.08); }
  .fcard.steel { border-top:2px solid var(--accent); }
  .fcard.fuzzy { border-top:2px solid var(--fuzzy); }
  .fcard.geo { border-top:2px solid var(--geo); }
  .fcard.anchor { width:560px; border-top:none; box-shadow:0 10px 34px rgba(10,20,26,.16); }
  .fcard.anchor .fhead { border-bottom:2px solid var(--accent); padding:20px 22px 14px; }
  .fcard.anchor .fname { font-size:19px; }
  .fhead { padding:13px 16px 10px; border-bottom:1px solid var(--row-line); cursor:pointer; }
  .feyebrow { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  .fcard.fuzzy .feyebrow { color:var(--fuzzy); }
  .fcard.geo .feyebrow { color:var(--geo); }
  .fname { font-family:var(--mono); font-size:13.5px; font-weight:600; word-break:break-word; }
  .ftitle { font-size:12px; margin-top:3px; font-weight:500; }
  .fdesc { font-size:11px; line-height:1.45; color:var(--ink-soft); margin-top:5px; }
  .jline { font-family:var(--mono); font-size:9.5px; margin-top:4px; color:var(--accent); }
  .fcard.geo .jline { color:var(--geo); }
  .fcard.fuzzy .jline { color:var(--fuzzy); }
  .rdot { display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:6px; vertical-align:baseline; }
  .came { font-family:var(--mono); font-size:9px; letter-spacing:.08em;
    color:var(--ink-soft); margin-bottom:3px; }
  .fcard.cameFrom { outline:1px dashed var(--accent); outline-offset:2px; }
  .ringlab { position:absolute; font-family:var(--mono); font-size:10px;
    letter-spacing:.1em; text-transform:uppercase; background:var(--ground);
    border:1px solid var(--card-edge); border-radius:4px; padding:2px 8px;
    pointer-events:none; white-space:nowrap; }
  .ringlab.steel { color:var(--accent); }
  .ringlab.geo { color:var(--geo); }
  .ringlab.fuzzy { color:var(--fuzzy); }
  .fbody .fcols { padding:4px 0 6px; }
  .fgroup { font-family:var(--mono); font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); padding:7px 16px 2px; }
  .frow { display:grid; grid-template-columns:150px 1fr; gap:10px; padding:3px 16px;
    border-bottom:1px solid var(--row-line); align-items:baseline; }
  .frow:last-child { border-bottom:none; }
  .fc { font-family:var(--mono); font-size:10px; font-weight:500; word-break:break-all; }
  .fd { font-size:10.5px; color:var(--ink-soft); }
  .fmore { font-family:var(--mono); font-size:10px; color:var(--ink-soft); padding:6px 16px; }
  .showall { font-family:var(--mono); font-size:10px; color:var(--accent);
    background:none; border:none; cursor:pointer; padding:6px 16px; text-align:left; }
  .ffoot { font-family:var(--mono); font-size:9.5px; color:var(--ink-soft);
    padding:7px 16px 9px; border-top:1px solid var(--row-line);
    display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .walk { font-family:var(--mono); font-size:10px; color:var(--accent); background:var(--accent-soft);
    border:none; border-radius:4px; padding:4px 10px; cursor:pointer; }
  .fcard.open { z-index:20; box-shadow:0 10px 30px rgba(10,20,26,.22); }

  #topbar { position:fixed; left:14px; top:12px; z-index:6; display:flex; gap:10px; align-items:center;
    font-family:var(--mono); font-size:11px; flex-wrap:wrap; max-width:70vw; }
  .crumb, #atlasBtn { background:var(--card); border:1px solid var(--card-edge); border-radius:4px;
    padding:4px 9px; cursor:pointer; color:var(--ink-soft); font-family:var(--mono); font-size:11px; }
  .crumb.here { color:var(--accent); border-color:var(--accent); }
  #crumbs { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #jump { font-family:var(--mono); font-size:11px; background:var(--card); color:var(--ink);
    border:1px solid var(--card-edge); border-radius:4px; padding:5px 9px; width:260px; }
  #hint { position:fixed; left:14px; bottom:12px; font-family:var(--mono); font-size:11px;
    color:var(--ink-soft); background:var(--card); border:1px solid var(--card-edge);
    border-radius:5px; padding:5px 10px; z-index:5; }
  #legend { position:fixed; right:14px; bottom:12px; font-family:var(--mono); font-size:11px;
    background:var(--card); border:1px solid var(--card-edge); border-radius:5px;
    padding:7px 12px; z-index:5; display:grid; gap:4px; }
  .lg { display:flex; align-items:center; gap:8px; color:var(--ink-soft); }
  .sw { width:22px; height:0; border-top:2px solid; }
  .sw.dash { border-top-style:dashed; }
  #whereami { font-family:var(--mono); font-size:11px; color:var(--accent);
    background:var(--card); border:1px solid var(--card-edge); border-radius:4px; padding:4px 9px; }
  #whereami:empty { display:none; }
  #zoomer { position:fixed; right:14px; top:12px; z-index:6; display:flex; gap:6px; }
  #zoomer button { font-family:var(--mono); font-size:15px; width:34px; height:34px;
    background:var(--card); color:var(--ink); border:1px solid var(--card-edge);
    border-radius:5px; cursor:pointer; }
  #brand { position:fixed; left:50%; top:12px; transform:translateX(-50%); z-index:6;
    display:flex; gap:14px; align-items:baseline; background:var(--card);
    border:1px solid var(--card-edge); border-radius:6px; padding:6px 16px;
    white-space:nowrap; }
  #brand .bt { font-family:var(--sans); font-weight:700; font-size:13px; letter-spacing:.02em; }
  #brand .bs { font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
  #brand .bs b { color:var(--accent); font-weight:600; }
  #jlist { position:absolute; left:0; top:110%; z-index:50; min-width:340px;
    background:var(--card); border:1px solid var(--card-edge); border-radius:5px;
    box-shadow:0 8px 24px rgba(10,20,26,.18); overflow:hidden; }
  .jrow { padding:6px 10px; cursor:pointer; display:grid; }
  .jrow:hover, .jrow.sel { background:var(--accent-soft); }
  .jrow .jn { font-family:var(--mono); font-size:11px; font-weight:600; }
  .jrow .jt { font-size:10.5px; color:var(--ink-soft); }
</style>

<div id="cosmo"></div>
<div id="tip"></div>
<div id="topbar">
  <button id="atlasBtn" hidden>◂ back to atlas</button>
  <span style="position:relative">
    <input id="jump" placeholder="find a table…" autocomplete="off">
    <div id="jlist" hidden></div>
  </span>
  <span id="whereami"></span>
  <div id="crumbs"></div>
</div>
<div id="brand"><span class="bt">Ripple Warehouse</span><span class="bs" id="brandStats"></span></div>
<div id="zoomer">
  <button data-z="in">+</button><button data-z="out">−</button><button data-z="fit">⌂</button><button data-z="gen" title="replay the warehouse being born">⟲</button>
</div>
<div id="world">
  <svg class="wires" id="wires"></svg>
  <div id="cards"></div>
</div>
<div id="hint">scroll to zoom · drag to pan · hover a table for its reach · click to walk</div>
<div id="legend">
  <div class="lg"><span class="sw" style="border-color:var(--accent)"></span>identity ID join</div>
  <div class="lg"><span class="sw" style="border-color:var(--geo)"></span>shared geography</div>
  <div class="lg"><span class="sw" style="border-color:var(--fuzzy)"></span>name-based match</div>
  <div class="lg"><span class="sw dash" style="border-color:var(--fuzzy)"></span>between neighbors</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@cosmos.gl/graph@3.4.1/dist/index.min.js"></script>
<script>
const HASGL = typeof Cosmos !== 'undefined';
const Graph = HASGL ? Cosmos.Graph : null;
const DATA = __DATA__;
let lastMX = innerWidth / 2, lastMY = innerHeight / 2;
addEventListener('mousemove', e => { lastMX = e.clientX; lastMY = e.clientY; }, {passive: true});
const world = document.getElementById('world');
const cardsEl = document.getElementById('cards');
const wiresEl = document.getElementById('wires');
const tipEl = document.getElementById('tip');
const GOLD = 137.507764 * Math.PI / 180;
const FUZZY = new Set(['NAME@ZIP','NAME','NAME~ADDR']);
const GEO = new Set(['ZIP','FIPS','GEO_IN','STATE','COUNTRY','COUNTY','TRACT','CBSA']);
const klass = k => FUZZY.has(k) ? 'fuzzy' : (GEO.has(k) ? 'geo' : 'steel');
const MAXN = 80;
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
const fmt = n => n.toLocaleString('en-US');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const [WX, WY] = DATA.world;
world.style.width = WX + 'px'; world.style.height = WY + 'px';
wiresEl.style.width = WX + 'px'; wiresEl.style.height = WY + 'px';
const CX = WX/2, CY = WY/2;

let mode = '', trail = [], lastAnchor = null;

// ---- genesis generations (breadth-first birth order) ----
const GEN = {};
let MAXGEN = 0;
{
  const all = Object.keys(DATA.nodes);
  const seen = new Set();
  const seeds = all.filter(n => (DATA.nodes[n].deg || 0) > 0)
    .sort((a, b) => DATA.nodes[b].deg - DATA.nodes[a].deg);
  for (const seed of seeds) {
    if (seen.has(seed)) continue;
    let frontier = [seed]; seen.add(seed);
    let g = seen.size === 1 ? 0 : MAXGEN + 1;
    while (frontier.length) {
      for (const n of frontier) GEN[n] = g;
      MAXGEN = Math.max(MAXGEN, g);
      const next = [];
      for (const n of frontier)
        for (const b of Object.keys(DATA.adj[n] || {}))
          if (!seen.has(b)) { seen.add(b); next.push(b); }
      frontier = next; g += 1;
    }
  }
  for (const n of all) if (GEN[n] === undefined) GEN[n] = MAXGEN + 1;
  MAXGEN += 1;
}

// ---- cosmos data arrays ----
const NAMES = Object.keys(DATA.nodes);
const IDX = {}; NAMES.forEach((n, i) => IDX[n] = i);
const N = NAMES.length;

const css = getComputedStyle(document.documentElement);
function rgba(varName, a) {
  const v = css.getPropertyValue(varName).trim();
  const h = v.replace('#', '');
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255,
          parseInt(h.slice(4,6),16)/255, a];
}
const REGC = [0,1,2,3,4,5,6,7].map(i => rgba('--r' + i, 1));
const LINKC = { steel: rgba('--accent', 1), geo: rgba('--geo', 1), fuzzy: rgba('--fuzzy', 1) };

// normalize the settled layout into cosmos space
const SPACE = 4096;
const sc = SPACE / Math.max(WX, WY);
const POS = new Float32Array(N * 2);
NAMES.forEach((n, i) => {
  POS[i*2] = DATA.nodes[n].gx * sc;
  POS[i*2+1] = (WY - DATA.nodes[n].gy) * sc;
});
const SIZES = new Float32Array(N);
const baseColors = new Float32Array(N * 4);
NAMES.forEach((n, i) => {
  const d = DATA.nodes[n].deg;
  SIZES[i] = d ? 2.2 + Math.sqrt(d) * 1.1 : 1.3;
  const c = REGC[DATA.nodes[n].ri] || REGC[7];
  const a = d ? 0.95 : 0.4;
  baseColors.set([c[0], c[1], c[2], a], i * 4);
});
const LINKS = new Float32Array(DATA.aweb.length * 2);
const baseLinkColors = new Float32Array(DATA.aweb.length * 4);
const LINKA = [], LINKB = [];
DATA.aweb.forEach((e, i) => {
  const [,,,, k, strong, na, nb] = e;
  LINKS[i*2] = IDX[na]; LINKS[i*2+1] = IDX[nb];
  LINKA.push(na); LINKB.push(nb);
  const cls = k === 2 ? 'fuzzy' : (k === 1 ? 'geo' : 'steel');
  const c = LINKC[cls];
  baseLinkColors.set([c[0], c[1], c[2], strong ? 0.16 : 0.05], i * 4);
});

const graphStub = new Proxy({}, { get: (t, k) =>
  k === 'getZoomLevel' ? (() => 1)
  : k === 'spaceToScreenPosition' ? (() => [-999, -999])
  : (() => {}) });
const graph = !HASGL ? graphStub : new Graph(document.getElementById('cosmo'), {
  enableSimulation: false,
  backgroundColor: css.getPropertyValue('--ground').trim(),
  pointSizeScale: 1,
  linkDefaultWidth: 1,
  renderHoveredPointRing: true,
  fitViewOnInit: true,
  onClick: (i) => { if (i !== undefined && mode === 'atlas') enterWalk(NAMES[i]); },
  onPointMouseOver: (i, pos, ev) => { if (mode === 'atlas') hoverPoint(i, ev); },
  onPointMouseOut: () => { if (mode === 'atlas') hoverPoint(undefined); },
  onZoom: () => updateLabels(),
});
if (!HASGL) {
  document.getElementById('cosmo').innerHTML =
    `<div style="display:grid;place-items:center;height:100%;font-family:var(--mono);
      font-size:13px;color:var(--ink-soft)">the map engine could not load —
      search still works, and any table opens in walk mode</div>`;
}
graph.setPointPositions(POS, true);
graph.setPointColors(baseColors);
graph.setPointSizes(SIZES);
graph.setLinks(LINKS);
graph.setLinkColors(baseLinkColors);
graph.render();

// ---- floating labels for hubs and regions ----
const labelDefs = [];
for (const nm of DATA.hubs) {
  const i = IDX[nm];
  labelDefs.push({ x: POS[i*2], y: POS[i*2+1], el: mkLabel(DATA.nodes[nm].s, '') });
}
for (const p of DATA.panels) {
  labelDefs.push({ x: p.x * sc, y: (WY - p.y) * sc,
    el: mkLabel(p.r + ' · ' + p.n, 'region') });
}
function mkLabel(text, cls) {
  const el = document.createElement('div');
  el.className = 'clabel ' + cls;
  el.textContent = text.toLowerCase();
  document.body.appendChild(el);
  return el;
}
function updateLabels() {
  const zoomed = graph.getZoomLevel();
  for (const L of labelDefs) {
    const [x, y] = graph.spaceToScreenPosition([L.x, L.y]);
    const on = mode === 'atlas' && x > -100 && x < innerWidth + 100 && y > 0 && y < innerHeight;
    L.el.style.display = on ? '' : 'none';
    if (on) { L.el.style.left = x + 'px'; L.el.style.top = y + 'px'; }
  }
}

// ---- hover: tooltip + three-hop heartbeat via GPU recolor ----
let hoverTimer = null;
function hoverPoint(i, ev) {
  clearTimeout(hoverTimer);
  if (i === undefined) {
    tipEl.style.display = 'none';
    graph.setLinkColors(baseLinkColors);
    graph.setPointColors(baseColors);
    graph.render();
    return;
  }
  const nm = NAMES[i], node = DATA.nodes[nm];
  tipEl.innerHTML = `<div class="tt">${esc(nm)}</div>
    <div class="td">${esc(node.t)} · ${node.deg} joins · click to walk</div>`;
  tipEl.style.display = 'block';
  const px = (ev && ev.clientX !== undefined) ? ev.clientX : lastMX;
  const py = (ev && ev.clientY !== undefined) ? ev.clientY : lastMY;
  tipEl.style.left = Math.min(innerWidth - 360, px + 16) + 'px';
  tipEl.style.top = Math.min(innerHeight - 80, py + 14) + 'px';
  document.getElementById('whereami').textContent = node.deg
    ? `${node.deg} joins from here` : 'frontier — no proven joins yet';
  hoverTimer = setTimeout(() => {
    const hop = {}; hop[nm] = 0;
    let frontier = [nm];
    for (let h = 1; h <= 3; h++) {
      const next = [];
      for (const a of frontier)
        for (const b of Object.keys(DATA.adj[a] || {}))
          if (hop[b] === undefined) { hop[b] = h; next.push(b); }
      frontier = next;
    }
    const lc = new Float32Array(baseLinkColors);
    for (let e = 0; e < LINKA.length; e++) {
      const ha = hop[LINKA[e]], hb = hop[LINKB[e]];
      let a = 0.012;
      if (ha !== undefined && hb !== undefined && Math.min(ha, hb) < 3)
        a = [0.9, 0.45, 0.2][Math.max(ha, hb) - 1] ?? 0.9;
      lc[e*4+3] = a;
    }
    const pc = new Float32Array(baseColors);
    for (let p = 0; p < N; p++) {
      const h = hop[NAMES[p]];
      pc[p*4+3] = h === undefined ? 0.12 : 1;
    }
    graph.setLinkColors(lc);
    graph.setPointColors(pc);
    graph.render();
  }, 60);
}

// ---- genesis replay on the GPU ----
let genRunning = false;
function runGenesis() {
  if (genRunning || reduced || mode !== 'atlas') return;
  genRunning = true;
  const STEP = 0.4, FADE = 0.5, TOTAL = MAXGEN * STEP + FADE + 0.4;
  const t0 = performance.now();
  const tick = now => {
    const t = (now - t0) / 1000;
    const pc = new Float32Array(baseColors);
    const lc = new Float32Array(baseLinkColors);
    for (let p = 0; p < N; p++) {
      const born = GEN[NAMES[p]] * STEP;
      const a = Math.max(0, Math.min(1, (t - born) / FADE));
      pc[p*4+3] = baseColors[p*4+3] * a;
    }
    for (let e = 0; e < LINKA.length; e++) {
      const born = Math.max(GEN[LINKA[e]], GEN[LINKB[e]]) * STEP + 0.2;
      const a = Math.max(0, Math.min(1, (t - born) / FADE));
      lc[e*4+3] = baseLinkColors[e*4+3] * a;
    }
    graph.setPointColors(pc);
    graph.setLinkColors(lc);
    graph.render();
    if (t < TOTAL && genRunning) requestAnimationFrame(tick);
    else {
      genRunning = false;
      graph.setPointColors(baseColors);
      graph.setLinkColors(baseLinkColors);
      graph.render();
    }
  };
  requestAnimationFrame(tick);
}

// ---- walk mode: the DOM card language, unchanged ----
const KEYWORD = {
  steel: 'same IDs on both sides', geo: 'same places on both sides',
  fuzzy: 'names matched, not IDs',
};
function cardHTML(name, cls, rel, isAnchor, cameFrom) {
  const n = DATA.nodes[name];
  const joins = rel ? (rel.co || '').split('+').filter(Boolean) : [];
  const jset = n.c.filter(([c]) => joins.includes(c));
  const rest = n.c.filter(([c]) => !joins.includes(c));
  let rows = '';
  if (jset.length) {
    rows += '<div class="fgroup">Joinable</div>';
    rows += jset.map(([c,d]) => `<div class="frow"><span class="fc">${esc(c)}</span><span class="fd">${esc(d)}</span></div>`).join('');
    rows += '<div class="fgroup">The rest</div>';
  }
  const row = ([c,d]) => `<div class="frow"><span class="fc">${esc(c)}</span><span class="fd">${esc(d)}</span></div>`;
  if (isAnchor && rest.length > 10) {
    const extraNote = n.x > 0 ? `<div class="fmore">+ ${n.x} more columns not in the mart inventory sample</div>` : '';
    rows += rest.slice(0, 10).map(row).join('');
    rows += `<div class="restwrap" hidden>${rest.slice(10).map(row).join('')}${extraNote}</div>`;
    rows += `<button class="showall" data-n="${n.c.length}">show all ${n.c.length} columns ▾</button>`;
  } else {
    rows += rest.map(row).join('');
    if (n.x > 0) rows += `<div class="fmore">+ ${n.x} more columns</div>`;
  }
  if (!n.c.length) rows += '<div class="fmore">columns not in the mart inventory yet</div>';
  if (rel && !joins.length && n.c.length)
    rows = '<div class="fmore">join columns not recorded for this pair</div>' + rows;
  const footRate = rel ? (rel.rate > 100 ? 'fans out' : rel.rate === 0 ? 'no overlap' : rel.rate + '%') : '';
  let foot = rel ? `${esc(rel.key)} · ${footRate} · ${esc(rel.tier)}` : '';
  if (n.tw) foot += `${foot ? ' · ' : ''}twin: ${esc(n.tw)}`;
  const btn = isAnchor ? '' : `<button class="walk" data-walk="${esc(name)}">walk here ⇢</button>`;
  const rateTxt = rel ? (rel.rate > 100 ? 'fans out — one row matches many'
    : rel.rate === 0 ? 'no overlap in the sample'
    : rel.rate + '% overlap') : '';
  const jline = rel && !isAnchor
    ? `<div class="jline">${esc(rel.key)} · ${rateTxt} · ${KEYWORD[cls] || ''}</div>` : '';
  return `<div class="fcard ${cls}${isAnchor ? ' anchor' : ''}${cameFrom ? ' cameFrom' : ''}" id="n_${esc(name)}" data-name="${esc(name)}">
    <div class="fhead">
      ${cameFrom ? '<div class="came">◂ just visited</div>' : ''}
      <div class="feyebrow">${esc(n.p || 'unclassified source')}</div>
      <div class="fname"><span class="rdot" style="background:var(--r${n.ri})"></span>${esc(name)}</div>
      <div class="ftitle">${esc(n.t)}</div>
      ${jline}
      ${n.d ? `<div class="fdesc">${esc(n.d)}</div>` : ''}
    </div>
    <div class="fbody"${isAnchor ? '' : ' hidden'}>
      <div class="fcols">${rows}</div>
      <div class="ffoot"><span>${foot}</span>${btn}</div>
    </div>
  </div>`;
}

function render(anchor) {
  const nb = DATA.adj[anchor] || {};
  const use0 = r => r > 0 && r <= 100 ? r : -1;
  let names = Object.keys(nb).sort((a,b) => use0(nb[b].rate) - use0(nb[a].rate)).slice(0, MAXN);
  const hidden = Math.max(0, Object.keys(nb).length - MAXN);
  names.sort((a,b) => {
    const w = k => k === 'steel' ? 0 : (k === 'geo' ? 1 : 2);
    return (w(klass(nb[a].key)) - w(klass(nb[b].key))) || (use0(nb[b].rate) - use0(nb[a].rate));
  });
  const prev = lastAnchor !== anchor ? lastAnchor : null;
  lastAnchor = anchor;
  cardsEl.innerHTML = cardHTML(anchor, 'steel', null, true) +
    names.map(nm => cardHTML(nm, klass(nb[nm].key), nb[nm], false, nm === prev)).join('') +
    (hidden ? `<div class="fmore" style="position:absolute" id="hiddenNote">+ ${hidden} weaker connections not drawn</div>` : '');
  const anchorEl = document.getElementById('n_' + anchor);
  const mix = {steel: 0, geo: 0, fuzzy: 0};
  Object.values(nb).forEach(r => mix[klass(r.key)]++);
  const footEl = anchorEl.querySelector('.ffoot span');
  const mixTxt = `${Object.keys(nb).length} joins · ${mix.steel} identity · ${mix.geo} geography · ${mix.fuzzy} name`;
  footEl.textContent = footEl.textContent ? mixTxt + ' · ' + footEl.textContent : mixTxt;
  anchorEl.style.left = (CX - 280) + 'px';
  anchorEl.style.top = (CY - anchorEl.offsetHeight/2) + 'px';
  const placed = [rect(anchorEl, 60)];
  let i = 0;
  for (const nm of names) {
    const el = document.getElementById('n_' + nm);
    const w = 380, h = el.offsetHeight;
    let j = i;
    while (true) {
      const r = 560 + 150 * Math.sqrt(j * 2.2);
      const x = CX + r * Math.cos(j * GOLD) * 1.25 - w/2;
      const y = CY + r * Math.sin(j * GOLD) * 0.78 - h/2;
      if (!hits(placed, x, y, w, h)) { el.style.left = x+'px'; el.style.top = y+'px';
        placed.push({x1:x, y1:y, x2:x+w, y2:y+h}); break; }
      j += 0.35;
    }
    i += 1;
  }
  const RN = {steel: 'identity ID joins', geo: 'shared geography', fuzzy: 'name-based matches'};
  const firstOf = {};
  for (const nm of names) {
    const k = klass(nb[nm].key);
    if (!firstOf[k]) firstOf[k] = nm;
  }
  let rl = '';
  for (const [k, nm] of Object.entries(firstOf)) {
    const el = document.getElementById('n_' + nm);
    const cnt = names.filter(x => klass(nb[x].key) === k).length;
    rl += `<div class="ringlab ${k}" style="left:${el.offsetLeft}px;top:${el.offsetTop - 34}px">${RN[k]} · ${cnt}</div>`;
  }
  cardsEl.insertAdjacentHTML('beforeend', rl);
  const note = document.getElementById('hiddenNote');
  if (note) { note.style.left = (CX - 90) + 'px'; note.style.top = (CY + anchorEl.offsetHeight/2 + 20) + 'px'; }
  let svg = '';
  const vis = new Set(names);
  for (const nm of names)
    svg += wire(anchorEl, document.getElementById('n_' + nm), klass(nb[nm].key), anchor, nm);
  const seen = new Set();
  for (const a of names) for (const b of Object.keys(DATA.adj[a] || {})) {
    if (!vis.has(b)) continue;
    const id = a < b ? a+'|'+b : b+'|'+a;
    if (seen.has(id)) continue; seen.add(id);
    svg += wire(document.getElementById('n_' + a), document.getElementById('n_' + b),
                klass(DATA.adj[a][b].key) + ' xwire', a, b);
  }
  wiresEl.innerHTML = svg;
  crumbs();
}

function rect(el, pad) {
  return {x1: el.offsetLeft-(pad||0), y1: el.offsetTop-(pad||0),
          x2: el.offsetLeft+el.offsetWidth+(pad||0), y2: el.offsetTop+el.offsetHeight+(pad||0)};
}
function hits(placed, x, y, w, h) {
  const pad = 34;
  return placed.some(r => x-pad < r.x2 && x+w+pad > r.x1 && y-pad < r.y2 && y+h+pad > r.y1);
}
function edgePt(el, tox, toy) {
  const x = el.offsetLeft, y = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
  const cx = x+w/2, cy = y+h/2, dx = tox-cx, dy = toy-cy;
  const t = Math.min(dx ? (w/2)/Math.abs(dx) : 9e9, dy ? (h/2)/Math.abs(dy) : 9e9);
  return [cx+dx*t, cy+dy*t];
}
function wire(a, b, cls, na, nb2) {
  const acx = a.offsetLeft+a.offsetWidth/2, acy = a.offsetTop+a.offsetHeight/2;
  const bcx = b.offsetLeft+b.offsetWidth/2, bcy = b.offsetTop+b.offsetHeight/2;
  const [x1,y1] = edgePt(a,bcx,bcy), [x2,y2] = edgePt(b,acx,acy);
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  let nx=-(y2-y1), ny=x2-x1;
  const ln=Math.hypot(nx,ny)||1, bow=Math.min(40,ln*0.06);
  return `<path class="edge ${cls}" data-a="${esc(na)}" data-b="${esc(nb2)}" d="M${x1},${y1} Q${mx+nx/ln*bow},${my+ny/ln*bow} ${x2},${y2}"/>`;
}
function redrawWires() {
  wiresEl.querySelectorAll('path').forEach(p => {
    const a = document.getElementById('n_'+p.dataset.a), b = document.getElementById('n_'+p.dataset.b);
    if (!a || !b) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = `<svg>${wire(a,b,'',p.dataset.a,p.dataset.b)}</svg>`;
    p.setAttribute('d', tmp.querySelector('path').getAttribute('d'));
  });
}
function crumbs() {
  document.getElementById('crumbs').innerHTML = trail.map((t,i) =>
    `<span class="crumb${i===trail.length-1?' here':''}" data-i="${i}">${esc(t)}</span>`
  ).join('<span style="color:var(--ink-soft)">→</span>');
}

// ---- mode switching ----
function enterWalk(name) {
  mode = 'walk';
  genRunning = false;
  hoverPoint(undefined);
  document.body.classList.add('walking');
  document.getElementById('atlasBtn').hidden = false;
  document.getElementById('whereami').textContent = '';
  document.getElementById('hint').textContent = 'click a card to expand · walk here to travel · esc for atlas';
  if (!trail.length || trail[trail.length-1] !== name) trail.push(name);
  if (trail.length > 8) trail.shift();
  render(name);
  scale = 0.5; tx = innerWidth/2 - CX*scale; ty = innerHeight/2 - CY*scale; apply();
  updateLabels();
  saveHash();
}
function enterAtlas(focusName) {
  mode = 'atlas';
  document.body.classList.remove('walking');
  cardsEl.innerHTML = ''; wiresEl.innerHTML = '';
  document.getElementById('atlasBtn').hidden = true;
  document.getElementById('crumbs').innerHTML = '';
  document.getElementById('whereami').textContent = '';
  document.getElementById('hint').textContent = 'scroll to zoom · drag to pan · hover a table for its reach · click to walk';
  trail = []; lastAnchor = null;
  if (focusName && IDX[focusName] !== undefined)
    graph.zoomToPointByIndex(IDX[focusName], 700);
  updateLabels();
  history.replaceState(null, '', '#');
}

// ---- interactions (walk mode DOM) ----
let movedFlag = false;
document.addEventListener('click', e => {
  if (movedFlag) return;
  if (e.target.id === 'atlasBtn') { enterAtlas(trail[trail.length-1]); return; }
  const w = e.target.closest('[data-walk]');
  if (w) { enterWalk(w.dataset.walk); return; }
  const cr = e.target.closest('.crumb');
  if (cr) { const i = +cr.dataset.i; trail = trail.slice(0, i+1); render(trail[i]); return; }
  const sa = e.target.closest('.showall');
  if (sa) {
    const wrap = sa.parentElement.querySelector('.restwrap');
    wrap.hidden = !wrap.hidden;
    sa.textContent = wrap.hidden ? `show all ${sa.dataset.n} columns ▾` : 'hide extra columns ▴';
    redrawWires();
    return;
  }
  const head = e.target.closest('.fhead');
  if (head && !head.parentElement.classList.contains('anchor')) {
    const card = head.parentElement, body = card.querySelector('.fbody');
    body.hidden = !body.hidden;
    card.classList.toggle('open', !body.hidden);
    redrawWires();
  }
});
document.addEventListener('mouseover', e => {
  if (mode !== 'walk') return;
  const card = e.target.closest('.fcard');
  if (!card || card.classList.contains('anchor')) { wiresEl.classList.remove('focused'); return; }
  const nm = card.dataset.name;
  wiresEl.classList.add('focused');
  wiresEl.querySelectorAll('path').forEach(p =>
    p.classList.toggle('lit', p.dataset.a === nm || p.dataset.b === nm));
});
document.addEventListener('mouseout', e => {
  if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.fcard'))
    wiresEl.classList.remove('focused');
});

// ---- fuzzy finder ----
const jumpEl = document.getElementById('jump'), jlist = document.getElementById('jlist');
const INDEX = Object.entries(DATA.nodes).map(([nm, n]) =>
  ({nm, hay: (nm + ' ' + n.t + ' ' + (n.p || '')).toUpperCase()}));
let jsel = 0, jhits = [];
function jrender() {
  jlist.hidden = !jhits.length;
  jlist.innerHTML = jhits.map((h, i) =>
    `<div class="jrow${i===jsel?' sel':''}" data-nm="${esc(h.nm)}">
       <span class="jn">${esc(h.nm)}</span><span class="jt">${esc(DATA.nodes[h.nm].t)}</span>
     </div>`).join('');
}
function jgo(nm) {
  jumpEl.value = ''; jhits = []; jrender();
  if (mode === 'atlas' && HASGL) graph.zoomToPointByIndex(IDX[nm], 800);
  else enterWalk(nm);
}
jumpEl.addEventListener('input', () => {
  const q = jumpEl.value.trim().toUpperCase();
  jsel = 0;
  jhits = q ? INDEX.filter(x => q.split(/\s+/).every(w => x.hay.includes(w))).slice(0, 8) : [];
  jrender();
});
jumpEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { jsel = Math.min(jsel+1, jhits.length-1); jrender(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { jsel = Math.max(jsel-1, 0); jrender(); e.preventDefault(); }
  else if (e.key === 'Enter' && jhits[jsel]) jgo(jhits[jsel].nm);
  else if (e.key === 'Escape') { jhits = []; jrender(); }
});
jlist.addEventListener('mousedown', e => {
  const r = e.target.closest('.jrow'); if (r) jgo(r.dataset.nm);
});

// ---- walk-mode camera (DOM pan/zoom) ----
let scale = 0.5, tx = 0, ty = 0, drag = null, hashT = null;
function saveHash() {
  clearTimeout(hashT);
  hashT = setTimeout(() => {
    if (mode === 'walk')
      history.replaceState(null, '', `#w,${trail[trail.length-1]},${Math.round(tx)},${Math.round(ty)},${scale.toFixed(3)}`);
  }, 300);
}
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; saveHash(); };
function zoomAt(px, py, f) {
  const ns = Math.min(2.5, Math.max(0.05, scale*f));
  tx = px - (px-tx)*(ns/scale); ty = py - (py-ty)*(ns/scale);
  scale = ns; apply();
}
addEventListener('pointerdown', e => {
  if (mode !== 'walk') return;
  drag = {x:e.clientX-tx, y:e.clientY-ty}; movedFlag = false;
  document.body.classList.add('panning');
});
addEventListener('pointermove', e => { if (drag && mode === 'walk') {
  if (Math.abs(e.clientX-drag.x-tx)+Math.abs(e.clientY-drag.y-ty) > 3) movedFlag = true;
  tx = e.clientX-drag.x; ty = e.clientY-drag.y; apply(); } });
addEventListener('pointerup', () => { drag = null; movedFlag = false; document.body.classList.remove('panning'); });
addEventListener('wheel', e => {
  if (mode !== 'walk') return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive: false});
document.getElementById('zoomer').addEventListener('click', e => {
  const z = e.target.dataset.z;
  if (mode === 'walk') {
    if (z === 'in') zoomAt(innerWidth/2, innerHeight/2, 1.35);
    else if (z === 'out') zoomAt(innerWidth/2, innerHeight/2, 1/1.35);
    else if (z === 'fit') { scale = 0.4; tx = innerWidth/2 - CX*scale; ty = innerHeight/2 - CY*scale; apply(); }
    return;
  }
  if (z === 'in') graph.setZoomLevel(graph.getZoomLevel() * 1.4, 250);
  else if (z === 'out') graph.setZoomLevel(graph.getZoomLevel() / 1.4, 250);
  else if (z === 'fit') graph.fitView(600);
  else if (z === 'gen') runGenesis();
});
addEventListener('keydown', e => {
  if (e.target === jumpEl) return;
  if (e.key === 'Escape' && mode === 'walk') enterAtlas(trail[trail.length-1]);
});
addEventListener('resize', updateLabels);

// ---- stats badge + boot ----
const ST = DATA.stats || {tables: N, edges: DATA.aweb.length, regions: 7, connected: 0};
document.getElementById('brandStats').innerHTML =
  `<b>${fmt(ST.tables)}</b> tables · <b>${fmt(ST.connected || 0)}</b> joined in · <b>${fmt(ST.edges)}</b> proven joins · <b>${ST.regions}</b> regions`;

const h = location.hash.slice(1).split(',');
if (h[0] === 'w' && DATA.nodes[h[1]]) {
  enterWalk(h[1]);
  if (h.length === 5) { tx = +h[2]; ty = +h[3]; scale = +h[4]; apply(); }
} else {
  mode = 'atlas';
  document.getElementById('hint').textContent = 'scroll to zoom · drag to pan · hover a table for its reach · click to walk';
}
setTimeout(updateLabels, 400);
</script>
