name: dbt

# Validates the ripple_dbt project on every push / PR. `dbt parse` is a pure
# structural check (no warehouse): it catches broken refs, bad macros, and invalid
# schema.yml -- the 73-models-never-run-in-CI gap the discovery sweep flagged.
# The full build+test runs only when the SNOWFLAKE_PAT secret is configured.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library-onboarding/ripple_dbt
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/library-onboarding/ripple_dbt
      # Profile resolves these via env_var(); `dbt parse` never connects, so empty
      # secrets are fine for the structural check.
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
      # 2026-07-31: was ACCOUNTADMIN. RIPPLE_TRANSFORM_RW already exists in the
      # account and its own comment says what it's for -- "dbt transform: read RAW
      # landing + META, build STAGING and MARTS. Least privilege, used by GitHub
      # Actions." The purpose-built role was sitting there unused while CI claimed
      # account-admin rights it never needed. `dbt parse` needs no privileges at
      # all; the gated build step needs exactly what this role grants.
      SNOWFLAKE_ROLE: RIPPLE_TRANSFORM_RW
      SNOWFLAKE_WAREHOUSE: RIPPLE_WH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        # 2026-07-30: this used to install "dbt-fusion==2.0.0-preview.173",
        # a package/version that's never been on PyPI -- pip failed outright
        # and this job had been failing on every push. dbt-core + the
        # Snowflake adapter is what's actually used and verified working
        # (matches requirements-dbt.txt and the local .dbt-venv install).
        # This job runs in its own isolated runner/environment (separate from
        # tests.yml), so installing dbt's pins here is safe even though they
        # conflict with requirements.txt's snowflake-connector-python pin --
        # see requirements-dbt.txt for why dbt is never installed alongside it.
        run: pip install -r ../../requirements-dbt.txt
      - name: dbt deps
        run: dbt deps
      - name: dbt parse (structural validation -- no warehouse)
        run: dbt parse
      - name: dbt build + test (staging + intermediate)
        # Only when a live PAT secret is present (set SNOWFLAKE_PAT in repo secrets).
        if: ${{ env.SNOWFLAKE_PAT != '' }}
        run: dbt build --select staging intermediate
