name: tests

# The repo's first CI. Runs the OFFLINE test suite (no Snowflake) on every push /
# PR — it asserts the SQL the engine generates and the pure-Python logic. The
# @pytest.mark.snowflake tests need a live PAT and are skipped here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # runtime libs (pandas, snowflake-connector, streamlit, plotly — imported by
        # the modules under test) + the test-only deps. The snowflake-marked tests
        # still skip: they need a live PAT, which CI doesn't have.
        #
        # 2026-07-31: this used to install library-onboarding/requirements.txt --
        # an older, narrower, unpinned subset of the real dependency set that
        # predates streamlit/plotly being added anywhere in the repo. It worked by
        # accident only because no test imported serve/ (which needs both) until
        # today. The root requirements.txt is the actual comprehensive, pinned
        # file -- the one README.md's own quick-start tells a new clone to install.
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run offline tests
        run: pytest -q -m "not snowflake"
